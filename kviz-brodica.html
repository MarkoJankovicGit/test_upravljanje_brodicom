rial of this course. Check with the instructor. (Not scored.)"},"pula-n6":{"q":"Is planing allowed between the red island and the headland in Rovinj?","answer":"A local rule — NOT in the material of this course. Check with the instructor / in the local ordinance. (Not scored.)"}},"de":{"kart1":{"q":"In welcher Projektion werden Seekarten erstellt?","choices":["Mercator","Lambert","Gauß","Polar"],"hint":"Sie ist nach Gerhard Kremer benannt, genannt …","ref":"S. 31 — Seekarten"},"kart2":{"q":"Mit welchem griechischen Buchstaben bezeichnet man die geografische BREITE?","choices":["φ (phi)","λ (lambda)","ω (omega)","δ (delta)"],"hint":"Die Breite gehört zu den Breitenkreisen (Parallelen).","ref":"S. 32 — Seekarten / Koordinaten"},"kart3":{"q":"Mit welchem griechischen Buchstaben bezeichnet man die geografische LÄNGE?","choices":["λ (lambda)","φ (phi)","ω (omega)","β (beta)"],"hint":"Die Länge gehört zu den Meridianen.","ref":"S. 32 — Seekarten / Koordinaten"},"kart4":{"q":"Wie viele Meter entspricht eine Seemeile?","choices":["1852 m","1000 m","1609 m","2000 m"],"hint":"Sie entspricht einer Breitenminute.","ref":"S. 32 — 1 NM = 1852 m"},"kart5":{"q":"Welcher Strecke in der Natur entspricht eine Breitenminute auf der Karte?","choices":["Einer Seemeile","Einem Kilometer","Einer Kabellänge","Einem Grad"],"hint":"Deshalb benutzen wir die Breitenskala (links/rechts auf der Karte) zum Messen von Entfernungen.","ref":"S. 32 — jede Minute = 1 NM"},"kart6":{"q":"Wie viele Minuten hat ein Grad?","choices":["60","10","100","360"],"hint":"Genauso wie bei einer Stunde.","ref":"S. 32 — 1° = 60'"},"kart7":{"q":"In wie viele Teile wird eine Minute geteilt und wie heißen diese Teile?","choices":["10 Teile — Kabellängen (kabeli)","60 Teile — Sekunden","100 Teile — Meilen","4 Teile — Quadranten"],"hint":"Auf der Karte ist jeder zweite davon eingezeichnet.","ref":"S. 32 — Minute = 10 Kabellängen"},"kart8":{"q":"Welche Himmelsrichtung ist auf der Seekarte IMMER oben?","choices":["Norden (N)","Süden (S)","Osten (E)","Westen (W)"],"hint":"Links und rechts sind dann westliche und östliche Länge.","ref":"S. 32 — 'N ist immer oben'"},"kart9":{"q":"Mit welcher Farbe sind küstennahe Untiefen (unter 10 m) auf der Karte gekennzeichnet?","choices":["Blau","Gelb","Grün","Rot"],"hint":"Gleiche Logik: 'blau = flaches Wasser', gefährlich für den Tiefgang.","ref":"S. 35 — Untiefen in Blau"},"kart10":{"q":"Mit welcher Farbe ist das Land auf der Seekarte dargestellt?","choices":["Gelb","Blau","Grau","Braun"],"hint":"Der Kurs darf nicht über diese Farbe führen.","ref":"S. 48 — Land gelb"},"kart11":{"q":"Was bedeutet das Symbol 'p' (kroatische Kartenabkürzung) für die Grundart auf der Karte?","choices":["Sand (pijesak)","Untiefe (plićina)","Wrack (podrtina)","Kanal (prokop)"],"hint":"k = Fels/Stein (kamen), t = Seegras (trava), p = …","ref":"S. 35–36 — Grundarten (k, t, p)"},"kart12":{"q":"Welche Karte ist genauer und enthält mehr Angaben?","choices":["Die mit dem KLEINEREN Maßstabsverhältnis (z. B. 1:5.000)","Die mit dem GRÖSSEREN Maßstabsverhältnis (z. B. 1:1.000.000)","Alle Karten sind gleich genau","Die Generalkarte"],"hint":"Hafen- und Meerengenpläne sind am genauesten.","ref":"S. 32 — 'je kleiner das Verhältnis, desto genauer die Karte'"},"kart13":{"q":"In welchem Maßstab werden 'Pläne' (z. B. von Häfen oder Meerengen) erstellt?","choices":["1:10.000 und 1:5.000","1:1.000.000","1:300.000","1:80.000"],"hint":"Das kleinste Verhältnis, die meisten Details — sogar einzelne Felsen.","ref":"S. 32 — Einteilung der Karten"},"kart14":{"q":"Wie werden Linien gleicher Tiefe auf der Karte dargestellt?","choices":["Isobathen (Tiefenlinien)","Isohypsen (Höhenlinien)","Meridiane","Breitenkreise (Parallelen)"],"hint":"'Iso' = gleich; hier gleiche Tiefe.","ref":"S. 35 — Isobathen"},"kart15":{"q":"Wo finden wir auf der Seekarte die MISSWEISUNG (Variation) für ein Gebiet?","choices":["In der eingezeichneten Kompassrose","Im Kartentitel","An den Kartenrändern","Im Lotsenhandbuch (Peljar)"],"hint":"Dort steht auch die jährliche Zunahme/Abnahme dieses Wertes.","ref":"S. 32 — Variation in der Kompassrose"},"kurs1":{"q":"Was ist der WAHRE Kurs (Kp)?","choices":["Der auf der Karte eingezeichnete Kurs (geografisch)","Der vom Kompass angezeigte Kurs","Der Kurs mit berücksichtigter Deviation","Die Windrichtung"],"hint":"'Wahr' = der, den wir selbst in die Karte einzeichnen.","ref":"S. 32 — Kp wird in die Karte eingezeichnet"},"kurs2":{"q":"Was ist ein Azimut (Peilung)?","choices":["Der Winkel, unter dem wir ein Objekt (Landmarke) sehen, wenn wir es anpeilen","Die Entfernung zur Landmarke","Die Geschwindigkeit des Bootes","Der Kompasskurs"],"hint":"Er wird mit einem Handpeilkompass gemessen, z. B. zu einem Leuchtturm oder einer Landspitze.","ref":"S. 32 — Azimut"},"kurs3":{"q":"Was verursacht die MISSWEISUNG (Variation) des Kompasses?","choices":["Der magnetische Pol liegt nicht am Ort des geografischen Pols","Eisen auf dem Boot","Das elektromagnetische Feld des Motors","Die Neigung des Bootes"],"hint":"Der magnetische Pol 'wandert' und fällt nicht mit dem geografischen Pol zusammen.","ref":"S. 14 und 32 — Variation"},"kurs4":{"q":"Was verursacht die DEVIATION (Ablenkung) des Kompasses?","choices":["Der Einfluss von Eisen und elektromagnetischen Feldern an Bord","Die Entfernung vom Pol","Die Höhe über dem Meeresspiegel","Meeresströmungen"],"hint":"Sie ist für jedes Boot anders — es wird eine eigene Tabelle erstellt.","ref":"S. 14 und 32 — Deviation"},"kurs5":{"q":"Wie lautet die Formel für den wahren Kurs Kp?","choices":["Kp = Kk + (±dev) + (±var)","Kp = Kk − dev − var","Kp = Km + dev","Kp = var + dev"],"hint":"Zum Kompasskurs addiert man die Deviation, dann die Variation.","ref":"S. 32–33 und 49 — Formeln"},"kurs6":{"q":"Was ist 1 Knoten?","choices":["Eine Geschwindigkeit von 1 Seemeile pro Stunde","1 zurückgelegte Seemeile","1852 Meter","1 Grad Kurs"],"hint":"Ein Maß für Geschwindigkeit, nicht für Entfernung.","ref":"S. 33 — 1 kn = 1 NM/h"},"kurs7":{"q":"Wie viele Grad beträgt der Kurs nach SÜDEN?","choices":["180°","90°","270°","360°"],"hint":"N=0°, E=90°, S=?, W=270°.","ref":"S. 48 — Kompassrose"},"kurs8":{"q":"Wie viele Grad beträgt der Kurs nach WESTEN?","choices":["270°","90°","180°","0°"],"hint":"N=0°, E=90°, S=180°, W=?","ref":"S. 48 — Kompassrose"},"kurs9":{"q":"Welche Hilfsmittel verwenden wir für die Arbeit auf der Seekarte?","choices":["Zwei Dreiecke, Stechzirkel, Bleistift und Radiergummi","Lineal und Winkelmesser","Nur GPS","Kompass und Fernglas"],"hint":"Die Dreiecke verschieben wir bis zur Kompassrose; der Zirkel 'schreitet' den Kurs ab.","ref":"S. 33 — Hilfsmittel für die Kartenarbeit"},"kurs10":{"q":"Wie viele Landmarken sind mindestens nötig, um die Position durch Azimutpeilung zu bestimmen?","choices":["Zwei","Eine","Vier","Null"],"hint":"Drei ergeben eine höhere Genauigkeit (kleines Dreieck).","ref":"S. 34 — Schnittpunkt zweier Azimute"},"kurs11":{"q":"Mit welcher Formel erhält man die Zeit (in Minuten), die für eine Seemeile benötigt wird?","choices":["60 geteilt durch die Anzahl der Knoten","Anzahl der Knoten × 60","Meilen × Knoten","60 × Meilen"],"hint":"Das Ergebnis multipliziert man mit den gesamten Meilen des Kurses.","ref":"S. 34 — Zeitformel"},"kurs12":{"q":"Wie viel ist 11°30' in Dezimalgrad ausgedrückt?","choices":["11,5°","11,3°","11,05°","11,50'"],"hint":"Je 6 Minuten = ein Zehntel Grad.","ref":"S. 34 — Umrechnung von Minuten in Dezimalstellen"},"kurs13":{"q":"Wenn wir 24 Meilen in 4 Stunden zurücklegen, wie hoch ist die Durchschnittsgeschwindigkeit?","choices":["6 Knoten","4 Knoten","8 Knoten","12 Knoten"],"hint":"Geschwindigkeit = zurückgelegte Strecke ÷ Zeit.","ref":"S. 49 — Geschwindigkeitsbeispiel"},"kurs14":{"q":"Wodurch wird der gegisste (ungefähre) Schiffsort bestimmt?","choices":["Durch den bekannten Kurs, die verstrichene Zeit und die Durchschnittsgeschwindigkeit","Nur durch GPS","Durch das Echolot","Durch das Barometer"],"hint":"Es gibt keine Landmarken, aber du weißt, wohin und wie lange du gefahren bist.","ref":"S. 49 — gegisster Ort (Koppelort)"},"kurs15":{"q":"Wie heißt der Kurs, den der Kompass tatsächlich anzeigt, mit allen seinen 'Lügen' (Variation + Deviation)?","choices":["Kompasskurs (Kk)","Wahrer Kurs (Kp)","Magnetkurs (Km)","Azimut"],"hint":"Es ist das, was du direkt auf der Kompassrose abliest.","ref":"S. 32 — Kk"},"svj1":{"q":"Was ist ein Leuchtturm?","choices":["Ein Leuchtzeichen und eine Landmarke am Fahrwasser","Eine Schiffsart","Ein Radarreflektor","Eine Festmacherboje"],"hint":"Das Wort sagt es schon — er gibt Licht.","ref":"S. 37 — Leuchtzeichen"},"svj2":{"q":"Wo finden wir die Kennung (z. B. den Blinkrhythmus) eines bestimmten Leuchtturms?","choices":["Auf der Seekarte","Am Leuchtturm selbst","Im Logbuch","Auf dem GPS"],"hint":"Diese Angaben können wir schon vor der Fahrt überprüfen.","ref":"S. 35–37 — Leuchtturmkennungen auf der Karte"},"svj3":{"q":"Was bedeutet die Abkürzung 'Bl' (kroatische Bezeichnung; international Fl) in der Beschreibung eines Feuers?","choices":["Blitz (Blinken)","Weiß","Blässe","Nähe"],"hint":"Sie beschreibt den Lichtrhythmus (z. B. K Bl = kurzer Blitz).","ref":"S. 55 — Feuerkürzel (IALA-Anhang)"},"svj4":{"q":"Können Tonnen (Seezeichen) ohne Lichtsignal sein?","choices":["Ja — dann sind sie farbig gestrichen oder haben ein Tagzeichen","Nein, alle müssen leuchten","Nur nachts","Nur bei Nebel"],"hint":"Deshalb muss man auf Farbe und Form des Tagzeichens achten.","ref":"S. 37 — Zeichen ohne Licht"},"svj5":{"q":"Was haben manche Leuchttürme außer dem Licht?","choices":["Eine Einrichtung für Schallsignale","Eine Radarkanone","Einen Ankerplatz","Eine Tankstelle"],"hint":"Nützlich bei Nebel, wenn man das Licht nicht sieht.","ref":"S. 37 — Schallsignale am Leuchtturm"},"svj6":{"q":"Wer verkauft in Kroatien nautische Veröffentlichungen (Lotsenhandbuch, Leuchtfeuerverzeichnis, Karten)?","choices":["Plovput aus Split","Das Hafenkapitanat (Lučka kapetanija)","Nautika Klub","HAK (Kroatischer Automobilclub)"],"hint":"Über seine Büros entlang der gesamten kroatischen Adria.","ref":"S. 52 — Handbücher für die Navigation"},"svj7":{"q":"Wozu dient das 'Verzeichnis der Leuchtfeuer und Nebelsignale'?","choices":["Ein Handbuch zur Karte mit Angaben zu Leuchttürmen und Signalen","Eine Bußgeldliste","Eine Bootsliste","Ein Fährfahrplan"],"hint":"Es gehört zur Pflichtausrüstung und zu den Navigationshandbüchern.","ref":"S. 28 und 52 — Veröffentlichungen"},"sid1":{"q":"Wievielmal länger als die Wassertiefe muss die Ankerleine sein?","choices":["Mindestens 4-mal","Mindestens 2-mal","Gleich der Tiefe","10-mal"],"hint":"Je weiter sie ausgelegt ist, desto besser gräbt sich der Anker ein und hält.","ref":"S. 10 — Regel für die Ankerleine"},"sid2":{"q":"Wenn das Meer 2 m tief ist, wie lang muss die Ankerleine mindestens sein?","choices":["8 m","2 m","4 m","16 m"],"hint":"Tiefe × 4.","ref":"S. 10 — Beispiel (2 m → 8 m)"},"sid3":{"q":"Wie lautet die inoffizielle Formel für das Ankergewicht (für Boote bis 7 m)?","choices":["1 kg Anker pro Meter Bootslänge","5 kg pro Meter","10 kg fest","0,5 kg pro Meter"],"hint":"Bei längeren Booten kommen noch mindestens 30 % dazu.","ref":"S. 9 — Ankergewicht"},"sid4":{"q":"Welcher Anker mit breiten Flunken hält eingegraben in Schlamm oder Sand am besten?","choices":["Danforth","Admiralitätsanker","Draggen (mačak)","Klappanker"],"hint":"Man sagt, einer mit 5 kg hält wie ein anderer mit 15 kg.","ref":"S. 9 — Ankertypen"},"sid5":{"q":"Wozu dient der Treibanker (Sturmanker) — der 'Wasserfallschirm'?","choices":["Er hält den Bug im Wind und bremst das Boot, wenn kein Antrieb vorhanden ist","Zum dauerhaften Ankern im Hafen","Zum Messen der Tiefe","Zum Festmachen am Ufer"],"hint":"Er wird benutzt, wenn der Motor ausfällt, damit wir nicht quer zu den Wellen gedreht werden.","ref":"S. 9–10 — Treibanker"},"sid6":{"q":"Was ist ein Kettenvorlauf (predlanac)?","choices":["Ein Stück Kette (3–4 m), das direkt am Anker angebracht wird","Ein Reserveanker","Ein Schwimmer an der Ankerleine","Eine Knotenart"],"hint":"Er wird an scharfem Fels nicht durchgescheuert und legt sich durch sein Gewicht auf den Grund.","ref":"S. 10 — Kettenvorlauf"},"sid7":{"q":"Wie groß ist der kleinste zulässige Durchmesser der Ankerleine?","choices":["10 mm²","3 mm²","6 mm²","20 mm²"],"hint":"Nicht nur wegen der Festigkeit, sondern auch, damit sie nicht in die Hände schneidet.","ref":"S. 10 — Ankerleine"},"sid8":{"q":"Wie heißt das an der Ankerleine hängende Gewicht, das das Halten des Ankers verbessert?","choices":["'Engel'","'Kater' (Mačak)","'Kuchen' (Kolač)","'Boje'"],"hint":"Es wird vom Heck zum Grund hinabgelassen; nebenbei verhindert es, dass jemand mit der Schraube an der Ankerleine hängen bleibt.","ref":"S. 10 — Gewicht 'Engel'"},"sid9":{"q":"Darf man über den Markierungen von Seekabeln und Rohrleitungen ankern?","choices":["Nein, außer in äußerster Not (Havarie)","Ja, immer","Ja, wenn es flach ist","Nur nachts"],"hint":"Diese Zone ist auf der Karte besonders gekennzeichnet.","ref":"S. 11 — Ankerverbot"},"sid10":{"q":"Wenn sich der Anker an einem Kabel verfängt und wir ihn nicht hochholen können, wen verständigen wir?","choices":["Die nächstgelegene Außenstelle des Hafenkapitanats (lučka kapetanija)","Die Marina","Die Polizei","Plovput"],"hint":"Sie holen uns den Anker kostenlos herauf.","ref":"S. 11 — Anker am Kabel verfangen"},"sid11":{"q":"Was ist eine Trippleine (orepina)?","choices":["Eine am Ankerkopf befestigte Leine mit Schwimmer an der Oberfläche zum Ausbrechen des Ankers","Eine Reserve-Ankerleine","Eine Bojenart","Ein Liegeplatz in der Marina"],"hint":"Sie wird an großen, schweren Ankern angebracht; der Schwimmer zeigt, wo der Anker liegt.","ref":"S. 10 — Trippleine"},"sid12":{"q":"Zu welcher Art von Ausrüstung gehören Anker?","choices":["Zur Pflichtausrüstung des Bootes","Zur empfohlenen Ausrüstung","Zur Ersatzausrüstung","Sie gehören nicht zur Ausrüstung"],"hint":"Vorgeschrieben durch die Bootsverordnung (Pravilnik o brodicama).","ref":"S. 9 und 27 — Pflichtausrüstung"},"sid13":{"q":"Wie groß ist laut Tabelle die Masse des Hauptankers für ein 7 m langes Boot?","choices":["9 kg","5 kg","13 kg","27 kg"],"hint":"Tabelle 4.1.1-1: 5 m → 7 kg, 7 m → …","ref":"S. 29 — Tabelle 4.1.1-1"},"sid14":{"q":"Wenn wir mit dem Bug oder Heck zum Ufer anlegen, mit wie vielen Festmacherleinen machen wir fest (und in welcher Form)?","choices":["Mit zwei Leinen, in 'V'-Form","Mit nur einer Leine","Mit vier Leinen hintereinander","Es ist keine Leine nötig"],"hint":"'Zwei sind zwei' — wenn eine reißt, bleibt die andere.","ref":"S. 11 — Festmachen"},"ozn1":{"q":"Zu welchem System gehören Seetonnen und Seezeichen?","choices":["Zum IALA-System","Zum SOLAS-System","Zum MARPOL-System","Zum GMDSS-System"],"hint":"Derselbe Farbanhang am Ende des Skripts.","ref":"S. 55 — IALA-System"},"ozn2":{"q":"Welche Farbe hat das LATERALZEICHEN auf der LINKEN Seite des Fahrwassers (Region A, zu der auch die Adria gehört)?","choices":["Rot","Grün","Gelb","Schwarz"],"hint":"Links = rot; rechts = grün.","ref":"S. 55 — Lateralzeichen, Region A"},"ozn3":{"q":"Welche Farbe hat das LATERALZEICHEN auf der RECHTEN Seite des Fahrwassers (Region A)?","choices":["Grün","Rot","Gelb","Weiß"],"hint":"Das Gegenteil von links (rot).","ref":"S. 55 — Lateralzeichen, Region A"},"ozn4":{"q":"Was zeigen KARDINALZEICHEN an?","choices":["Auf welcher Seite (N/E/S/W) der Gefahr sicheres Wasser liegt","Den Rand eines Hafens","Ein Ankerverbot","Einen Liegeplatz"],"hint":"Sie werden nach den Himmelsrichtungen um Gefahrenstellen herum gesetzt.","ref":"S. 55 — Kardinalzeichen"},"ozn5":{"q":"Wie viele Kardinalzeichen gibt es?","choices":["Vier (N, E, S, W)","Zwei","Acht","Sechs"],"hint":"Entsprechend den vier Haupthimmelsrichtungen.","ref":"S. 55 — Kardinalzeichen"},"ozn6":{"q":"Welche Farben haben Kardinalzeichen?","choices":["Gelb-schwarz","Rot-grün","Rot-weiß","Blau-weiß"],"hint":"Eine Kombination aus Gelb und Schwarz, je nach Seite.","ref":"S. 55 — Kardinalzeichen (Farbanhang)"},"ozn7":{"q":"Wie sieht das Toppzeichen des NORD-Kardinalzeichens aus?","choices":["Zwei schwarze Kegel mit den Spitzen nach OBEN","Zwei Kegel nach unten","Zwei Kugeln","Ein Kreuz"],"hint":"Nord = Pfeile nach oben (Richtung Norden).","ref":"S. 55 — Kardinalzeichen"},"ozn8":{"q":"Welches Toppzeichen hat das SÜD-Kardinalzeichen?","choices":["Zwei Kegel mit den Spitzen nach UNTEN","Zwei Kegel nach oben","Zwei an den Grundflächen verbundene Kegel","Eine Kugel"],"hint":"Das Gegenteil des Nord-Zeichens.","ref":"S. 55 — Kardinalzeichen"},"ozn9":{"q":"Was zeigen SONDERZEICHEN (gelb, mit einem 'X'-Kreuz als Toppzeichen) an?","choices":["Ein besonderes Gebiet (z. B. Kabel, Militärübungen, Zonen)","Sicheres Wasser","Eine Einzelgefahr","Die Hauptfahrrinne"],"hint":"Immer gelb.","ref":"S. 55 — Sonderzeichen"},"ozn10":{"q":"Was zeigen Lateralzeichen an?","choices":["Die Ränder des Fahrwassers / die Hauptfahrrinne","Die Meerestiefe","Die Windrichtung","Einen verbotenen Ankerplatz"],"hint":"Ihre Farbe folgt der linken und rechten Seite.","ref":"S. 55 — Lateralzeichen"},"opr1":{"q":"Durch welche Vorschrift ist die Pflichtausrüstung eines Bootes festgelegt?","choices":["Durch die Bootsverordnung (Pravilnik o brodicama, NN 13/2020)","Durch das MARPOL-Übereinkommen","Durch das SOLAS-Übereinkommen","Durch das Straßengesetz"],"hint":"Die Ausrüstung ist nach Fahrtgebiet (IV bis I) aufgeführt.","ref":"S. 27 — Pflichtausrüstung"},"opr2":{"q":"Für wen muss auf dem Boot eine Rettungsweste vorhanden sein?","choices":["Für alle Personen an Bord (Erwachsene und Kinder)","Nur für den Bootsführer","Nur für Kinder","Für die Hälfte der Passagiere"],"hint":"Während der Fahrt, ohne Ausnahme.","ref":"S. 27 — Rettungsmittel"},"opr3":{"q":"Wie viele Festmacherleinen muss ein Boot mindestens haben und welche Mindestlänge?","choices":["Mindestens 3, nicht kürzer als 5 m","Mindestens 1, beliebige Länge","Mindestens 2, je 10 m","Mindestens 5, je 3 m"],"hint":"Die Länge entspricht der Bootslänge, aber nicht weniger als 5 m.","ref":"S. 27 und 29 — Festmacherleinen"},"opr4":{"q":"Wie lang muss die Schleppleine (tegalj) sein?","choices":["Vier Bootslängen","Eine Bootslänge","5 Meter","Zwei Bootslängen"],"hint":"Deutlich länger als die Festmacherleine.","ref":"S. 27 — Schleppleine"},"opr5":{"q":"Wodurch wird die Befähigung zum Führen eines Bootes nachgewiesen?","choices":["Durch das Befähigungszeugnis für Bootsführer","Durch den Personalausweis","Durch die Fahrterlaubnis (plovidbena dozvola)","Durch eine Bestätigung der Marina"],"hint":"Kategorien A, B oder C.","ref":"S. 47 — Besatzung des Bootes"},"opr6":{"q":"Wie alt muss ein Bootsführer der Kategorie B mindestens sein?","choices":["16 Jahre","15 Jahre","18 Jahre","14 Jahre"],"hint":"Kategorie A verlangt ein Jahr weniger.","ref":"S. 2 — Zeugnisse"},"opr7":{"q":"Wie alt muss ein Bootsführer der Kategorie A mindestens sein?","choices":["15 Jahre","16 Jahre","18 Jahre","12 Jahre"],"hint":"Die niedrigste Altersgrenze der drei Kategorien.","ref":"S. 2 — Zeugnisse"},"opr8":{"q":"Wie alt muss ein Bootsführer der Kategorie C mindestens sein?","choices":["18 Jahre","16 Jahre","15 Jahre","21 Jahre"],"hint":"Verlangt zudem gesundheitliche Voraussetzungen (Sehvermögen, Gehör) und eine längere Ausbildung.","ref":"S. 2 — Zeugnisse"},"opr9":{"q":"Bis zu welcher Länge und Leistung darf ein Bootsführer der Kategorie A ein Boot führen?","choices":["Bis 7 m und bis 15 kW","Bis 12 m und bis 30 kW","Bis 5 m und bis 5 kW","Keine Beschränkung"],"hint":"Fahrtgebiete IIIa, IIIb, IIIc und IV.","ref":"S. 2 — Befugnisse der Kategorie A"},"opr10":{"q":"Wer darf ein Boot mit einer Antriebsleistung von MEHR als 15 kW führen?","choices":["Eine Person ab 18 Jahren mit einem Befähigungszeugnis der Kategorie B","Jeder mit Kategorie A","Eine Person über 16 Jahren","Eine Person mit Kategorie C"],"hint":"Es wird auch ein Alter von 18 Jahren verlangt.","ref":"S. 3 — Leistung > 15 kW"},"opr11":{"q":"Ab welchem Alter darf man ein RUDERBOOT (für den persönlichen Bedarf) führen?","choices":["Älter als 12 Jahre","Älter als 16 Jahre","Älter als 18 Jahre","Keine Beschränkung"],"hint":"Kein Befähigungszeugnis, nur eine Altersgrenze.","ref":"S. 47 — Ruderboot"},"opr12":{"q":"Wie viele Seemeilen von der Küste reicht das Fahrtgebiet IIIa?","choices":["6 NM","3 NM","1 NM","12 NM"],"hint":"IIIa = 6, IIIb = 3, IIIc = 1.","ref":"S. 3 — Fahrtgebiete"},"opr13":{"q":"Wie viele Seemeilen von der Küste reicht das Fahrtgebiet IIIc?","choices":["1 NM","3 NM","6 NM","0,5 NM"],"hint":"Das engste der drei Teilgebiete von III.","ref":"S. 3 — Fahrtgebiete"},"opr14":{"q":"Wo ist die zulässige Anzahl von Personen und Ladung auf dem Boot eingetragen?","choices":["In der Schifffahrtsgenehmigung des Bootes (Dozvola za plovidbu)","Im Befähigungszeugnis des Bootsführers","Am Rumpf des Bootes","Im Lotsenhandbuch"],"hint":"Der Schiffsführer darf nur so viele an Bord nehmen, wie dort angegeben.","ref":"S. 23 — Stabilität und Beladung"},"opr15":{"q":"Was ist bei der Anmeldung zur Bootsführerprüfung vorzulegen?","choices":["2 Fotos 3×2,5 cm, Personalausweis/Reisepass und Zahlungsnachweis","Nur der Personalausweis","Ein ärztliches Attest","Ein Führerschein"],"hint":"Dazu ein ausgefülltes Antragsformular.","ref":"S. 2 — Prüfungsanmeldung"},"vje1":{"q":"Aus welcher Richtung weht die TRAMONTANA?","choices":["Aus Norden (N)","Aus Süden (S)","Aus Osten (O)","Aus Westen (W)"],"hint":"Wird auch Nordwind (sjevernjak) genannt.","ref":"S. 13 — Tramontana (N)"},"vje2":{"q":"Aus welcher Richtung weht die BORA?","choices":["Nordost (NO)","Südost (SO)","West (W)","Süd (S)"],"hint":"Kalte Luft stürzt über die Berge zum Meer hinab.","ref":"S. 16 — Bora (NO)"},"vje3":{"q":"Was ist das Hauptmerkmal der Bora?","choices":["Plötzlich, kalt, trocken, mit starken Böen (refuli)","Warm und feucht, gleichmäßig","Schwach und lang anhaltend","Immer mit Regen"],"hint":"Sie kommt plötzlich und sofort mit voller Stärke.","ref":"S. 16 — Bora"},"vje4":{"q":"Mit welcher Geschwindigkeit kann eine orkanartige Bora wehen?","choices":["Sogar über 200 km/h","Bis 50 km/h","Etwa 100 km/h","Bis 30 km/h"],"hint":"Dann wird sie orkanartig genannt.","ref":"S. 16 — Bora"},"vje5":{"q":"Wann ist die Bora gewöhnlich AM STÄRKSTEN?","choices":["Ganz am Anfang","Nach 24 Stunden","Gegen Ende","Immer gleich"],"hint":"Wegen des plötzlichen Überströmens der Luft über die Berge.","ref":"S. 16 — Bora"},"vje6":{"q":"Welche zwei Arten der Bora unterscheiden wir?","choices":["Antizyklonale (klare) und zyklonale (dunkle/trübe)","Warme und kalte","Sommer- und Winter-Bora","See- und Land-Bora"],"hint":"Die zyklonale ist feuchter ('faule Bora') und bringt Regen.","ref":"S. 16 — Arten der Bora"},"vje7":{"q":"Welcher Wind weht nachts (im Sommer) vom Land aufs Meer?","choices":["Burin","Maestral (Mistral)","Jugo (Schirokko)","Levant"],"hint":"Er entsteht, weil sich das Land nachts schneller abkühlt als das Meer.","ref":"S. 17 — Burin (N)"},"vje8":{"q":"Aus welcher Richtung weht der JUGO (Široko, Schirokko)?","choices":["Südost (SO)","Nordost (NO)","West (W)","Nord (N)"],"hint":"Er weht von Otranto entlang der gesamten Adria.","ref":"S. 17 — Jugo/Široko (SO)"},"vje9":{"q":"Welches Wetter und welche Wellen bringt der Jugo?","choices":["Warm, feucht; lange und hohe Wellen","Kalt und trocken; kurze Wellen","Klar, ohne Wellen","Schnee"],"hint":"Er entwickelt sich allmählich (verstärkt sich über drei Tage).","ref":"S. 17 — Jugo"},"vje10":{"q":"Welcher Wind erzeugt die höchsten Wellen in der Adria (bis 5 m)?","choices":["Jugo (Schirokko)","Bora","Maestral (Mistral)","Tramontana"],"hint":"Er hat freien Raum und eine ständige, gleichmäßige Strömung.","ref":"S. 17 — Jugo, Wellen bis 5 m"},"vje11":{"q":"Aus welcher Richtung weht der LEBIĆ (Garbin)?","choices":["Südwest (SW)","Nordwest (NW)","Ost (O)","Süd (S)"],"hint":"Er führt uns in den Bereich der Gewitterböen und Stürme ein.","ref":"S. 17 — Lebić/Garbin (SW)"},"vje12":{"q":"Wie stark kann der Lebić sein?","choices":["Sturm-/Orkanstärke, bis 12 Bf (68 kn)","Höchstens 5 Bf","Bis 3 Bf","Immer schwach"],"hint":"Mit Niederschlägen und starken, oft kreuzenden Wellen.","ref":"S. 17 — Lebić"},"vje13":{"q":"Aus welcher Richtung weht der PULENAT (Ponente)?","choices":["West (W)","Ost (O)","Nord (N)","Süd (S)"],"hint":"Wird auch Westwind genannt; er wirft große kreuzende Wellen auf.","ref":"S. 17 — Pulenat (W)"},"vje14":{"q":"Was ist eine Nevera?","choices":["Ein lokales Unwetter: plötzlicher Druckabfall und heftiger Wind mit Platzregen","Ein lang anhaltender warmer Wind","Eine Art Nebel","Eine Meeresströmung"],"hint":"Häufiger im Sommer; kurz, aber gefährlich.","ref":"S. 17–18 — Nevera (SW-NW)"},"vje15":{"q":"Welche Wolke kündigt am westlichen Horizont eine Nevera an?","choices":["Eine dunkle pilz-/amboss­förmige Wolke (Cumulonimbus)","Eine weiße, flockige Cumuluswolke","Ein hoher Cirrus","Nebel"],"hint":"Sie wird von Blitzen und Donner begleitet.","ref":"S. 18 — Vorzeichen einer Nevera"},"vje16":{"q":"Wie lange dauert eine Nevera gewöhnlich?","choices":["Eine halbe bis anderthalb Stunden","Den ganzen Tag","3–7 Tage","Einige Minuten"],"hint":"Sie zieht durch, und danach kommt gewöhnlich die Sonne heraus.","ref":"S. 18 — Dauer einer Nevera"},"vje17":{"q":"Was ist eine Wasserhose (Tromba, Surlada)?","choices":["Ein Mini-Tornado über dem Meer","Eine starke Meeresströmung","Eine Wellenart","Eine Nebelwolke"],"hint":"Sie ist als schräg aufrechte, dünne, wandernde Röhre zu sehen.","ref":"S. 18 — Wasserhose"},"vje18":{"q":"Aus welcher Richtung weht der MAESTRAL (Mistral)?","choices":["Nordwest (NW)","Südost (SO)","Ost (O)","Süd (S)"],"hint":"Der Lieblingswind der Wassersportler.","ref":"S. 18 — Maestral (NW)"},"vje19":{"q":"Was für ein Wind ist der Maestral?","choices":["Ein Schönwetterwind, der erfrischt","Ein gefährlicher Sturmwind","Ein kalter Winterwind","Ein Wind, der Regen bringt"],"hint":"Bleibt er im Sommer bei schönem Wetter aus — ein Zeichen für baldige Verschlechterung.","ref":"S. 18 — Maestral"},"vje20":{"q":"Wann beginnt der Maestral gewöhnlich zu wehen?","choices":["Nachdem die Sonne die Luft erwärmt hat, nach 10 Uhr","Im Morgengrauen","Nachts","Immer zur gleichen Zeit, um Mitternacht"],"hint":"Es braucht einige Stunden Erwärmung seit dem frühen Morgen.","ref":"S. 18 — Maestral"},"vje21":{"q":"Welcher Wind ist für die Schifffahrt in der Adria AM GEFÄHRLICHSTEN?","choices":["Bora","Maestral (Mistral)","Burin","Tramontana"],"hint":"Wegen seines plötzlichen Auftretens und der starken Böen.","ref":"S. 17 — Bora am gefährlichsten"},"vje22":{"q":"Welche Wolke ist ein Zeichen für schönes, gutes Wetter?","choices":["Cu (Cumulus) — weiß, flockig wie rohe Baumwolle","Cb (Cumulonimbus)","Ci (Cirrus)","Ns (Nimbostratus)"],"hint":"Sie schweben träge über dem Land oder den Inseln.","ref":"S. 16 — Cu-Wolken"},"vje23":{"q":"Welches Wetter bringt ein Hochdruckgebiet (Antizyklone)?","choices":["Trocken und sonnig","Bewölkt und regnerisch","Nebel","Schnee und Eis"],"hint":"Im Zentrum der höchste Druck (etwa 1020 hPa).","ref":"S. 15 — Antizyklone"},"vje24":{"q":"Welches Wetter bringt ein Tiefdruckgebiet (Zyklone, Depression)?","choices":["Bewölkt und regnerisch","Trocken und sonnig","Klar und ruhig","Immer Bora"],"hint":"Im Zentrum der niedrigste Druck (etwa 980 hPa).","ref":"S. 14–15 — Zyklone"},"vje25":{"q":"Welche sind die VIER Haupthimmelsrichtungen und ihre Kürzel?","choices":["Nord N, Ost O, Süd S, West W","Nur N, S, O","Oben, unten, links, rechts","NO, SO, SW, NW"],"hint":"Dazwischen liegen die Nebenhimmelsrichtungen: NO, SO, SW, NW.","ref":"S. 13 — Himmelsrichtungen"},"zvu1":{"q":"Was bedeutet EIN kurzer Schallsignalton?","choices":["Kursänderung nach Steuerbord","Kursänderung nach Backbord","Fahrt rückwärts","Gefahr"],"hint":"Einer = rechts.","ref":"S. 39 — Schallsignale"},"zvu2":{"q":"Was bedeuten ZWEI kurze Schallsignaltöne?","choices":["Kursänderung nach Backbord","Kursänderung nach Steuerbord","Fahrt rückwärts","Überholen"],"hint":"Zwei = links.","ref":"S. 39 — Schallsignale"},"zvu3":{"q":"Was bedeuten DREI kurze Schallsignaltöne?","choices":["Fahrt rückwärts (nach achtern)","Wendung nach Steuerbord","Wendung nach Backbord","Anhalten"],"hint":"Drei = ich fahre rückwärts.","ref":"S. 39 — Schallsignale"},"zvu4":{"q":"Was bedeuten FÜNF oder mehr kurze Schallsignaltöne?","choices":["Warnung — die Absichten des anderen Schiffes werden nicht verstanden","Hilferuf","Wendung nach Steuerbord","Ankern"],"hint":"Ein Signal des Zweifels/der Warnung.","ref":"S. 39 — Schallsignale"},"zvu5":{"q":"Welches Signal gibt ein Schiff, das sich einer Landspitze oder Biegung nähert und die andere Seite nicht einsehen kann?","choices":["Ein langer Ton","Ein kurzer Ton","Drei kurze Töne","Fünf kurze Töne"],"hint":"Ein Schiff auf der anderen Seite antwortet gleich — mit einem langen Ton.","ref":"S. 39 — Signal an einer Landspitze"},"zvu6":{"q":"Wie bittet ein Schiff in einem engen Fahrwasser um Erlaubnis, auf der STEUERBORD-Seite zu überholen?","choices":["Zwei lange und ein kurzer Ton","Zwei lange und zwei kurze Töne","Ein langer Ton","Drei kurze Töne"],"hint":"Zwei lange + ein kurzer = Steuerbord.","ref":"S. 40 — Überholen"},"zvu7":{"q":"Wie bittet ein Schiff um Erlaubnis, auf der BACKBORD-Seite zu überholen?","choices":["Zwei lange und zwei kurze Töne","Zwei lange und ein kurzer Ton","Ein langer und ein kurzer Ton","Fünf kurze Töne"],"hint":"Zwei lange + zwei kurze = Backbord.","ref":"S. 40 — Überholen"},"zvu8":{"q":"Wie stimmt das vorausfahrende Schiff dem Überholen ZU?","choices":["Ein langer, ein kurzer, ein langer, ein kurzer Ton","Fünf kurze Töne","Drei lange Töne","Ein langer Ton"],"hint":"Wenn keine Antwort kommt — darf nicht überholt werden.","ref":"S. 40 — Antwort auf das Überholsignal"},"zvu9":{"q":"In welchen Abständen geben Schiffe bei Nebel Signale mit dem Nebelhorn?","choices":["Alle 2 Minuten","Alle 30 Sekunden","Jede Minute","Alle 5 Minuten"],"hint":"Ankernde und gestrandete Schiffe läuten häufiger (jede Minute, mit der Glocke).","ref":"S. 40 — Nebelsignale"},"zvu10":{"q":"Welches Nebelsignal gibt ein fahrendes Maschinenschiff?","choices":["Ein langer Ton","Zwei lange Töne","Ein langer und zwei kurze Töne","Vier kurze Töne"],"hint":"Das einfachste Signal — ein langer Ton.","ref":"S. 40 — Nebel, Schiff in Fahrt"},"zvu11":{"q":"Welches Nebelsignal gibt ein Schiff, das in Fahrt ist, aber KEINE Fahrt durchs Wasser macht?","choices":["Zwei lange Töne","Ein langer Ton","Drei kurze Töne","Ein langer und zwei kurze Töne"],"hint":"Ein langer Ton mehr als bei einem Schiff mit Fahrt.","ref":"S. 40 — Nebel"},"zvu12":{"q":"Mit welchem Signal macht sich bei Nebel ein Segelschiff, Fischer, Schlepper oder manövrierunfähiges Schiff bemerkbar?","choices":["Ein langer, gefolgt von zwei kurzen Tönen","Ein langer Ton","Zwei lange Töne","Vier kurze Töne"],"hint":"Lang + zwei kurz — dieselbe Gruppe 'besonderer' Schiffe.","ref":"S. 40 — Nebel, besondere Schiffe"},"zvu13":{"q":"Wie macht sich ein ANKERNDES Schiff bei Nebel bemerkbar?","choices":["Schnelles Läuten der Glocke am Bug, 5 Sekunden lang","Ein langer Ton","Mit dem Horn alle 2 Min.","Drei kurze Signale"],"hint":"Mit der Glocke, und zwar jede Minute.","ref":"S. 40 — ankerndes Schiff im Nebel"},"zvu14":{"q":"Wodurch unterscheidet sich das Signal eines GESTRANDETEN Schiffes von dem eines ankernden?","choices":["Vor und nach dem schnellen Läuten gibt es drei einzelne Glockenschläge","Es unterscheidet sich nicht","Es benutzt das Horn","Es gibt fünf kurze Töne"],"hint":"Wie beim ankernden + drei Schläge davor und danach.","ref":"S. 40 — gestrandetes Schiff"},"zvu15":{"q":"Welches Schiff gibt bei Nebel VIER kurze Töne?","choices":["Ein Lotsenfahrzeug im Dienst","Ein Fischereifahrzeug","Ein Schlepper","Ein ankerndes Schiff"],"hint":"Ein spezielles Signal nur für diesen Dienst.","ref":"S. 40 — Lotsenfahrzeug"},"zvu16":{"q":"Ab welcher Schiffslänge ist für Nebelsignale zusätzlich zur Glocke ein Gong vorgeschrieben?","choices":["Länger als 100 Meter","Länger als 50 Meter","Länger als 20 Meter","Jedes Schiff"],"hint":"Der Gong wird achtern geschlagen, unmittelbar nach der Glocke vorn.","ref":"S. 40 — Gong über 100 m"},"sud1":{"q":"Wer hat in der Regel Vorfahrt — ein großes oder ein kleines Schiff?","choices":["Das große Schiff","Das kleine Schiff","Immer der von rechts","Niemand"],"hint":"Kleinere müssen größeren ausweichen.","ref":"S. 38 — Kollisionsverhütung"},"sud2":{"q":"Wenn zwei Boote einander auf GEGENKURS (auf derselben Linie) begegnen, wie verhalten sie sich?","choices":["Jedes weicht entschlossen um etwa zehn Grad nach Steuerbord aus","Jedes dreht nach Backbord","Sie halten an","Das erste behält den Kurs, das zweite dreht ab"],"hint":"Das Manöver muss entschlossen und rechtzeitig erfolgen.","ref":"S. 38 — Lage (Begegnen)"},"sud3":{"q":"Wenn sich die Kurse zweier Boote KREUZEN, welches hat Vorfahrt?","choices":["Das, das von STEUERBORD kommt","Das, das von Backbord kommt","Das schnellere Boot","Das größere Boot"],"hint":"Die Steuerbord-Regel (Rechts vor Links).","ref":"S. 38 — kreuzende Kurse"},"sud4":{"q":"Wie verhält sich ein Boot, das beim Kreuzen KEINE Vorfahrt hat?","choices":["Es passiert das andere Boot achteraus","Es fährt vor dessen Bug vorbei","Es bleibt auf der Stelle stehen","Es dreht vor ihm nach Backbord"],"hint":"Du fährst hinten vorbei, nicht davor.","ref":"S. 38 — kreuzende Kurse"},"sud5":{"q":"Was muss ein Boot, das beim Kreuzen Vorfahrt HAT, tun?","choices":["Kurs und Geschwindigkeit beibehalten","Beschleunigen","Nach Steuerbord abdrehen","Anhalten"],"hint":"Damit das andere es vorhersehen und umfahren kann.","ref":"S. 38 — Vorfahrtberechtigtes Schiff"},"sud6":{"q":"Wer hat Vorfahrt — ein Motorboot oder ein Segelboot unter Segeln?","choices":["Das Segelboot","Das Motorboot","Wer schneller ist","Immer das Motorboot"],"hint":"Ein Segelboot ist weniger manövrierfähig.","ref":"S. 38 — Segelboot hat Vorfahrt"},"sud7":{"q":"Wer hat Vorfahrt — ein Segelboot oder ein fischendes Fischereifahrzeug?","choices":["Das Fischereifahrzeug","Das Segelboot","Der von rechts","Hängt vom Wind ab"],"hint":"Ein Schiff beim Fischfang ist in seiner Manövrierfähigkeit eingeschränkt.","ref":"S. 38 — Fischereifahrzeug vor Segelboot"},"sud8":{"q":"Welche Fahrzeuge haben Vorfahrt VOR Segelbooten und anderen 'freien' Fahrzeugen?","choices":["Fischereifahrzeuge, manövrierunfähige Schiffe, Schlepper, in der Manövrierfähigkeit oder durch den Tiefgang behinderte Schiffe","Nur große Passagierschiffe","Nur schnellere Schiffe","Niemand im Besonderen"],"hint":"Alle Fahrzeuge mit einer einschränkenden Manövrierbehinderung.","ref":"S. 38 — Fahrzeuge mit Vorfahrt"},"sud9":{"q":"Zwei Segelboote haben den Wind von derselben (Backbord-)Seite. Welches hat Vorfahrt?","choices":["Das in Lee","Das in Luv","Das auf der Steuerbordseite","Das größere Segelboot"],"hint":"Lee = die vom Wind abgewandte, geschützte Seite.","ref":"S. 38 — Segelboote, gleicher Bug"},"sud10":{"q":"Wenn drei gleichrangige Boote zusammentreffen und sich ihre Kurse schneiden, welche Regel gilt?","choices":["Die Steuerbord-Regel (Rechts vor Links)","Die Regel der höheren Geschwindigkeit","Vorrang für das größte","Vorrang für das zuerst eingetroffene"],"hint":"A fährt hinter B, B hinter C vorbei.","ref":"S. 38 — drei Boote"},"sud11":{"q":"Wer hat an der Hafeneinfahrt/-ausfahrt Vorfahrt?","choices":["Wer aus dem Hafen AUSLÄUFT","Wer einläuft","Das kleinere Boot","Das Segelboot"],"hint":"Wenn er ausgelaufen ist, wird Platz frei.","ref":"S. 46 — Ordnung in den Häfen"},"sud12":{"q":"Welches Schiff läuft zuerst in den Hafen ein — das größere oder das kleinere?","choices":["Das größere Schiff läuft zuerst ein, das kleine wartet","Das kleinere immer zuerst","Das von rechts","Es gibt keine Regel"],"hint":"Das kleinere ist wendiger und braucht weniger Platz.","ref":"S. 46 — Ordnung in den Häfen"},"sud13":{"q":"Darf man seine Vorfahrt um jeden Preis erzwingen?","choices":["Nein — manchmal ist eine Kompromisslösung notwendig","Ja, immer","Ja, wenn man größer ist","Nur nachts"],"hint":"Das Ziel ist, eine Kollision zu vermeiden, nicht zu 'gewinnen'.","ref":"S. 38 — Kompromiss"},"svl1":{"q":"Welche Farbe hat das Seitenlicht an der STEUERBORDSEITE eines Schiffes?","choices":["Grün","Rot","Weiß","Gelb"],"hint":"Steuerbord = grün.","ref":"S. 53 — Seitenlichter"},"svl2":{"q":"Welche Farbe hat das Seitenlicht an der BACKBORDSEITE eines Schiffes?","choices":["Rot","Grün","Weiß","Blau"],"hint":"Backbord = rot.","ref":"S. 53 — Seitenlichter"},"svl3":{"q":"Welche Farbe hat das Hecklicht?","choices":["Weiß","Rot","Grün","Gelb"],"hint":"Am Heck, weiß.","ref":"S. 53 — Hecklicht"},"svl4":{"q":"Welches Licht führt ein ANKERNDES Schiff?","choices":["Ein weißes Rundumlicht (von allen Seiten sichtbar)","Ein rotes Rundumlicht","Ein grünes Rundumlicht","Zwei rote"],"hint":"Sichtbar von Bug, beiden Seiten und Heck — weiß.","ref":"S. 53–54 — ankerndes Schiff"},"svl5":{"q":"Wann müssen die Schiffslichter geführt werden?","choices":["Von Sonnenuntergang bis Sonnenaufgang (und tagsüber bei eingeschränkter Sicht)","Nur bei Nebel","Nur im Hafen","Den ganzen Tag"],"hint":"Nacht + verminderte Sicht.","ref":"S. 53 — wann Lichter zu führen sind"},"svl6":{"q":"Welche Lichter führt ein Fischereifahrzeug beim SCHLEPPNETZFISCHEN (Koča, Trawler)?","choices":["Grün über Weiß","Rot über Weiß","Weiß über Rot","Zwei rote"],"hint":"Grün ist oben.","ref":"S. 53 — Trawler (Koča)"},"svl7":{"q":"Welche Lichter führt ein Fischereifahrzeug beim RINGWADENFISCHEN (Plivarica, Ringwadenfischer)?","choices":["Rot über Weiß","Grün über Weiß","Weiß über Rot","Gelb blinkend"],"hint":"Rot ist oben (umgekehrt wie beim Trawler).","ref":"S. 53 — Ringwadenfischer (Plivarica)"},"svl8":{"q":"Welche Lichter führt ein LOTSENFAHRZEUG?","choices":["Weiß über Rot","Rot über Weiß","Grün über Weiß","Zwei weiße"],"hint":"Weiß oben, Rot unten.","ref":"S. 53 — Lotse"},"svl9":{"q":"Welches Licht führt ein Fahrzeug auf einem LUFTKISSEN?","choices":["Gelbes Blinklicht","Violett","Zwei grüne","Rotes Rundumlicht"],"hint":"Zusätzlich zu den üblichen Seitenlichtern und dem Topplicht.","ref":"S. 54 — Luftkissenfahrzeug"},"svl10":{"q":"Welche Lichter führt ein in seiner Manövrierfähigkeit EINGESCHRÄNKTES Fahrzeug?","choices":["Rot-Weiß-Rot (senkrecht)","Drei rote Lichter senkrecht","Zwei rote Lichter senkrecht","Grün-Weiß-Grün"],"hint":"Das mittlere ist weiß.","ref":"S. 54 — manövrierbehindertes Fahrzeug"},"svl11":{"q":"Welche Lichter führt ein TIEFGANGBEHINDERTES Fahrzeug?","choices":["Drei rote Lichter senkrecht","Rot-Weiß-Rot","Zwei rote Lichter senkrecht","Drei grüne"],"hint":"Alle drei haben dieselbe Farbe — rot.","ref":"S. 54 — tiefgangbehindertes Fahrzeug"},"svl12":{"q":"Welche Lichter führt ein MANÖVRIERUNFÄHIGES Fahrzeug (Maschinenschaden, nicht manövrierfähig)?","choices":["Zwei rote Lichter senkrecht","Drei rote Lichter senkrecht","Rot-Weiß-Rot","Zwei grüne"],"hint":"Zwei rote Lichter übereinander.","ref":"S. 54 — manövrierunfähiges Fahrzeug"},"svl13":{"q":"Welches Licht führt ein Boot bis 7 m (ohne Gleitfahrt)?","choices":["Weißes Rundumlicht","Rot und Grün","Drei weiße","Gelbes Blinklicht"],"hint":"Der einfachste Fall — ein einzelnes weißes Licht.","ref":"S. 53 — Boot bis 7 m"},"svl14":{"q":"Welche Lichter führt ein Gleitboot bis 7 m?","choices":["Seitenlichter: grün (Steuerbord) und rot (Backbord)","Nur weiß","Drei rote","Gelbes Blinklicht"],"hint":"Im Gegensatz zu einem gewöhnlichen Boot bis 7 m führt es Seitenlichter.","ref":"S. 53 — Gleitboot bis 7 m"},"svl15":{"q":"Wodurch unterscheiden sich die Lichter eines Segelboots (unter Segeln) von denen eines Motorboots?","choices":["Kein Topplicht (weiß) — nur Seitenlichter und Hecklicht","Es hat zusätzlich ein gelbes Licht","Es hat drei weiße Lichter","Es führt gar keine Lichter"],"hint":"Rot/grüne Seitenlichter + weißes Hecklicht, ohne weißes Topplicht.","ref":"S. 53 — Segelboot unter Segeln"},"rad1":{"q":"Wofür steht die Abkürzung VHF?","choices":["Very High Frequency (Ultrakurzwelle)","Vessel Handling Frequency","Variable Hz Filter","Volt-Hertz-Frequenz"],"hint":"Sie arbeitet im Zwei-Meter-Wellenbereich.","ref":"S. 42 — VHF"},"rad2":{"q":"Welcher ist der ANRUFKANAL im UKW-Seefunk (VHF)?","choices":["Kanal 16","Kanal 70","Kanal 6","Kanal 88"],"hint":"Er wird beim Einschalten des Geräts automatisch aktiviert.","ref":"S. 41 — Anrufkanal 16"},"rad3":{"q":"Auf welcher Frequenz liegt Kanal 16?","choices":["156,8 MHz","2182 kHz","500 kHz","121,5 MHz"],"hint":"Innerhalb des VHF-Bereichs von 156–163 MHz.","ref":"S. 41 — Frequenz von Kanal 16"},"rad4":{"q":"Wofür dient Kanal 16?","choices":["Anruf, Verbindungsaufbau und dringende Meldungen","Nur für Gespräche zwischen Booten","Musik hören","Wettervorhersage"],"hint":"Er wird nur kurz benutzt, dann wechselt man auf einen anderen Arbeitskanal.","ref":"S. 41 — Verwendungszweck von Kanal 16"},"rad5":{"q":"Welche Kanäle sind für Gespräche zwischen Booten vorgesehen?","choices":["70 bis 75","1 bis 5","16 bis 20","28 bis 60"],"hint":"Nach dem Verbindungsaufbau auf 16 wechselt man hierher.","ref":"S. 41 — Kanäle Schiff-Schiff"},"rad6":{"q":"Welcher Kanal wird automatisch aktiviert, wenn wir die Schiffsfunkstelle (BRP) einschalten?","choices":["Kanal 16","Kanal 70","Kanal 6","Kanal 1"],"hint":"Immer der Anrufkanal.","ref":"S. 42 — automatische Aktivierung von Kanal 16"},"rad7":{"q":"Was bedeutet das Wort 'prijam' (over, dt. 'Kommen') am Ende eines Satzes?","choices":["Jetzt ist der Gesprächspartner an der Reihe zu sprechen","Ende der Verbindung","Alles verstanden","Nachricht wiederholen"],"hint":"Bei Simplex-Verbindung kann man nicht gleichzeitig hören und sprechen.","ref":"S. 42 — 'prijam'/'over'"},"rad8":{"q":"Was bedeutet 'gotovo' (out, dt. 'Ende') am Ende einer Verbindung?","choices":["Ende der Verbindung","Wiederholen","Alles verstanden","Warten"],"hint":"Ganz am Schluss, zusammen mit der Verabschiedung.","ref":"S. 42 — Ende der Verbindung"},"rad9":{"q":"Was bedeutet das internationale Wort 'rođer' (Roger)?","c en Buchstaben Q?","choices":["KVIBEK","KVEBEK","KVANTUM","KILO"],"hint":"Von 'Quebec'.","ref":"S. 45 — Buchstabiertafel"},"spl6":{"q":"Welches Wort steht für den Buchstaben R?","choices":["ROMEO","RADAR","RIJEKA","ROBERT"],"hint":"Eine berühmte Figur von Shakespeare.","ref":"S. 45 — Buchstabiertafel"},"spl7":{"q":"Welches Wort steht für den Buchstaben S?","choices":["SIERA","SPLIT","SIGMA","SUNCE"],"hint":"Wie die Gebirgskette (Sierra).","ref":"S. 45 — Buchstabiertafel"},"spl8":{"q":"Welches Wort steht für den Buchstaben U?","choices":["JUNIFORM","UNION","UMAG","UNIVERSAL"],"hint":"Von 'Uniform'.","ref":"S. 45 — Buchstabiertafel"},"spl9":{"q":"Welches Wort steht für den Buchstaben W?","choices":["VISKI","VILJEM","VAŠINGTON","VAL"],"hint":"Von 'Whiskey'.","ref":"S. 45 — Buchstabiertafel"},"spl10":{"q":"Welches Wort steht für den Buchstaben Y?","choices":["JENKI","JELENA","JORK","JAMAHA"],"hint":"Von 'Yankee'.","ref":"S. 45 — Buchstabiertafel"},"spl11":{"q":"Welches Wort steht für den Buchstaben Z?","choices":["ZULU","ZAGREB","ZEBRA","ZORO"],"hint":"Dasselbe wie die Zeitzone 'Z'.","ref":"S. 45 — Buchstabiertafel"},"spl12":{"q":"Welches Wort steht für den Buchstaben G?","choices":["GOLF","GORAN","GRAD","GAMA"],"hint":"Eine Sportart mit Schläger und Ball.","ref":"S. 45 — Buchstabiertafel"},"spl13":{"q":"Welches Wort steht für den Buchstaben N?","choices":["NOVEMBER","NIKOLA","NORD","NAUTIKA"],"hint":"Der elfte Monat.","ref":"S. 45 — Buchstabiertafel"},"spl14":{"q":"Wie wird die Zahl 0 (null) in der Tafel ausgesprochen?","choices":["ZIRO","NULA","ZERO","OSKAR"],"hint":"Vom englischen 'zero'.","ref":"S. 45 — Zahlen"},"spl15":{"q":"Wie wird die Zahl 4 in der Tafel ausgesprochen?","choices":["FOR","FAJF","FOKS","FIR"],"hint":"Vom englischen 'four'.","ref":"S. 45 — Zahlen"},"spl16":{"q":"Wie wird die Zahl 9 in der Tafel ausgesprochen?","choices":["NAJN","NINE","NOVEMBER","NULA"],"hint":"Vom englischen 'nine'.","ref":"S. 45 — Zahlen"},"spl17":{"q":"Welches Wort steht für den Buchstaben D?","choices":["DELTA","DAVID","DUBROVNIK","DIANA"],"hint":"Ein griechischer Buchstabe / eine Flussmündung.","ref":"S. 45 — Buchstabiertafel"},"spl18":{"q":"Welches Wort steht für den Buchstaben M?","choices":["MAJK","MARKO","MIKE","MILAN"],"hint":"Vom englischen Namen 'Mike'.","ref":"S. 45 — Buchstabiertafel"},"kart-n1":{"q":"Warum wird die Entfernung auf der Seekarte am SEITLICHEN Rand (geografische Breite) gemessen und nicht am oberen/unteren Rand?","choices":["Weil Breitenminuten Seemeilen entsprechen, während Längenminuten grafisch unterschiedlich sind (Breitenkreise haben verschiedene Durchmesser)","Weil die Karte oben schmaler ist","Weil oben keine Einteilung vorhanden ist","Weil oben nur Land ist"],"hint":"Die Breitenkreise werden zu den Polen hin immer kleiner.","ref":"S. 32 — Entfernungsmessung"},"kart-n2":{"q":"Eine Seekarte ist älter als 10 Jahre. Was ist zu tun?","choices":["Die Angaben sind nicht mehr sicher — sie muss berichtigt werden (Hafenkapitanat, Lučka kapetanija, kostenlos)","Wegwerfen","Sie ist weiterhin völlig genau","Sie gilt nur nachts"],"hint":"Die Missweisung ändert sich mit den Jahren.","ref":"S. 32 — Alter der Karte"},"kart-n3":{"q":"Welchem Wert entspricht eine Kabellänge?","choices":["Einem Zehntel Seemeile (0,1 NM)","Einer Meile","Einem Grad","Einer Sekunde"],"hint":"Eine Minute (= 1 NM) wird in 10 Kabellängen unterteilt.","ref":"S. 32 — Kabellänge"},"kart-n4":{"q":"Was umfasst eine KURSKARTE (Maßstab ~1:300.000)?","choices":["Etwa die Hälfte der Adria — zur Planung längerer Fahrten","Nur einen Hafen","Die ganze Welt","Eine Insel"],"hint":"Auf ihr plant man eine längere Reise.","ref":"S. 32 — Kurskarte"},"kart-n5":{"q":"Was wird mathematisch mit der Mercator-Projektion erreicht?","choices":["Entfernungen und Kompasswinkel auf der Karte entsprechen denen in der Natur","Dass die Karte rund ist","Dass es keine Verzerrung an den Polen gibt","Dass alles im Maßstab 1:1 ist"],"hint":"Deshalb können wir Kurse genau eintragen und Entfernungen messen.","ref":"S. 31 — Mercator"},"kart-t1":{"q":"Du misst eine Entfernung und nimmst die Minuten vom OBEREN Kartenrand. Ist das richtig?","choices":["Nein — oben/unten sind Längenminuten, die nicht den Meilen entsprechen; benutze den seitlichen (linken/rechten) Rand","Ja, es ist egal, welcher Rand","Ja, der obere Rand ist am genauesten","Nur wenn die Karte neu ist"],"hint":"Meilen liest man an der Breitenskala (seitlich) ab.","ref":"S. 32 — Entfernungsmessung"},"kart-t2":{"q":"Was ist GENAUER: eine Karte 1:80.000 oder ein Plan 1:5.000?","choices":["Der Plan 1:5.000 (kleinere Verhältniszahl = mehr Details)","Die Karte 1:80.000","Sie sind gleich","Hängt vom Gebiet ab"],"hint":"Die kleinere Zahl im Maßstab = genauer.","ref":"S. 32 — Kartenmaßstäbe"},"kart-t3":{"q":"Ein Kollege behauptet: 'Der Nullmeridian verläuft durch die Adria.' Hat er recht?","choices":["Nein — der Nullmeridian liegt bei London (Greenwich); die Adria liegt auf OSTLÄNGE","Ja","Der Nullmeridian ist der Äquator","Ja, durch Split"],"hint":"Der Äquator ist der Nullbreitenkreis, kein Meridian.","ref":"S. 32 — Nullmeridian"},"kart-t4":{"q":"Bedeutet Blau auf der Seekarte tiefes, sicheres Wasser?","choices":["Nein — Blau sind Flachwasserbereiche (unter 10 m), Vorsicht wegen des Tiefgangs","Ja, Blau ist am tiefsten","Blau ist Land","Blau sind Ankerplätze"],"hint":"Land ist gelb, Flachwasser ist blau.","ref":"S. 35 — Farben auf der Karte"},"kurs-n1":{"q":"Wie lautet die Formel für den Kompasskurs (Kk) aus dem rechtweisenden Kurs (Kp)?","choices":["Kk = Kp − (±var) − (±dev)","Kk = Kp + var + dev","Kk = Kp × dev","Kk = var − dev"],"hint":"Umgekehrt zur Formel für Kp — man subtrahiert.","ref":"S. 33 und 49 — Formeln"},"kurs-n2":{"q":"Was ist die Gesamtkorrektur (uk)?","choices":["Die Summe aus Deviation und Missweisung; uk = Kp − Kk","Nur die Missweisung","Nur die Deviation","Die Geschwindigkeit des Schiffs"],"hint":"Sie vereint beide 'Lügen' des Kompasses.","ref":"S. 49 — Gesamtkorrektur"},"kurs-n3":{"q":"Wie berechnet man die rechtweisende Peilung aus dem RECHTEN Seitenpeilwinkel (Ld, Bugwinkel Steuerbord)?","choices":["ωp = Kp + Ld","ωp = Kp − Ld","ωp = Ld − Kp","ωp = Kp × Ld"],"hint":"Beim linken Winkel (Ll) wird subtrahiert.","ref":"S. 49 — ωp = Kp + Ld"},"kurs-n4":{"q":"Was ist 'subočica' (querab)?","choices":["Wenn ein Objekt im Winkel von 90° zum Kurs liegt (querab)","Wenn das Objekt voraus liegt","Wenn das Objekt achteraus liegt","Ein Winkel von 45°"],"hint":"Das Passieren einer Landspitze oder eines Leuchtturms 'querab'.","ref":"S. 50 — querab"},"kurs-n5":{"q":"Warum ist ein Kompass mit einer Rose von mindestens 20 cm Durchmesser zuverlässiger?","choices":["Wegen genauerer Ablesung (kleine Kompasse haben eine Einteilung von 5°)","Weil er schwerer ist","Weil er sich langsamer dreht","Weil er keine Flüssigkeit braucht"],"hint":"Auf einer kleinen Rose kann man kein halbes Grad ablesen.","ref":"S. 34 — Größe der Rose"},"kurs-t1":{"q":"Zeigt der Kompass immer den genauen geografischen Norden?","choices":["Nein — er 'lügt' wegen der Missweisung (Magnetpol) und der Deviation (Eisen/elektromagnetische Felder)","Ja, immer","Er lügt nur nachts","Er lügt nur im Süden"],"hint":"Deshalb gibt es drei Arten von Kursen.","ref":"S. 14 und 32 — Missweisung/Deviation"},"kurs-t2":{"q":"Du hast drei Objekte gepeilt und erhältst ein kleines Dreieck statt eines Punktes. Warum?","choices":["Weil du nicht gleichzeitig gepeilt hast — das Boot hat sich zwischen den Peilungen bewegt","Der Kompass ist defekt","Die Karte ist alt","Drei Objekte ergeben immer ein Fehlerdreieck"],"hint":"Kleineres Dreieck = höhere Genauigkeit.","ref":"S. 34 — Positionsdreieck"},"kurs-t3":{"q":"Du fährst mit der Strömung und den Wellen, und das Ruder 'gehorcht' kaum. Warum?","choices":["Du musst schneller sein als Strömung/Wellen, damit das Wasser auf das Ruderblatt wirkt","Das Ruder ist zu klein","Der Motor ist immer zu schwach","Der Kompass stört"],"hint":"Das Ruder wirkt durch das Wasser, das um das Blatt strömt.","ref":"S. 8 und 47 — Steuern"},"svj-n1":{"q":"Wie viele Blitze pro Gruppe zeigt das OST-Kardinalzeichen (laut IALA-Anhang)?","choices":["3 Blitze","6 Blitze","9 Blitze","Dauerlicht"],"hint":"Ost — die Uhr zeigt 3.","ref":"S. 55 — IALA-Feuer"},"svj-n2":{"q":"Wie wird das SÜD-Kardinalzeichen gekennzeichnet?","choices":["6 Blitze + ein langer Blitz","3 Blitze","9 Blitze","Dauerlicht weiß"],"hint":"6 + lang.","ref":"S. 55 — IALA-Feuer"},"svj-n3":{"q":"Wie viele Blitze zeigt das WEST-Kardinalzeichen?","choices":["9 Blitze","3 Blitze","6 Blitze","1 Blitz"],"hint":"West — die meisten, 9.","ref":"S. 55 — IALA-Feuer"},"svj-t1":{"q":"'Bl 3' und 'Bl 9' (kroatische Kartenabkürzung; international: Fl(3), Fl(9)) sind dasselbe — nur Blitzen?","choices":["Nein — 3 Blitze = Ost, 9 Blitze = West; die Anzahl bestimmt die Seite","Ja, die Anzahl ist egal","Nur die Farbe ist wichtig","Beide bedeuten Nord"],"hint":"Anzahl der Blitze = welche Kardinalseite.","ref":"S. 55 — IALA-Feuer"},"svj-t2":{"q":"Eine Tonne ohne Licht bedeutet nichts und kann ignoriert werden?","choices":["Nein — sie ist farbig bemalt oder hat ein Tagzeichen, das eine Bedeutung trägt","Ja, ohne Licht ist sie unwichtig","Sie bedeutet nur einen Ankerplatz","Sie bedeutet das Ende der Fahrrinne"],"hint":"Achte auf Farbe und Form.","ref":"S. 37 — Zeichen ohne Licht"},"sid-n1":{"q":"Der Anker hat sich unter einem Felsen verklemmt und kommt nicht frei. Vorgehen?","choices":["In die dem Ankermanöver entgegengesetzte Richtung fahren; wenn das nicht hilft, einen Metallring ('kolač') an der Ankerleine hinunterlassen","Die Leine sofort kappen","Senkrecht nach oben ziehen","Ihn zurücklassen"],"hint":"Zuerst die Zugrichtung umkehren.","ref":"S. 10 — Freibekommen eines festsitzenden Ankers"},"sid-n2":{"q":"Seitliches Festmachen am Kai bei starkem ablandigem Wind. Wie vertäust du?","choices":["Mit vier Leinen (Springs): vom Bug eine Leine nach vorn und eine nach achtern, vom Heck eine nach vorn und eine nach achtern","Mit einer einzigen Leine vom Bug","Nur mit dem Anker","Ohne Leinen"],"hint":"Vier Leinen — reißt eine, bleiben drei.","ref":"S. 11 — Spring/Vierleinen-Vertäuung"},"sid-n3":{"q":"Wie groß ist die Masse des HAUPTankers für ein Boot mit 10 m Länge (Tabelle)?","choices":["13 kg","9 kg","27 kg","5 kg"],"hint":"7 m → 9 kg; 10 m → …","ref":"S. 29 — Tabelle 4.1.1-1"},"sid-n4":{"q":"Warum bringen wir am Anker ein kurzes Kettenstück (3–4 m Kette) an?","choices":["Die Leine scheuert nicht an scharfem Fels durch, und das Gewicht zieht das Boot vom Ufer weg","Damit er leichter ist","Damit er leuchtet","Damit er kürzer ist"],"hint":"Wenn eine Welle das Boot bewegt, muss es zuerst die Kette vom Grund heben.","ref":"S. 10 — Vorlaufkette"},"sid-t1":{"q":"Du hältst den Anker direkt unter dem Boot, damit er 'besser hält'. Richtig?","choices":["Nein — die Ankerleine muss mindestens das 4-Fache der Wassertiefe betragen; bei zu kurzer Leine wird der Anker senkrecht hochgezogen und gräbt sich nicht ein","Ja, so hält er am besten","Ja, wenn es flach ist","Das ist egal"],"hint":"Je weiter draußen er liegt, desto besser gräbt er sich ein.","ref":"S. 10 — 4×-Regel"},"sid-t2":{"q":"Für ein 15-m-Boot genügt ein Hauptanker von 13 kg?","choices":["Nein — für 15 m sind es 27 kg; 13 kg gelten für 10 m","Ja","9 kg genügen","Die Masse ist unwichtig"],"hint":"Sieh in der Tabelle nach, sie steigt mit der Länge.","ref":"S. 29 — Tabelle 4.1.1-1"},"sid-t3":{"q":"Als Ankerleine kann auch eine schwimmende Leine dienen?","choices":["Nein — eine schwimmende Leine kann in die Schraube geraten und sich um die Welle wickeln","Ja, sie ist sogar besser","Ja, wenn sie dünn ist","Nur nachts nicht"],"hint":"Gefahr für Schraube/Welle.","ref":"S. 12 — Leinen"},"ozn-n1":{"q":"Wie sieht ein Zeichen für sicheres Wasser aus?","choices":["Rot-weiße senkrechte Streifen (Kugel als Toppzeichen)","Gelb mit einem Kreuz","Schwarz mit rotem Band","Völlig grün"],"hint":"Rot-weiß = Mitte einer sicheren Fahrrinne.","ref":"S. 55 — sicheres Wasser"},"ozn-n2":{"q":"Wie sieht ein Zeichen für eine ISOLIERTE GEFAHRENSTELLE aus?","choices":["Schwarz mit rotem Band (zwei schwarze Kugeln als Toppzeichen)","Gelb","Rot-weiß","Nur grün"],"hint":"Es wird ÜBER der Gefahrenstelle selbst gesetzt.","ref":"S. 55 — isolierte Gefahrenstelle"},"ozn-t1":{"q":"Du siehst eine gelbe Tonne mit einem 'X'-Kreuz. Das ist eine Gefahrenstelle?","choices":["Nein — es ist ein SONDERZEICHEN (z. B. Kabel, Zonen, Militärübungen)","Ja, ein gefährlicher Felsen","Ja, eine isolierte Gefahrenstelle","Nord-Kardinalzeichen"],"hint":"Gelb + X = Sondergebiet.","ref":"S. 55 — Sonderzeichen"},"ozn-t2":{"q":"In Region A ist das Zeichen der linken Seite grün?","choices":["Nein — links (Backbord) ist ROT, rechts (Steuerbord) ist grün","Ja","Beide sind gelb","Links ist schwarz"],"hint":"Die Adria ist Region A.","ref":"S. 55 — Lateralzeichen"},"opr-n1":{"q":"Was umfasst das Fahrtgebiet II?","choices":["Internationale Fahrt auf dem Adriatischen Meer","Alle Meere der Welt","Nur Häfen und Flüsse","Bis 1 NM von der Küste"],"hint":"Zwischen I (alle Meere) und III (Küstengewässer).","ref":"S. 3 — Fahrtgebiete"},"opr-n2":{"q":"Warum müssen Boote aus GFK (Glasfaser) einen Radarreflektor mitführen?","choices":["Weil sie das Radarecho schlecht reflektieren (absorbieren) und andere sie daher kaum sehen","Wegen Blitzschlag","Für besseres GPS","Wegen des Kompasses"],"hint":"Der Reflektor besteht aus Aluminium und verstärkt das Echo.","ref":"S. 51 — Radarreflektor"},"opr-n3":{"q":"Wie lange dauert die Ausbildung für die Kategorie C?","choices":["25 + 6 Unterrichtsstunden, verteilt auf 4 Tage","Einen Tag","Ein Jahr","Nur die Prüfung"],"hint":"Es werden auch gesundheitliche Voraussetzungen verlangt.","ref":"S. 2 — Kategorie C"},"opr-n4":{"q":"Aus wie vielen Fächern besteht das Prüfungsprogramm für die Kategorie B?","choices":["Fünf Fächer","Drei Fächer","Zehn Fächer","Ein Fach"],"hint":"Navigation, Motorenkunde, Seemannschaft/Vorschriften/Meteorologie, Manövrieren/Sicherheit/Erste Hilfe, Sprechfunk.","ref":"S. 2 — Prüfungsprogramm"},"opr-t1":{"q":"Für ein Boot mit 20 kW Leistung genügt die Kategorie A?","choices":["Nein — eine Leistung über 15 kW erfordert das Alter 18 und die Kategorie B","Ja","Ja, ab 16 Jahren","Es ist auch ohne Befähigungszeugnis ausreichend"],"hint":"Kategorie A gilt bis 15 kW und 7 m.","ref":"S. 2–3 — Befugnisse"},"opr-t2":{"q":"Das Gebiet IIIb reicht bis 6 NM von der Küste?","choices":["Nein — IIIb reicht bis 3 NM (IIIa sind 6, IIIc ist 1)","Ja","IIIb reicht bis 12 NM","IIIb reicht bis 1 NM"],"hint":"a=6, b=3, c=1.","ref":"S. 3 — Fahrtgebiete"},"opr-t3":{"q":"Eine Rettungsweste braucht nur der Bootsführer?","choices":["Nein — für ALLE Personen an Bord (Erwachsene und Kinder)","Ja, nur der Bootsführer","Nur für Kinder","Sie ist nicht vorgeschrieben"],"hint":"Während der Fahrt, für alle.","ref":"S. 27 — Rettungsmittel"},"vje-n1":{"q":"Wann ist die Bora (Bura) im Tagesverlauf gewöhnlich am stärksten?","choices":["Gegen 10 Uhr und zwischen 18 und 22 Uhr","Mittags","Im Morgengrauen","Ständig um Mitternacht"],"hint":"Sie lässt um die Mittagszeit und um Mitternacht nach (Gelegenheit zur Flucht).","ref":"S. 16 — Bora"},"vje-n2":{"q":"Wie viele Tage kann die Bora im Winter dauern?","choices":["3 bis 7 Tage","Höchstens 1 Tag","2 Wochen","Nie länger als 6 Stunden"],"hint":"Im Sommer manchmal nur ~2 Tage.","ref":"S. 16 — Bora"},"vje-n3":{"q":"Welche Vorzeichen kündigen den Jugo (Scirocco, SO-Wind) an?","choices":["Trüber/dunstiger Horizont, starke Halos (Höfe), höhere Fluten, Luftdruck unter 1000 hPa","Klarer Himmel und hoher Luftdruck","Bora von den Bergkämmen","Plötzlicher Temperatursturz"],"hint":"Der Jugo drückt das Meer nach Norden (höhere Fluten).","ref":"S. 17 — Jugo, Vorzeichen"},"vje-n4":{"q":"Was ist das Vorzeichen des Lebić (Garbin, SW-Wind)?","choices":["Extrem hohe Flut, ein niedriger Nebelstreifen im SW und ein plötzlicher Druckabfall","Klarer Himmel und der Maestral","Wolkenkappen über dem Velebit","Morgendliche Flaute"],"hint":"Wir geraten in den Bereich von Gewitterböen und Stürmen.","ref":"S. 17 — Lebić"},"vje-n5":{"q":"Wie heißt der stärkere erste Maestral nach Schlechtwetter?","choices":["Maeštralun (besonders im Hvar-Kanal)","Burin","Levant","Neverin"],"hint":"Er tritt auf, wenn er Platz hat, sich auszubreiten.","ref":"S. 18 — Maestral"},"vje-n6":{"q":"Wie ist die ANTIZYKLONALE (klare) Bora?","choices":["Trocken, mit ausgeprägten Böen; sie 'pudert' Wasserstaub auf","Warm und feucht, mit Regen","Ohne Böen, gleichmäßig","Immer nachts"],"hint":"Im Gegensatz zur zyklonalen ('faulen') Bora.","ref":"S. 16 — Boraarten"},"vje-n7":{"q":"Wer veröffentlicht die Seewetterprognose für Wassersportler?","choices":["Pomorski meteorološki centar Split (Seewetterzentrum Split)","Lučka kapetanija Pula (Hafenkapitanat Pula)","HAK (Kroatischer Automobilclub)","Plovput (kroatische Seezeichenverwaltung)"],"hint":"Ein Bericht für Seeleute.","ref":"S. 18 — Wettervorhersagen"},"vje-t1":{"q":"Der Jugo kommt, wie die Bora, plötzlich mit voller Stärke?","choices":["Nein — der Jugo entwickelt sich ALLMÄHLICH (wird über Tage stärker); die Bora kommt plötzlich","Ja, beide plötzlich","Der Jugo ist immer schwach","Der Jugo weht nur nachts"],"hint":"Am ersten Tag schwach, am dritten 'rollt' er.","ref":"S. 16–17 — Jugo und Bora"},"vje-t2":{"q":"Der Maestral ist ein gefährlicher Sturmwind, vor dem man sich hüten muss?","choices":["Nein — der Maestral ist ein SCHÖNWETTER-Wind; Sturmwinde sind Lebić, Pulenat und die Nevera (Gewitterböe)","Ja, er ist orkanartig","Ja, er bringt die Bora","Ja, er türmt Wellen bis 5 m auf"],"hint":"Der Lieblingswind der Wassersportler.","ref":"S. 18 — Maestral"},"vje-t3":{"q":"Eine Wasserhose (Trombe) hält direkt auf dich zu und du kannst nicht entkommen. Der beste Zug?","choices":["Mit möglichst hoher Geschwindigkeit in ihr Zentrum hineinfahren — dort herrscht völlige Windstille","Anhalten und warten","Den Anker werfen","Langsam im rechten Winkel dazu fahren"],"hint":"Das Zentrum des Wirbels ist ruhig.","ref":"S. 18 — Wasserhose"},"vje-t4":{"q":"Eine Cb (Cumulonimbus) in Amboss-Form kündigt schönes Wetter an?","choices":["Nein — sie bringt starken Schauer, Gewitter, Sturm/Nevera (Gewitterböe)","Ja, sie ist ein Zeichen für klares Wetter","Sie bedeutet den Maestral","Sie bedeutet das Ende des Regens"],"hint":"Cu (watteartig) ist Schönwetter, Cb nicht.","ref":"S. 16 — Wolken"},"zvu-n1":{"q":"Ein Maschinenfahrzeug in FAHRT gibt 1 langen Ton. Und ein Fahrzeug, das unter Maschine läuft, aber KEINE Fahrt durchs Wasser macht?","choices":["Zwei lange Töne","Ein langer Ton","Drei kurze","Vier kurze"],"hint":"Ein langer Ton mehr.","ref":"S. 40 — Nebel"},"zvu-n2":{"q":"Ist das Überholen in engen Fahrwassern und Meerengen grundsätzlich erlaubt?","choices":["Nein — die Erlaubnis wird mit den vorgeschriebenen Signalen erbeten","Ja, immer","Nur nachts","Nur für Segelboote"],"hint":"Du fragst mit den Signalen 2 lang + kurz.","ref":"S. 40 — Überholen"},"zvu-n3":{"q":"Was wird beim Überholen zusätzlich zu den Schallsignalen empfohlen?","choices":["UKW-Kanal 16 und ein Licht","Nebelhorn","Raketen","Glocke"],"hint":"Zusätzliche Kommunikation für die Sicherheit.","ref":"S. 40 — Überholen"},"zvu-t1":{"q":"Im Nebel hörst du 1 langen + 2 kurze Töne — glaubst du, es ist ein Lotsenfahrzeug?","choices":["Nein — ein Lotsenfahrzeug gibt 4 kurze Töne; 1 lang + 2 kurz bedeutet Segelfahrzeug/Fischer/Schlepper/manövrierbehindertes Fahrzeug","Ja, das ist ein Lotsenfahrzeug","Das ist ein vor Anker liegendes Fahrzeug","Das ist eine Kursänderung"],"hint":"Lotse = vier kurze.","ref":"S. 40 — Nebel"},"zvu-t2":{"q":"Ein vor Anker liegendes und ein aufgelaufenes Fahrzeug geben im Nebel exakt dasselbe Signal?","choices":["Nein — ein aufgelaufenes Fahrzeug gibt ZUSÄTZLICH drei einzelne Glockenschläge vor und nach dem schnellen Läuten","Ja, sie sind gleich","Das aufgelaufene Fahrzeug benutzt das Horn","Das aufgelaufene Fahrzeug schweigt"],"hint":"Aufgelaufen = vor Anker + 3 Schläge.","ref":"S. 40 — aufgelaufenes Fahrzeug"},"zvu-t3":{"q":"Fünf kurze Töne bedeuten 'ich drehe fünfmal nach Backbord'?","choices":["Nein — es ist ein Warn-/Zweifelssignal (die Absichten des anderen Fahrzeugs werden nicht verstanden)","Ja","Es bedeutet Rückwärtsfahren","Es bedeutet Ankern"],"hint":"Zweifel, kein Manöver.","ref":"S. 39 — Schallsignale"},"sud-n1":{"q":"Segelboot A überholt Segelboot B, Wind von achtern, und die Segel von A stehen an BACKBORD. Auf welcher Seite überholt es?","choices":["An STEUERBORD","An Backbord","Direkt über das Heck","Es darf nicht überholen"],"hint":"Segel links → überholt rechts (und umgekehrt).","ref":"S. 38 — Überholen unter Segeln"},"sud-n2":{"q":"Zwei Segelboote haben beide den Wind von BACKBORD. Wer hat Vorfahrt?","choices":["Das Boot in Lee (das andere ist in Luv)","Das Boot in Luv","Das größere Segelboot","Das schnellere Segelboot"],"hint":"Lee = die geschützte Seite.","ref":"S. 38 — Segelboote"},"sud-n3":{"q":"Wie fährst du an der Mole (am Wellenbrecher) vorbei in den Hafen ein?","choices":["In weitem Bogen, mit angemessenem Abstand, damit du die Ausfahrt einsehen kannst und dem Ausfahrenden ausweichst","So nah wie möglich am Rand der Mole","Mit voller Fahrt","Immer als Erster, ohne zu schauen"],"hint":"Der Ausfahrende hat Vorrang.","ref":"S. 46 — Ordnung in Häfen"},"sud-t1":{"q":"Ein Motorboot hat Vorfahrt vor einem Segelboot, weil es schneller und wendiger ist?","choices":["Nein — das Segelboot (unter Segeln) hat Vorfahrt wegen seiner geringeren Manövrierfähigkeit","Ja, der Motor ist stärker","Ja, wenn es größer ist","Es hängt von der Geschwindigkeit ab"],"hint":"Motor weicht dem Segel.","ref":"S. 38 — Vorfahrt von Segelbooten"},"sud-t2":{"q":"Beim Kreuzen der Kurse hat das Boot Vorfahrt, das von BACKBORD (links) kommt?","choices":["Nein — Vorfahrt hat das Boot von STEUERBORD (rechts)","Ja, das von links hat Vorfahrt","Das schnellere hat Vorfahrt","Es gibt keine Regel"],"hint":"Die Rechts-vor-Links-Regel.","ref":"S. 38 — Kreuzen"},"sud-t3":{"q":"Du hast Vorfahrt, aber der andere weicht nicht aus. Bestehst du bis zum Schluss auf deinem Recht?","choices":["Nein — das Ziel ist, eine Kollision zu vermeiden; notfalls eine Kompromisslösung","Ja, Vorfahrt ist Vorfahrt","Ja, beschleunige und fahre durch","Ja, und signalisiere wütend"],"hint":"Sicherheit vor dem 'Recht'.","ref":"S. 38 — Kompromiss"},"svl-n1":{"q":"Wie viele weiße Topplichter führt ein Fahrzeug von mehr als 50 m Länge?","choices":["Zwei","Eines","Drei","Keines"],"hint":"Längeres Fahrzeug = zwei weiße Lichter hintereinander.","ref":"S. 53 — Fahrzeug über 50 m"},"svl-n2":{"q":"Welches TAGESZEICHEN setzt ein vor Anker liegendes Fahrzeug?","choices":["Eine schwarze Kugel (im Vorschiff)","Drei schwarze Kugeln","Einen schwarzen Zylinder","Zwei Kegel"],"hint":"Tags eine Kugel, nachts ein weißes Rundumlicht.","ref":"S. 41 — Tagzeichen"},"svl-n3":{"q":"Welches TAGESZEICHEN führt ein aufgelaufenes Fahrzeug (länger als 50 m)?","choices":["Drei schwarze Kugeln (senkrecht)","Eine Kugel","Einen schwarzen Rhombus (Raute)","Einen schwarzen Zylinder"],"hint":"Drei Kugeln = aufgelaufen.","ref":"S. 41 — Tagzeichen"},"svl-n4":{"q":"Welches TAGESZEICHEN führt ein manövrierunfähiges Fahrzeug / ein Fahrzeug mit Havarie?","choices":["Zwei schwarze Kugeln","Eine Kugel","Drei Kugeln","Einen schwarzen Zylinder"],"hint":"Zwei Kugeln = manövrierunfähig.","ref":"S. 41 — Tagzeichen"},"svl-t1":{"q":"Drei rote Lichter senkrecht übereinander = manövrierunfähiges Fahrzeug?","choices":["Nein — drei rote Lichter bedeuten 'durch ihren Tiefgang behindert'; ein manövrierunfähiges Fahrzeug zeigt ZWEI rote Lichter","Ja, das ist eine Havarie","Das ist ein Trawler (Schleppnetzfischer)","Das ist ein Lotsenfahrzeug"],"hint":"Tiefgang = 3 rot, Havarie = 2 rot.","ref":"S. 54 — Lichter der Fahrzeuge"},"svl-t2":{"q":"Rot über Weiß = ein Trawler (Schleppnetzfischer)?","choices":["Nein — Rot über Weiß ist ein FISCHER mit anderem Fanggerät (nicht schleppend); ein Trawler zeigt GRÜN über Weiß","Ja, das ist ein Trawler","Das ist ein Lotsenfahrzeug","Das ist ein Segelfahrzeug"],"hint":"Trawler = grün oben.","ref":"S. 53 — Lichter"},"svl-t3":{"q":"Ein Lotsenfahrzeug führt Rot über Weiß?","choices":["Nein — ein Lotsenfahrzeug führt WEISS über Rot","Ja","Ein Lotsenfahrzeug führt 3 rote","Ein Lotsenfahrzeug führt gelbes Blinklicht"],"hint":"Weiß oben, rot unten.","ref":"S. 53 — Lotsenfahrzeug"},"rad-n1":{"q":"Wie viele UKW-Arbeitskanäle gibt es insgesamt und welche sind es?","choices":["56 Kanäle: 1–28 und 60–88","100 Kanäle","Nur 16","10 Kanäle"],"hint":"Die zwischen 28 und 60 sind reserviert (Wetter).","ref":"S. 41 — UKW-Kanäle"},"rad-n2":{"q":"Warum wird für die Verbindung Schiff–Schiff oft die geringere Leistung (1 W) benutzt?","choices":["Sie schont die Batterie, stört andere weniger und die Stimme wird weniger verzerrt","Weil höhere Leistung verboten ist","Weil höhere Leistung leiser ist","Es gibt keinen Grund"],"hint":"25 W sind für größere Reichweiten (~20 NM).","ref":"S. 42 — Sendeleistung"},"rad-n3":{"q":"Womit wird geprüft, ob die Antenne an das Gerät angepasst ist?","choices":["Mit einem SWR-Meter (Stehwellenmessgerät)","Mit einem Voltmeter","Mit einem Kompass","Mit GPS"],"hint":"Eine nicht angepasste Antenne reflektiert Energie zurück und erhitzt den Sender.","ref":"S. 42 — Antenne"},"rad-n4":{"q":"Was bedeutet Dual Watch (DW)?","choices":["Gleichzeitiges Abhören zweier Kanäle, immer einschließlich 16.","Doppelte Leistung","Zwei Mikrofone","Zwei Antennen"],"hint":"Immer zusammen mit Kanal 16.","ref":"S. 42–43 — DW"},"rad-n5":{"q":"Welche Anrufarten gibt es beim DSC?","choices":["Distress, Urgency, Safety, Routine, Ship's business","Nur Mayday","Nur dringende und gewöhnliche","Distress und Ende"],"hint":"Von Seenot bis Schiffsbetrieb.","ref":"S. 45 — DSC-Anrufe"},"rad-n6":{"q":"Wie lautet das Signal für das Ende der Rettung und was bedeutet es?","choices":["SEELONCE FEENEE (silence fini) — Rettung beendet, Frequenzen frei","SEELONCE MAYDAY — Ende","PRU-DONCE — Ende","MAYDAY RELAY — Ende"],"hint":"'Fini' = beendet.","ref":"S. 45 — SEELONCE FEENEE"},"rad-n7":{"q":"Wann ist die 'Funkstille' im Sprechfunk (auf professionellen Frequenzen)?","choices":["2×3 Minuten jede Stunde: zur vollen Stunde und zur 30. Minute (gilt nicht für UKW)","Die ganze Stunde","Nie","Nur nachts"],"hint":"Auf UKW (unserem Bereich) gibt es diese Pflicht nicht.","ref":"S. 42 — Funkstille"},"rad-t1":{"q":"Dir ist der Treibstoff ausgegangen, du bist aber nicht in Lebensgefahr. Rufst du MAYDAY?","choices":["Nein — das ist PAN PAN (Dringlichkeit); Mayday gilt nur bei Lebensgefahr","Ja, immer Mayday","Du rufst Sécurité","Du rufst gar nichts"],"hint":"Mayday = Seenot (Menschenleben in Gefahr).","ref":"S. 44–45 — Prioritätsanrufe"},"rad-t2":{"q":"SEELONCE MAYDAY bedeutet, dass die Rettung BEENDET ist?","choices":["Nein — es bedeutet STILLE auf dem Kanal (nur für die Rettung); das Ende ist SEELONCE FEENEE","Ja, es bedeutet das Ende","Es bedeutet den Beginn eines Gesprächs","Es bedeutet einen Kanalwechsel"],"hint":"'Feenee/fini' = Ende.","ref":"S. 45 — SEELONCE"},"rad-t3":{"q":"Ein Bootsführer darf das Funkgerät auf Englisch auf allen Meeren und Ozeanen benutzen?","choices":["Nein — er hat eine EINGESCHRÄNKTE Berechtigung: kroatische Sprache, im Küstenmeer","Ja, auf allen Meeren","Ja, aber nur nachts","Ja, gegen eine Zusatzgebühr"],"hint":"Das allgemeine Zeugnis (Englisch, alle Meere) ist eine eigene Prüfung.","ref":"S. 41 — Berechtigung"},"rad-t4":{"q":"Du benutzt einen Sécurité-Anruf, wenn jemand auf deinem Boot verletzt ist?","choices":["Nein — bei Verletzung/Dringlichkeit ist es PAN PAN; Sécurité ist für Navigations-/Wetterwarnungen an alle","Ja, Sécurité","Ja, das ist dasselbe wie Mayday","Ja, immer Sécurité"],"hint":"Sécurité betrifft ALLE, die in diesem Gebiet fahren.","ref":"S. 45–46 — Sécurité"},"spel-n1":{"q":"Welchen BUCHSTABEN stellt das Wort TANGO dar?","choices":["T","D","P","G"],"hint":"Die Tabelle rückwärts lesen.","ref":"S. 45 — Tabelle"},"spel-n2":{"q":"Welchen Buchstaben stellt das Wort JUNIFORM dar?","choices":["U","J","Y","I"],"hint":"Von 'Uniform'.","ref":"S. 45 — Tabelle"},"spel-n3":{"q":"Welchen Buchstaben stellt das Wort KVIBEK dar?","choices":["Q","K","W","C"],"hint":"Von 'Quebec'.","ref":"S. 45 — Tabelle"},"spel-n4":{"q":"Wie wird die Zahl 7 in der Tabelle ausgesprochen?","choices":["SEVN","SEDAM","SEVEN","SIKS"],"hint":"Vom englischen 'seven'.","ref":"S. 45 — Zahlen"},"spel-n5":{"q":"Wie wird die Zahl 3 in der Buchstabiertafel ausgesprochen?","choices":["TRI","TREE","TU","TRIJE"],"hint":"Von 'three', aber geschrieben wird TRI.","ref":"S. 45 — Zahlen"},"spel-n6":{"q":"Wie lautet das Wort für den Buchstaben O?","choices":["OSKAR","OTON","OMEGA","OKO"],"hint":"Von 'Oscar'.","ref":"S. 45 — Tafel"},"spel-t1":{"q":"Der Buchstabe Q wird in dieser Tafel 'KVEBEK' ausgesprochen?","choices":["Nein — in der Tafel steht 'KVIBEK'","Ja, KVEBEK","Ja, KVEBIK","KJUBEK"],"hint":"Achte auf die Schreibweise im Skript.","ref":"S. 45 — Tafel"},"spel-t2":{"q":"Der Buchstabe J wird 'JULIJET' ausgesprochen?","choices":["Nein — in der Tafel steht 'ĐULIJET'","Ja, JULIJET","Ja, JULIET","JOTA"],"hint":"Es beginnt mit Đ.","ref":"S. 45 — Tafel"},"spel-t3":{"q":"Der Buchstabe W wird 'VILJEM' ausgesprochen?","choices":["Nein — 'VISKI'","Ja, VILJEM","Ja, VAŠINGTON","VELIKO V"],"hint":"Von 'Whiskey'.","ref":"S. 45 — Tafel"},"uzl1":{"q":"Welcher Knoten wird zum Festmachen auf einen Poller an der Kaimauer gelegt?","choices":["Pašnjak (Poller-Festmacherknoten)","Achtknoten (Osmica)","Kreuzknoten (Muški)","Ankerstek (Sidreni)"],"hint":"Er ermöglicht es, mehrere Boote am selben Poller festzumachen.","ref":"S. 13 — Knoten"},"uzl2":{"q":"Mit welchem Knoten verbindet man zwei Leinen GLEICHER Dicke?","choices":["Kreuzknoten (Muški)","Schotstek (Zastavni)","Achtknoten (Osmica)","Webleinstek (Vrtni)"],"hint":"Für gleiche Dicken.","ref":"S. 13 — Knoten"},"uzl3":{"q":"Mit welchem Knoten verbindet man zwei Leinen UNTERSCHIEDLICHER Dicke?","choices":["Schotstek (Zastavni)","Kreuzknoten (Muški)","Pašnjak (Poller-Festmacherknoten)","Bojenstek (Plutačni)"],"hint":"Für ungleiche Dicken.","ref":"S. 13 — Knoten"},"uzl4":{"q":"Wofür dient der Achtknoten (OSMICA)?","choices":["Er wird am Ende einer Leine geknüpft, damit sie nicht aufdreht oder durch einen Block läuft","Zum Verbinden zweier Leinen","Zum Festmachen an einem Poller","Für den Anker"],"hint":"Ein Stopperknoten am Ende.","ref":"S. 13 — Knoten"},"uzl5":{"q":"Welcher Knoten wird an den Ankerring oder den Schäkel der Ankerkette geknüpft?","choices":["Ankerstek (Sidreni)","Pašnjak (Poller-Festmacherknoten)","Kreuzknoten (Muški)","Achtknoten (Osmica)"],"hint":"Der Name sagt es selbst.","ref":"S. 13 — Knoten"},"uzl6":{"q":"Welcher Knoten kommt an den Ring einer Festmacherboje?","choices":["Bojenstek (Plutačni)","Ankerstek (Sidreni)","Schotstek (Zastavni)","Webleinstek (Vrtni)"],"hint":"Nach der Boje benannt.","ref":"S. 13 — Knoten"},"uzl7":{"q":"Welcher Knoten wird an eine Reling (Fender an der Reling) geknüpft oder über einen Poller gelegt?","choices":["Webleinstek (Vrtni)","Pašnjak (Poller-Festmacherknoten)","Achtknoten (Osmica)","Ankerstek (Sidreni)"],"hint":"Für Fender an der Reling.","ref":"S. 13 — Knoten"},"uzl8":{"q":"Warum ist der Pašnjak beim Festmachen an einem Poller an der Kaimauer vorgeschrieben?","choices":["Er ermöglicht es, mehrere Boote am selben Poller festzumachen, ohne fremde Leinen lösen zu müssen","Weil er der stärkste ist","Weil er leuchtet","Weil er der einfachste ist"],"hint":"Du musst fremde Leinen nicht anfassen.","ref":"S. 13 und 46 — Pašnjak"},"uzl9":{"q":"Woraus bestehen Leinen heute und was ist ihr Vorteil?","choices":["Synthetisch — sie nehmen kein Wasser auf und haben eine höhere Bruchfestigkeit (mit UV-Schutz)","Aus Naturfasern","Aus Metall","Aus Gummi"],"hint":"Früher waren sie aus Manila, Sisal, Kokos.","ref":"S. 12–13 — Leinen"},"uzl10":{"q":"Warum darf die Ankerleine keine schwimmende Leine sein?","choices":["Weil der Schiffspropeller sie erfassen und um die Welle wickeln kann","Weil sie zu langsam sinkt","Weil sie zu teuer ist","Weil man sie nicht sieht"],"hint":"Gefahr für den Propeller.","ref":"S. 12 — Leinen"},"uzl11":{"q":"Zwei Leinen UNTERSCHIEDLICHER Dicke verbindest du mit einem Kreuzknoten?","choices":["Nein — für unterschiedliche Dicken verwendet man den SCHOTSTEK; der Kreuzknoten ist für gleiche Dicken","Ja","Ja, wenn sie ähnlich dick sind","Es ist egal, welcher Knoten"],"hint":"Kreuzknoten = gleiche, Schotstek = unterschiedliche.","ref":"S. 13 — Knoten"},"uzl12":{"q":"Zum Festmachen an einem Poller an der Kaimauer genügt es, die Leine ohne Knoten nur herumzuwickeln?","choices":["Nein — der Pašnjak ist vorgeschrieben","Ja","Ja, wenn das Wetter schön ist","Ein Achtknoten genügt"],"hint":"Der Pašnjak ist die vorgeschriebene Methode.","ref":"S. 13 und 46 — Festmachen"},"mot1":{"q":"Welches sind die zwei Grundgruppen der Verbrennungsmotoren?","choices":["Diesel und Benzin (Otto)","Elektro und Diesel","Zweitakt und Wasser","Dampf und Benzin"],"hint":"Nach Kraftstoff-/Zündart.","ref":"S. 19 — Motoren"},"mot2":{"q":"Wie lauten die Takte eines Viertaktmotors, der Reihe nach?","choices":["Ansaugen, Verdichten, Arbeiten (Expansion), Ausstoßen","Zünden, Kühlen, Expansion, Stopp","Ansaugen, Ausstoßen, Verdichten, Arbeiten","Verdichten, Ansaugen, Ausstoßen, Arbeiten"],"hint":"1 Ansaugen, 2 Verdichten, 3 Arbeiten, 4 Ausstoßen.","ref":"S. 19–20 — Viertakter"},"mot3":{"q":"Wie wird der Kraftstoff im DIESELmotor entzündet?","choices":["Durch Selbstzündung — durch die bei der Verdichtung stark erhitzte Luft (~750 °C)","Durch den Funken der Zündkerze","Durch eine offene Flamme","Durch ein ständig laufendes Heizelement"],"hint":"Es gibt keine Zündkerze.","ref":"S. 20 — Diesel"},"mot4":{"q":"Wie wird das Gemisch im BENZINmotor entzündet?","choices":["Durch den Funken der Zündkerze","Durch Selbstzündung","Durch Druck","Durch ein Heizelement"],"hint":"Deshalb wird eine Stromquelle benötigt.","ref":"S. 20 — Benzinmotor"},"mot5":{"q":"Was saugt der Diesel im 1. Takt an und was der Benziner?","choices":["Der Diesel saugt reine Luft an; der Benziner ein Luft-Kraftstoff-Gemisch","Beide reine Luft","Beide ein Gemisch","Der Diesel ein Gemisch, der Benziner Luft"],"hint":"Beim Diesel kommt der Kraftstoff später (Einspritzung).","ref":"S. 20 — Ansaugen"},"mot6":{"q":"Welcher Takt ist der 'Arbeitstakt' (liefert Leistung)?","choices":["Der dritte — Expansion","Der erste — Ansaugen","Der zweite — Verdichten","Der vierte — Ausstoßen"],"hint":"Die Verbrennung drückt den Kolben nach unten.","ref":"S. 20 — Arbeitstakt"},"mot7":{"q":"Was ist 50 m vor dem Tankstellensteg vorgeschrieben?","choices":["Den Motor abstellen und ohne Motorkraft anlegen","Beschleunigen","Den Ventilator einschalten","Den Anker werfen"],"hint":"Die erste Brandschutzmaßnahme.","ref":"S. 23 — Betanken"},"mot8":{"q":"Wie ist die Schmierung eines Zweitakt-Benziners gelöst?","choices":["Schmieröl wird dem Kraftstoff beigemischt (Gemisch)","Durch eine Ölpumpe aus dem Kurbelgehäuse","Von Hand vor jeder Fahrt","Es braucht keine Schmierung"],"hint":"Z. B. 2 % Öl im Benzin.","ref":"S. 21 — Schmierung"},"mot9":{"q":"Wo befindet sich das Öl beim Viertaktmotor und was fördert es?","choices":["Im Gehäuse (Ölwanne); es wird von einer Zahnrad-Ölpumpe gefördert","Im Kraftstoff","Im Kühler","Im Auspuff"],"hint":"Der Boden der Ölwanne ist V-förmig.","ref":"S. 21 — Schmierung"},"mot10":{"q":"Welche zwei Arten der Motorkühlung gibt es?","choices":["Mit Wasser (Meerwasser) und mit Luft","Mit Öl und Wasser","Mit Luft und Gas","Nur mit Meerwasser"],"hint":"Wasser: offenes und geschlossenes System.","ref":"S. 22 — Kühlung"},"mot11":{"q":"Was ist ein Kingston (Seeventil)?","choices":["Ein Gitter/eine Öffnung zum Ansaugen von Meerwasser unter dem Rumpf (offenes Kühlsystem)","Eine Art Zündkerze","Ein Kraftstofffilter","Eine Motormarke"],"hint":"Er kann durch eine Tüte oder eine Muschel verstopft werden.","ref":"S. 22 — Kühlung"},"mot12":{"q":"Welche Spannung liefert eine Zelle eines Blei-Akkumulators und wie viele Zellen ergeben 12 V?","choices":["2 V pro Zelle; 6 Zellen = 12 V","1,5 V; 8 Zellen","6 V; 2 Zellen","12 V pro Zelle"],"hint":"Zellen in Reihenschaltung.","ref":"S. 22–23 — Akkumulator"},"mot13":{"q":"Mit welchem Strom laden wir einen Akkumulator?","choices":["Etwa 10 % der Nennkapazität (55 Ah → ~5,5 A)","100 % der Kapazität","Immer 20 A","Je stärker, desto besser"],"hint":"Besser langsamer und länger.","ref":"S. 23 — Laden"},"mot14":{"q":"Unter welcher Spannung beginnen sich die Bleiplatten des Akkumulators zu verformen?","choices":["Unter 10,5 V","Unter 12 V","Unter 6 V","Unter 2 V"],"hint":"Dann folgt ein Kurzschluss und der Akkumulator ist am Ende.","ref":"S. 23 — Akkumulator"},"mot15":{"q":"Warum werden an Welle/Rumpf Schutzanoden (Anoden aus Zink und Blei) angebracht?","choices":["Wegen galvanischer Ströme — damit die Anode statt Propeller/Welle verbraucht wird","Für bessere Geschwindigkeit","Zur Erdung des Funkgeräts","Als Ballast"],"hint":"Sonst wird der Propeller dünner und löchrig.","ref":"S. 25 — galvanische Ströme"},"mot16":{"q":"Was schalten wir nach dem Tanken vor dem Starten eines eingebauten Benzinmotors ein?","choices":["Den Ventilator zum Absaugen der Benzindämpfe aus dem Motorraum","Das Funkgerät","Die Ankerwinde","Die Heizung"],"hint":"Wenn kein Ventilator vorhanden ist — wenigstens die Motorraumklappe öffnen.","ref":"S. 23 — nach dem Tanken"},"mot17":{"q":"Der Diesel ist stehengeblieben, weil Luft in die Kraftstoffzufuhr gelangt ist. Wie beheben wir das?","choices":["Entlüften — an der Bosch-Pumpe die Luft austreiben, bis Diesel ohne Blasen austritt, dann die Verbindungen festziehen","Öl nachfüllen","Die Zündkerze wechseln","Den Akkumulator laden"],"hint":"Luft dringt dort ein, wo eine Dichtung nachgibt.","ref":"S. 25 — Diesel, Luft im Kraftstoff"},"mot18":{"q":"Ein Benzin-Außenborder springt nicht an. In w
