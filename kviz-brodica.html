<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boat Training Rovinj — Kviz za voditelja brodice A/B</title>
<meta name="theme-color" content="#0f1419">
<meta name="description" content="Interaktivna priprema za ispit za voditelja brodice kategorija A i B — Boat Training Rovinj.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* ===== Design tokeni (ui-ux-pro-max: Minimalism & Swiss; brend Boat Training Rovinj: crno + azur) ===== */
  :root{
    --brand:#159bd7; --brand-soft:#e8f4fb;
    --ink:#0f1419; --ink-2:#2b3640; --muted:#5b6670; --line:#e4e8eb; --line-2:#cfd6dc;
    --bg:#f5f7f8; --surface:#ffffff; --surface-2:#f0f3f5;
    --primary:#0b78b3; --primary-hover:#09689b; --on-primary:#ffffff;
    --ok:#13853f; --ok-bg:#e8f5ec; --bad:#c62828; --bad-bg:#fdecec; --warn:#7a5200; --warn-bg:#fff4dc;
    --radius:16px; --radius-sm:10px;
    --shadow:0 1px 2px rgba(15,20,25,.06),0 2px 8px rgba(15,20,25,.04);
    --shadow-lg:0 16px 40px rgba(15,20,25,.16);
    --font:'Plus Jakarta Sans',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --ease:cubic-bezier(.2,.7,.2,1); --t-fast:140ms; --t:220ms;
    --nav-h:64px;
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --brand:#3aaee6; --brand-soft:#11293a;
      --ink:#e6edf3; --ink-2:#c9d3dc; --muted:#9aa5af; --line:#262e36; --line-2:#3a444e;
      --bg:#0d1117; --surface:#151b22; --surface-2:#1c242d;
      --primary:#3aaee6; --primary-hover:#5cbdec; --on-primary:#04121b;
      --ok:#4cc77b; --ok-bg:#10281a; --bad:#ff7070; --bad-bg:#2c1515; --warn:#f0c060; --warn-bg:#2a2210;
      --shadow:0 1px 2px rgba(0,0,0,.4); --shadow-lg:0 16px 40px rgba(0,0,0,.55);
      color-scheme:dark;
    }
  }
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important}
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
  button,input,select{font:inherit;color:inherit}
  a{color:var(--primary)}
  .hidden{display:none !important}
  .muted{color:var(--muted)}
  .small{font-size:.875rem}
  .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  .skip{position:absolute;left:12px;top:-60px;z-index:100;background:var(--surface);padding:10px 14px;border-radius:10px;box-shadow:var(--shadow-lg)}
  .skip:focus{top:12px}
  :focus-visible{outline:3px solid var(--brand);outline-offset:2px}
  .ic{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .ic.sm{width:18px;height:18px}

  h1,h2,h3{margin:0;line-height:1.25;letter-spacing:-.01em}
  .h-xl{font-size:1.6rem;font-weight:800}
  .h-l{font-size:1.3rem;font-weight:800}
  .h-m{font-size:1.05rem;font-weight:700}
  .eyebrow{font-size:.8rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:0 0 4px}
  .sec{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:28px 2px 12px}
  .sec h3{font-size:1rem;font-weight:700}

  /* ===== Shell ===== */
  #app{min-height:100dvh}
  .sidebar{display:none}
  .topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:8px;min-height:56px;padding:8px 12px;
    background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .topbar h1{font-size:1.05rem;font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .topbar .logo-sm{width:32px;height:32px;border-radius:8px;margin-left:4px}
  .icon-btn{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:12px;border:none;background:transparent;cursor:pointer;color:var(--ink)}
  .icon-btn:hover{background:var(--surface-2)}
  .demo-badge{display:inline-flex;align-items:center;font-size:.7rem;font-weight:800;letter-spacing:.08em;padding:3px 8px;border-radius:999px;background:var(--warn-bg);color:var(--warn)}
  main#view{max-width:720px;margin:0 auto;padding:16px 16px calc(var(--nav-h) + 40px + env(safe-area-inset-bottom));outline:none}
  main#view.wide{max-width:1120px}
  main#view.bare{padding-bottom:40px}
  .bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;height:calc(var(--nav-h) + env(safe-area-inset-bottom));
    padding-bottom:env(safe-area-inset-bottom);background:var(--surface);border-top:1px solid var(--line)}
  .bottomnav a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-decoration:none;color:var(--muted);font-size:.75rem;font-weight:600;position:relative}
  .bottomnav a[aria-current=page]{color:var(--primary)}
  .bottomnav a[aria-current=page]::before{content:"";position:absolute;top:0;width:32px;height:3px;border-radius:0 0 3px 3px;background:var(--primary)}
  @media(min-width:1024px){
    #app.has-nav{display:grid;grid-template-columns:256px minmax(0,1fr)}
    #app.has-nav .sidebar{display:flex}
    #app.has-nav .bottomnav{display:none}
    #app.has-nav .topbar .logo-sm{display:none}
    main#view{padding:28px 32px 56px}
  }
  .sidebar{position:sticky;top:0;height:100dvh;flex-direction:column;gap:6px;padding:20px 14px;background:var(--surface);border-right:1px solid var(--line)}
  .side-brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}
  .side-brand img{width:40px;height:40px;border-radius:10px}
  .side-brand b{display:block;font-size:.95rem;line-height:1.2}
  .side-brand small{color:var(--muted);font-size:.78rem}
  .sidebar nav{display:flex;flex-direction:column;gap:2px}
  .sidebar nav a{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:10px;text-decoration:none;color:var(--ink-2);font-weight:600}
  .sidebar nav a:hover{background:var(--surface-2)}
  .sidebar nav a[aria-current=page]{background:var(--brand-soft);color:var(--primary)}
  .side-foot{margin-top:auto;border-top:1px solid var(--line);padding:14px 8px 0;font-size:.85rem}
  .side-foot .who{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* ===== Gumbi ===== */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:12px 18px;border-radius:12px;
    border:1px solid transparent;font-weight:700;font-size:1rem;cursor:pointer;text-decoration:none;
    transition:background var(--t-fast),border-color var(--t-fast),transform var(--t-fast)}
  .btn:active{transform:scale(.98)}
  .btn.primary{background:var(--primary);color:var(--on-primary)}
  .btn.primary:hover{background:var(--primary-hover)}
  .btn.secondary{background:var(--surface);border-color:var(--line-2);color:var(--ink)}
  .btn.secondary:hover{border-color:var(--ink-2)}
  .btn.ghost{background:transparent;color:var(--primary);padding-left:10px;padding-right:10px}
  .btn.ghost:hover{background:var(--brand-soft)}
  .btn.danger{background:var(--bad);color:#fff}
  .btn.danger-ghost{background:transparent;color:var(--bad)}
  .btn.danger-ghost:hover{background:var(--bad-bg)}
  .btn.block{width:100%}
  .btn.sm{min-height:36px;padding:7px 12px;font-size:.875rem;border-radius:9px}
  .btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
  .link{background:none;border:none;padding:8px 0;color:var(--primary);font-weight:700;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
  .link:hover{text-decoration:underline}

  /* ===== Kartice i liste ===== */
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
  .card + .card{margin-top:12px}
  .stack{display:flex;flex-direction:column;gap:12px}
  .row{display:flex;align-items:center;gap:12px}
  .between{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .list{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
  .list > li + li{border-top:1px solid var(--line)}
  .item{display:flex;align-items:center;gap:14px;width:100%;min-height:64px;padding:14px 16px;text-align:left;background:none;border:none;text-decoration:none;color:inherit;cursor:pointer}
  a.item:hover,button.item:hover{background:var(--surface-2)}
  .item .i-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
  .item .i-title{font-weight:700}
  .item .i-sub{font-size:.875rem;color:var(--muted)}
  .item .chev{color:var(--muted)}
  .i-ic{flex:none;width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:var(--brand-soft);color:var(--primary)}
  .i-ic.dark{background:var(--ink);color:var(--surface)}
  .pct{font-weight:800;font-variant-numeric:tabular-nums;color:var(--ink-2);font-size:.95rem}
  .bar{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden}
  .bar > i{display:block;height:100%;border-radius:99px;background:var(--brand);transition:width .5s var(--ease)}

  /* ===== Početna ===== */
  .hero-card{background:var(--ink);color:#fff;border-radius:20px;padding:22px 20px;position:relative;overflow:hidden}
  @media (prefers-color-scheme: dark){ .hero-card{background:#1b2a36} }
  .hero-card .eyebrow{color:#b9c6d0}
  .hero-card p{color:#c9d4dc;margin:8px 0 18px}
  .hero-card .btn.primary{background:var(--brand);color:#04121b}
  .hero-card .btn.primary:hover{background:#3aaee6}
  .hero-card .link{color:#9fd7f2}
  .hero-card .wave{position:absolute;right:-30px;bottom:-30px;width:180px;opacity:.12;pointer-events:none}
  .kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
  .kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 12px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
  .kpi b{font-size:1.35rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
  .kpi span{font-size:.78rem;color:var(--muted);font-weight:600}
  .kpi .ic{color:var(--brand)}
  .ring .ring-bg{stroke:var(--surface-2)} .ring .ring-fg{stroke:var(--brand);transition:stroke-dashoffset .8s var(--ease)}
  .ring text{fill:var(--ink);font-weight:800;font-family:var(--font)}
  .steps{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:14px}
  .steps li{display:flex;gap:12px}
  .steps .n{flex:none;width:28px;height:28px;border-radius:50%;background:var(--brand-soft);color:var(--primary);font-weight:800;display:flex;align-items:center;justify-content:center;font-size:.85rem}
  .steps b{display:block} .steps p{margin:2px 0 0;font-size:.9rem;color:var(--muted)}

  /* ===== Vježba ===== */
  .boxes{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:16px 0 8px}
  .box{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 2px;border-radius:12px;background:var(--surface-2)}
  .box b{font-size:1.15rem;font-weight:800;font-variant-numeric:tabular-nums}
  .box span{font-size:.7rem;color:var(--muted);font-weight:600}
  .box.b1{background:var(--bad-bg)} .box.b1 b{color:var(--bad)}
  .box.b5{background:var(--ok-bg)} .box.b5 b{color:var(--ok)}
  .tiles{display:grid;gap:10px}
  @media(min-width:640px){.tiles{grid-template-columns:repeat(3,1fr)}}
  .tile{display:flex;align-items:center;gap:14px;text-align:left;padding:16px;border-radius:var(--radius);background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);cursor:pointer;color:inherit}
  .tile:hover{border-color:var(--brand)}
  @media(min-width:640px){.tile{flex-direction:column;align-items:flex-start}}
  .tile .t-txt{display:flex;flex-direction:column;gap:3px;min-width:0}
  .tile b{font-size:1rem}
  .tile small{color:var(--muted);font-size:.85rem;line-height:1.4}
  .tile .t-meta{font-size:.78rem;font-weight:700;color:var(--primary);margin-top:2px}

  /* ===== Složi vježbu ===== */
  .setting{display:flex;align-items:center;gap:14px;min-height:72px;padding:14px 16px;text-decoration:none;color:inherit}
  a.setting:hover{background:var(--surface-2)}
  .setting .s-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
  .s-label{font-size:.8rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
  .s-val{font-weight:700;font-size:1rem}
  .s-val.warn{color:var(--bad)}
  .setting.col{flex-direction:column;align-items:stretch;gap:10px}
  .seg{display:flex;gap:4px;padding:4px;border-radius:12px;background:var(--surface-2)}
  .seg button{flex:1;min-height:44px;border:none;background:transparent;border-radius:9px;font-weight:700;cursor:pointer;color:var(--ink-2)}
  .seg button[aria-pressed=true]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
  .sticky-cta{position:sticky;bottom:calc(var(--nav-h) + 12px + env(safe-area-inset-bottom));z-index:20;margin-top:16px;display:flex;align-items:center;gap:14px;
    padding:12px 12px 12px 16px;border-radius:16px;background:var(--surface);border:1px solid var(--line-2);box-shadow:var(--shadow-lg)}
  @media(min-width:1024px){.sticky-cta{bottom:16px}}
  .sticky-cta .sum{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.35}
  .sticky-cta .sum b{font-size:1rem}
  .sticky-cta .sum span{font-size:.85rem;color:var(--muted)}
  .sticky-cta .sum span.warn{color:var(--bad);font-weight:600}
  .check-row{display:flex;align-items:center;gap:14px;min-height:60px;padding:12px 16px;cursor:pointer}
  .check-row:hover{background:var(--surface-2)}
  .check-row input{width:22px;height:22px;accent-color:var(--primary);flex:none;cursor:pointer}
  .check-row .c-txt{flex:1;min-width:0;display:flex;flex-direction:column}
  .check-row .c-title{font-weight:600}
  .check-row .c-sub{font-size:.85rem;color:var(--muted)}
  .check-row .c-cnt{font-size:.85rem;color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums}
  .grp-head{background:var(--surface-2)}
  .grp-head .c-title{font-weight:800}
  .toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 2px 12px}

  /* ===== Lekcija ===== */
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip-btn{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:8px 14px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);font-weight:600;cursor:pointer;font-size:.9rem}
  .chip-btn[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
  .chip-btn em{font-style:normal;opacity:.7;font-size:.8rem}

  /* ===== Kviz ===== */
  .quiz-top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;padding:8px 4px;background:var(--bg)}
  .quiz-top .bar{flex:1;height:8px}
  .qt-count{font-size:.875rem;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums;min-width:48px;text-align:right}
  .q-meta{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
  .tag{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--brand-soft);color:var(--primary);font-size:.8rem;font-weight:700}
  .score{font-size:.85rem;font-weight:700;color:var(--muted)}
  .qtext{font-size:1.2rem;font-weight:700;line-height:1.4;margin:14px 0 16px}
  .qvisual{display:flex;justify-content:center;margin:0 0 18px}
  .qvisual:empty{display:none}
  .qvisual svg{max-width:100%;height:auto;background:#f6fafc;border:1px solid var(--line);border-radius:14px;padding:8px}
  #qInput input{width:100%;min-height:52px;padding:12px 14px;font-weight:600;border:1.5px solid var(--line-2);border-radius:12px;background:var(--surface)}
  #qInput input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--brand-soft)}
  .choices{display:flex;flex-direction:column;gap:10px}
  .choice{display:flex;align-items:flex-start;gap:12px;width:100%;min-height:56px;padding:14px;text-align:left;border-radius:12px;border:1.5px solid var(--line-2);background:var(--surface);font-weight:600;line-height:1.4;cursor:pointer;transition:border-color var(--t-fast),background var(--t-fast)}
  .choice:hover:not([disabled]){border-color:var(--primary);background:var(--brand-soft)}
  .choice .mk{flex:none;display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:8px;background:var(--surface-2);font-weight:800;font-size:.85rem}
  .choice.correct{border-color:var(--ok);background:var(--ok-bg)}
  .choice.correct .mk{background:var(--ok);color:#fff}
  .choice.wrong{border-color:var(--bad);background:var(--bad-bg)}
  .choice.wrong .mk{background:var(--bad);color:#fff}
  .choice[disabled]{cursor:default}
  .choice[disabled]:not(.correct):not(.wrong){opacity:.55}
  .feedback{margin-top:14px;padding:14px;border-radius:12px;border-left:4px solid var(--line-2);background:var(--surface-2);animation:fadeUp var(--t) var(--ease)}
  .feedback.ok{border-color:var(--ok);background:var(--ok-bg)}
  .feedback.bad{border-color:var(--bad);background:var(--bad-bg)}
  .feedback .ans{margin-top:6px}
  .feedback .ref{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:.85rem;color:var(--muted);font-weight:600}
  .notebox,.hintbox{margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--warn-bg);color:var(--warn);font-weight:600;font-size:.95rem;animation:fadeUp var(--t) var(--ease)}
  .selfrow{display:flex;gap:10px;margin-top:12px}
  .selfrow .btn{flex:1}
  .actionbar{position:sticky;bottom:0;z-index:20;display:flex;gap:10px;margin:16px -16px 0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid var(--line)}
  .actionbar .btn{flex:1}
  @media(min-width:720px){.actionbar{margin:16px 0 0;border:none;padding:12px 0}}

  /* ===== Rezultat / statistika ===== */
  .result-head{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:12px 0 4px}
  .stat-row{display:flex;flex-direction:column;gap:8px;padding:14px 16px}
  .stat-row .between b{font-weight:700}

  /* ===== Prijava ===== */
  .login{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
  .login-card{width:100%;max-width:420px}
  .login-logo{display:block;width:72px;height:72px;border-radius:16px;margin:0 0 20px;box-shadow:var(--shadow)}
  .login h1{font-size:1.6rem;font-weight:800}
  .login .lead{color:var(--muted);margin:6px 0 24px}
  .field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
  .field label,.field .lbl{font-weight:700;font-size:.9rem}
  .field small{color:var(--muted);font-size:.82rem}
  .input{width:100%;min-height:48px;padding:11px 14px;border:1.5px solid var(--line-2);border-radius:12px;background:var(--surface);font-size:1rem}
  .input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--brand-soft)}
  select.input{cursor:pointer}
  .pw{position:relative}
  .pw .input{padding-right:52px}
  .pw .icon-btn{position:absolute;right:2px;top:2px}
  .alert{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:var(--bad-bg);color:var(--bad);font-weight:600;font-size:.92rem;margin-bottom:16px}
  .alert.ok{background:var(--ok-bg);color:var(--ok)}
  .demo{margin-top:24px;padding-top:16px;border-top:1px dashed var(--line-2)}
  .demo summary{cursor:pointer;font-weight:700;font-size:.9rem;display:flex;align-items:center;gap:8px;list-style:none}
  .demo summary::-webkit-details-marker{display:none}
  .demo .row{margin-top:12px}

  /* ===== Admin ===== */
  .page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:16px}
  .filters{display:grid;gap:10px;grid-template-columns:1fr;margin-bottom:12px}
  @media(min-width:720px){.filters{grid-template-columns:2fr 1fr 1fr}}

  .table-wrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
  .tbl{width:100%;border-collapse:collapse;font-size:.92rem}
  .tbl th{text-align:left;font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;padding:12px 14px;background:var(--surface-2);border-bottom:1px solid var(--line)}

  .tbl tr:last-child td{border-bottom:none}
  .tbl tr.is-off td{background:color-mix(in srgb,var(--bad-bg) 55%,transparent)}
  .tbl tr.is-sel td{background:var(--brand-soft)}
  .tbl .cb{width:44px}
  .tbl input[type=checkbox]{width:20px;height:20px;accent-color:var(--primary);cursor:pointer}
  .tbl .num{font-variant-numeric:tabular-nums;white-space:nowrap}
  .u-name{font-weight:700}
  .u-mail{color:var(--muted);font-size:.85rem;overflow-wrap:anywhere}
  .acts{display:flex;gap:4px;justify-content:flex-end;flex-wrap:wrap}
  .badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:.78rem;font-weight:700;white-space:nowrap;background:var(--surface-2);color:var(--ink-2)}
  .badge.ok{background:var(--ok-bg);color:var(--ok)} .badge.bad{background:var(--bad-bg);color:var(--bad)} .badge.brand{background:var(--brand-soft);color:var(--primary)}
  .badge .ic{width:14px;height:14px}
  .empty{padding:36px 16px;text-align:center;color:var(--muted)}
  .empty .ic{width:36px;height:36px;margin-bottom:8px;color:var(--line-2)}
  @media(max-width:760px){
    .tbl thead{display:none}
    .tbl,.tbl tbody,.tbl tr,.tbl td{display:block;width:100%}
    .tbl tr{position:relative;padding:12px 14px 12px 52px;border-bottom:1px solid var(--line)}
    .tbl tr:last-child{border-bottom:none}
    .tbl td{border:none;padding:3px 0}
    .tbl td[data-label]::before{content:attr(data-label) ": ";color:var(--muted);font-size:.82rem}
    .tbl td.cb{position:absolute;left:14px;top:14px;width:auto;padding:0}
    .tbl td.main::before{content:none}
    .acts{justify-content:flex-start;margin-top:8px}
    .tbl.no-cb tr{padding-left:14px}
  }

  /* ===== Dijalog i toast ===== */
  dialog{width:min(480px,calc(100% - 32px));border:none;border-radius:20px;padding:0;background:var(--surface);color:var(--ink);box-shadow:var(--shadow-lg)}
  dialog::backdrop{background:rgba(15,20,25,.45);backdrop-filter:blur(2px)}
  dialog[open]{animation:pop var(--t) var(--ease)}
  .dlg-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 20px 0}
  .dlg-head h2{font-size:1.15rem;font-weight:800}
  .dlg-body{padding:16px 20px}
  .dlg-foot{display:flex;gap:10px;justify-content:flex-end;padding:0 20px 20px;flex-wrap:wrap}
  .creds{background:var(--surface-2);border-radius:12px;padding:14px;font-size:.95rem;line-height:1.8;overflow-wrap:anywhere}
  .creds code{font-family:ui-monospace,Consolas,monospace;font-weight:700}
  #toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 20px + env(safe-area-inset-bottom));z-index:60;display:flex;flex-direction:column;gap:8px;width:min(420px,calc(100% - 32px))}
  @media(min-width:1024px){#toasts{bottom:24px}}
  .toast{display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:12px;background:var(--ink);color:var(--surface);font-weight:600;box-shadow:var(--shadow-lg);animation:fadeUp var(--t) var(--ease)}

  @keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  @keyframes pop{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
  .view-enter{animation:fadeUp var(--t) var(--ease)}
</style>
</head>

{id:"svl-n3",topic:"svjetla",level:"napr",q:"Koji DNEVNI znak nosi nasukani brod (dulji od 50 m)?",choices:["Tri crne kugle (okomito)","Jednu kuglu","Crni romb","Crni valjak"],hint:"Tri kugle = nasukan.",ref:"str. 41 — dnevni znakovi"},

/* ---- SVJETLA BRODA: triki ---- */
{id:"svl-t1",topic:"svjetla",level:"trik",q:"Tri crvena svjetla okomito = brod u kvaru?",choices:["Ne — tri crvena su 'ograničen svojim gazom'; brod u kvaru su DVA crvena","Da, to je kvar","To je koča","To je peljar"],hint:"Gaz = 3 crvena, kvar = 2 crvena.",ref:"str. 54 — svjetla broda"},
{id:"svl-t2",topic:"svjetla",level:"trik",q:"Crveno svjetlo nad bijelim = ribarica koča?",choices:["Ne — crveno/bijelo je PLIVARICA; koča je ZELENO nad bijelim","Da, to je koča","To je peljar","To je jedrilica"],hint:"Koča = zeleno gore.",ref:"str. 53 — svjetla"},
{id:"svl-t3",topic:"svjetla",level:"trik",q:"Peljarski brod nosi crveno nad bijelim?",choices:["Ne — peljar je BIJELO nad crvenim","Da","Peljar je 3 crvena","Peljar je žuto trepćuće"],hint:"Bijelo gore, crveno dolje.",ref:"str. 53 — peljar"},
/* ---- RADIOFONIJA: napredna ---- */
{id:"rad-n1",topic:"radio",level:"napr",q:"Koliko ukupno radnih VHF kanala postoji i koji su?",choices:["56 kanala: 1–28 i 60–88","100 kanala","Samo 16","10 kanala"],hint:"Između 28 i 60 su rezervirani (meteo).",ref:"str. 41 — VHF kanali"},
{id:"rad-n2",topic:"radio",level:"napr",q:"Zašto se za vezu brod-brod često koristi manja snaga (1 W)?",choices:["Štedi akumulator, manje smeta drugima i glas se manje izobličuje","Jer je zabranjena veća","Jer je jača snaga tiša","Nema razloga"],hint:"25 W je za veće domete (~20 NM).",ref:"str. 42 — snaga predajnika"},
{id:"rad-n3",topic:"radio",level:"napr",q:"Čime se provjerava je li antena prilagođena uređaju?",choices:["SVR metrom","Voltmetrom","Kompasom","GPS-om"],hint:"Neprilagođena antena vraća energiju i grije predajnik.",ref:"str. 42 — antena"},
{id:"rad-n4",topic:"radio",level:"napr",q:"Što znači Dual Watch (DW)?",choices:["Istovremeno slušanje dvaju kanala, uvijek uključujući 16.","Dvostruka snaga","Dva mikrofona","Dvije antene"],hint:"Uvijek uz 16. kanal.",ref:"str. 42–43 — DW"},
{id:"rad-n5",topic:"radio",level:"napr",q:"Koje vrste poziva postoje kod DSC-a?",choices:["Distress, Urgency, Safety, Routine, Ship's business","Samo Mayday","Samo hitni i obični","Distress i kraj"],hint:"Od pogibelji do brodskih poslova.",ref:"str. 45 — DSC pozivi"},
{id:"rad-n6",topic:"radio",level:"napr",q:"Kako glasi i što znači signal kraja spašavanja?",choices:["SEELONCE FEENEE (silence fini) — spašavanje gotovo, frekvencije slobodne","SEELONCE MAYDAY — kraj","PRU-DONCE — kraj","MAYDAY RELAY — kraj"],hint:"'Fini' = gotovo.",ref:"str. 45 — SEELONCE FEENEE"},
{id:"rad-n7",topic:"radio",level:"napr",q:"Kada je 'vrijeme šutnje' u radiotelefoniji (na profesionalnim frekvencijama)?",choices:["2×3 minute svakog sata: na punom satu i na 30. minuti (ne vrijedi za VHF)","Cijeli sat","Nikad","Samo noću"],hint:"Na VHF-u (naše područje) nema te obveze.",ref:"str. 42 — vrijeme šutnje"},
/* ---- RADIOFONIJA: triki ---- */
{id:"rad-t1",topic:"radio",level:"trik",q:"Nestalo ti goriva, nisi u životnoj opasnosti. Zoveš MAYDAY?",choices:["Ne — to je PAN PAN (hitnost); Mayday je samo za životnu opasnost","Da, uvijek Mayday","Zoveš Sécurité","Ne zoveš ništa"],hint:"Mayday = pogibelj (životi ugroženi).",ref:"str. 44–45 — prioritetni pozivi"},
{id:"rad-t2",topic:"radio",level:"trik",q:"SEELONCE MAYDAY znači da je spašavanje ZAVRŠENO?",choices:["Ne — to znači TIŠINU na kanalu (samo za spašavanje); kraj je SEELONCE FEENEE","Da, znači kraj","Znači početak razgovora","Znači promjenu kanala"],hint:"'Feenee/fini' = kraj.",ref:"str. 45 — SEELONCE"},
{id:"rad-t3",topic:"radio",level:"trik",q:"Voditelj brodice se smije radiom služiti na engleskom, na svim morima i oceanima?",choices:["Ne — ima OGRANIČENO ovlaštenje: hrvatski jezik, u obalnom moru","Da, na svim morima","Da, ali samo noću","Da, uz dodatnu naknadu"],hint:"Opće ovlaštenje (engleski, sva mora) je poseban ispit.",ref:"str. 41 — ovlaštenje"},
{id:"rad-t4",topic:"radio",level:"trik",q:"Sécurité poziv koristiš kad je netko na tvojoj brodici ozlijeđen?",choices:["Ne — za ozljedu/hitnost je PAN PAN; Sécurité je za navigacijska/meteo upozorenja svima","Da, Sécurité","Da, to je isto što i Mayday","Da, uvijek Sécurité"],hint:"Sécurité se tiče SVIH koji plove tim područjem.",ref:"str. 45–46 — Sécurité"},

{id:"spel-n2",topic:"spel",level:"napr",q:"Koje slovo predstavlja riječ JUNIFORM?",choices:["U","J","Y","I"],hint:"Iz 'Uniform'.",ref:"str. 45 — tablica"},
{id:"spel-n3",topic:"spel",level:"napr",q:"Koje slovo predstavlja riječ KVIBEK?",choices:["Q","K","W","C"],hint:"Iz 'Quebec'.",ref:"str. 45 — tablica"},
{id:"spel-n4",topic:"spel",level:"napr",q:"Kako se u tablici izgovara broj 7?",choices:["SEVN","SEDAM","SEVEN","SIKS"],hint:"Iz engleskog 'seven'.",ref:"str. 45 — brojevi"},

{id:"spel-n6",topic:"spel",level:"napr",q:"Koja je riječ za slovo O?",choices:["OSKAR","OTON","OMEGA","OKO"],hint:"Iz 'Oscar'.",ref:"str. 45 — tablica"},
{id:"spel-t1",topic:"spel",level:"trik",q:"Slovo Q se u ovoj tablici izgovara 'KVEBEK'?",choices:["Ne — u tablici je 'KVIBEK'","Da, KVEBEK","Da, KVEBIK","KJUBEK"],hint:"Pazi na zapis u skripti.",ref:"str. 45 — tablica"},
{id:"spel-t2",topic:"spel",level:"trik",q:"Slovo J se izgovara 'JULIJET'?",choices:["Ne — u tablici je 'ĐULIJET'","Da, JULIJET","Da, JULIET","JOTA"],hint:"Počinje na Đ.",ref:"str. 45 — tablica"},

/* ================= NOVA CELINA: KONOPI I UZLOVI ================= */

{id:"uzl3",topic:"uzlovi",level:"osn",q:"Kojim uzlom spajamo dva konopa RAZLIČITIH debljina?",choices:["Zastavni","Muški","Pašnjak","Plutačni"],hint:"Za nejednake debljine.",ref:"str. 13 — uzlovi"},
{id:"uzl4",topic:"uzlovi",level:"osn",q:"Čemu služi OSMICA?",choices:["Veže se na kraj konopa da se ne razlista ili ne protrči kroz kolotur","Za spajanje dva konopa","Za privez na bitvu","Za sidro"],hint:"Zaustavni čvor na kraju.",ref:"str. 13 — uzlovi"},
{id:"uzl5",topic:"uzlovi",level:"osn",q:"Koji se uzao veže na prsten sidra ili škopac predlanca?",choices:["Sidreni","Pašnjak","Muški","Osmica"],hint:"Naziv govori sam.",ref:"str. 13 — uzlovi"},
{id:"uzl6",topic:"uzlovi",level:"osn",q:"Koji uzao ide na prsten plutače za privez?",choices:["Plutačni","Sidreni","Zastavni","Vrtni"],hint:"Naziv po plutači.",ref:"str. 13 — uzlovi"},
{id:"uzl7",topic:"uzlovi",level:"osn",q:"Koji se uzao veže na prečku (bokobran na ogradu) ili natiče na bitvu?",choices:["Vrtni","Pašnjak","Osmica","Sidreni"],hint:"Za bokobrane na ogradi.",ref:"str. 13 — uzlovi"},
{id:"uzl8",topic:"uzlovi",level:"napr",q:"Zašto je pašnjak obvezan pri privezu na obalnu bitvu?",choices:["Omogućava vezanje više brodica na istu bitvu bez odvezivanja tuđih konopa","Jer je najjači","Jer svijetli","Jer je najlakši"],hint:"Ne moraš dirati tuđe cime.",ref:"str. 13 i 46 — pašnjak"},

{id:"uzl10",topic:"uzlovi",level:"napr",q:"Zašto sidrenjak ne smije biti plivajući (plutajući) konop?",choices:["Jer ga brodski vijak može pokupiti i namotati na osovinu","Jer tone presporo","Jer je preskup","Jer se ne vidi"],hint:"Opasnost za vijak.",ref:"str. 12 — konopi"},

/* ================= NOVA CELINA: MOTORI (MOTORISTIKA) ================= */
{id:"mot1",topic:"motori",level:"osn",q:"Koje su dvije osnovne grupe motora s unutarnjim izgaranjem?",choices:["Dizel (nafta) i benzinski (Otto)","Elektro i dizel","Dvotaktni i vodeni","Parni i benzinski"],hint:"Po vrsti goriva/paljenja.",ref:"str. 19 — motori"},
{id:"mot2",topic:"motori",level:"osn",q:"Koji su taktovi 4-taktnog motora, redom?",choices:["Usisavanje, kompresija, širenje (radni), ispuhivanje","Paljenje, hlađenje, širenje, stop","Usis, ispuh, kompresija, radni","Kompresija, usis, ispuh, radni"],hint:"1 usis, 2 tlačenje, 3 radni, 4 ispuh.",ref:"str. 19–20 — 4-taktni"},
{id:"mot3",topic:"motori",level:"osn",q:"Kako se pali gorivo u DIZEL motoru?",choices:["Samozapaljenjem — zbog tlačenjem jako zagrijanog zraka (~750 °C)","Iskrom svjećice","Otvorenim plamenom","Zagrijačem stalno"],hint:"Nema svjećice.",ref:"str. 20 — dizel"},
{id:"mot4",topic:"motori",level:"osn",q:"Kako se pali smjesa u BENZINSKOM motoru?",choices:["Iskrom iz svjećice","Samozapaljenjem","Tlakom","Grijačem"],hint:"Zato treba izvor struje.",ref:"str. 20 — benzinac"},
{id:"mot5",topic:"motori",level:"osn",q:"Što u 1. taktu usisava dizel, a što benzinac?",choices:["Dizel čisti zrak; benzinac smjesu zraka i goriva","Oba čisti zrak","Oba smjesu","Dizel smjesu, benzinac zrak"],hint:"Kod dizela gorivo dolazi kasnije (ubrizgavanje).",ref:"str. 20 — usisavanje"},
{id:"mot6",topic:"motori",level:"osn",q:"Koji je takt 'radni' (daje snagu)?",choices:["Treći — širenje (ekspanzija)","Prvi — usisavanje","Drugi — kompresija","Četvrti — ispuhivanje"],hint:"Izgaranje gura klip prema dolje.",ref:"str. 20 — radni takt"},
{id:"mot7",topic:"motori",level:"osn",q:"Što je propisano 50 m prije pristana benzinske pumpe?",choices:["Ugasiti motor i doploviti bez rada motora","Ubrzati","Uključiti ventilator","Baciti sidro"],hint:"Prva preventiva protiv požara.",ref:"str. 23 — krcanje goriva"},
{id:"mot8",topic:"motori",level:"napr",q:"Kako je riješeno podmazivanje 2-taktnog benzinca?",choices:["Mazivo ulje se dodaje u gorivo (mješavina)","Uljnom pumpom iz kartera","Ručno prije svake vožnje","Ne treba podmazivanje"],hint:"Npr. 2% ulja u benzinu.",ref:"str. 21 — podmazivanje"},
{id:"mot9",topic:"motori",level:"napr",q:"Gdje je ulje kod 4-taktnog motora i što ga tjera?",choices:["U kućištu (karteru); tjera ga zupčasta uljna pumpa","U gorivu","U hladnjaku","U ispuhu"],hint:"Dno kartera je u obliku slova 'V'.",ref:"str. 21 — podmazivanje"},
{id:"mot10",topic:"motori",level:"napr",q:"Koje dvije vrste hlađenja motora postoje?",choices:["Vodom (morem) i zrakom","Uljem i vodom","Zrakom i plinom","Samo morem"],hint:"Vodom: otvoreni i zatvoreni sistem.",ref:"str. 22 — hlađenje"},
{id:"mot11",topic:"motori",level:"napr",q:"Što je kingston?",choices:["Rešetka/otvor za usis mora ispod trupa (otvoreni sistem hlađenja)","Vrsta svjećice","Filter goriva","Marka motora"],hint:"Može se začepiti vrećicom ili školjkom.",ref:"str. 22 — hlađenje"},
{id:"mot12",topic:"motori",level:"napr",q:"Koliki napon daje jedna ćelija olovnog akumulatora i koliko za 12 V?",choices:["2 V po ćeliji; 6 ćelija = 12 V","1,5 V; 8 ćelija","6 V; 2 ćelije","12 V po ćeliji"],hint:"Serijski spoj ćelija.",ref:"str. 22–23 — akumulator"},
{id:"mot13",topic:"motori",level:"napr",q:"Kolikom snagom punimo akumulator?",choices:["Oko 10% nazivnog kapaciteta (55 Ah → ~5,5 A)","100% kapaciteta","Uvijek 20 A","Što jače to bolje"],hint:"Bolje sporije i dulje.",ref:"str. 23 — punjenje"},
{id:"mot14",topic:"motori",level:"napr",q:"Ispod kojeg napona se olovne ploče akumulatora počinju deformirati?",choices:["Ispod 10,5 V","Ispod 12 V","Ispod 6 V","Ispod 2 V"],hint:"Tada slijedi kratki spoj i kraj akumulatora.",ref:"str. 23 — akumulator"},
{id:"mot15",topic:"motori",level:"napr",q:"Zašto se na osovinu/trup stavljaju protektori (anode od cinka i olova)?",choices:["Zbog galvanskih struja — da se troši anoda umjesto vijka/osovine","Za bolju brzinu","Za uzemljenje radija","Za balast"],hint:"Inače propeler postaje tanji i rupičast.",ref:"str. 25 — galvanske struje"},
{id:"mot16",topic:"motori",level:"napr",q:"Što uključujemo prije paljenja ugrađenog benzinca nakon tankanja?",choices:["Ventilator za isisavanje benzinskih para iz motornog prostora","Radio","Sidreno vitlo","Grijač"],hint:"Ako nema ventilatora — barem otvori poklopac motora.",ref:"str. 23 — nakon tankanja"},
{id:"mot17",topic:"motori",level:"napr",q:"Dizel je stao jer je u dovod goriva ušao zrak. Kako popravljamo?",choices:["Odzračiti — od Bosch pumpe istjerati zrak dok ne procuri nafta bez mjehurića, pa zategnuti spojeve","Dodati ulje","Promijeniti svjećicu","Napuniti akumulator"],hint:"Zrak ulazi gdje popusti brtva.",ref:"str. 25 — dizel, zrak u gorivu"},
{id:"mot18",topic:"motori",level:"trik",q:"Benzinski vanbrodski ne pali. Koji je red provjere?",choices:["Iskra, svjećica, gorivo","Gorivo, ulje, voda","Akumulator pa sidro","Antena, radio, kompas"],hint:"Prvo provjeri ima li iskre.",ref:"str. 24–25 — kvarovi"},
{id:"mot19",topic:"motori",level:"trik",q:"Motor je 'presisan' (previše goriva). Kolega odmah nastavlja paliti. Ispravno?",choices:["Ne — pričekati da višak ispari ili izvaditi i ispumpati svjećicu (kod elektronike kabel na masu)","Da, samo pali dalje","Dodaj još goriva","Zalij ga vodom"],hint:"Inače se motor 'guši'.",ref:"str. 24 — presisan motor"},
{id:"mot20",topic:"motori",level:"trik",q:"Vanbrodski motor s odvojenim rezervoarom ne pali — a nisi otvorio ventilčić zraka na rezervoaru. Zašto ne radi?",choices:["Bez otvorenog ventilčića gorivo ne stiže do rasplinjača","Nema veze s time","Zbog kompasa","Zbog antene"],hint:"Zrak mora ulaziti u rezervoar.",ref:"str. 24 — vanbrodski motor"},
/* ================= NOVA CELINA: SIGURNOST I POSTUPCI ================= */
{id:"sig1",topic:"sigurnost",level:"osn",q:"Osoba je pala u more s DESNOG boka. Kako okrećeš kormilo?",choices:["Hitro udesno — krma se odmakne ulijevo da vijak ne ozlijedi čovjeka","Ulijevo","Ravno naprijed","Ugasi motor i ne diraj kormilo"],hint:"Krma (i vijak) bježi od čovjeka.",ref:"str. 8 i 26 — pad u more"},
{id:"sig2",topic:"sigurnost",level:"osn",q:"S koje strane prilaziš čovjeku u moru?",choices:["Iz zavjetrine — da ga vjetar i struja doprave do brodice","Iz smjera vjetra","Ravno na njega punom brzinom","Sa strane krme"],hint:"Da te vjetar ne nabaci na njega.",ref:"str. 26 — spašavanje"},
{id:"sig3",topic:"sigurnost",level:"osn",q:"Pod kojim kutom ploviš protiv valova?",choices:["Koso, 30°–60°","Okomito, 90°","Paralelno, 0°","Svejedno"],hint:"Nikako okomito da pramac ne lupa.",ref:"str. 8 — plovidba na valove"},
{id:"sig4",topic:"sigurnost",level:"osn",q:"Kako se gasi požar (osnovni princip)?",choices:["Spriječiti dotok kisika (pjena, prah, CO2, mokra plahta)","Dodati zrak","Politi benzinom","Ostaviti da izgori"],hint:"Gorenje je spajanje s kisikom.",ref:"str. 23 — požar"},
{id:"sig5",topic:"sigurnost",level:"osn",q:"Tko je odgovoran za raspored tereta i broj osoba na brodici?",choices:["Zapovjednik — smije ukrcati samo koliko dopušta Dozvola za plovidbu","Svaki putnik za sebe","Marina","Lučka kapetanija"],hint:"On brine da brodica ne visi na bok.",ref:"str. 23 — stabilnost"},
{id:"sig6",topic:"sigurnost",level:"napr",q:"Zašto rezervoari goriva imaju pregrade s malim otvorima?",choices:["Da se pri naglom nagibu gorivo ne premjesti odjednom na jednu stranu i ne ugrozi stabilnost","Da stane više goriva","Zbog hlađenja","Zbog filtriranja"],hint:"Sprječava naglo prelijevanje.",ref:"str. 23 — stabilnost"},
{id:"sig7",topic:"sigurnost",level:"napr",q:"Nasukali ste se prednjim dijelom. Prvi postupci?",choices:["Premjestiti posadu/teret na krmu (odteretiti pramac) i zavoziti punom snagom unazad","Skočiti u more","Ubrzati naprijed","Odmah zvati pomoć bez provjere"],hint:"Prvo provjeri ima li pukotine na trupu.",ref:"str. 26 — nasukavanje"},

{id:"sig9",topic:"sigurnost",level:"napr",q:"Ako brodica ipak neizbježno tone, gdje je bolje potonuti?",choices:["Na pliće ravno pješčano dno, u zaštićenoj uvali","Na najveću dubinu","Na kamenito dno s jakim strujama","Svejedno je"],hint:"Lakše spašavanje i podizanje.",ref:"str. 26 — tonjenje"},

/* ============================================================

   ============================================================ */
function svgWrap(inner,w,h){return `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" style="max-width:100%;height:auto" xmlns="http://www.w3.org/2000/svg">${inner}</svg>`;}

/* ---- zajednička SVG paleta ---- */
const SV={sea:"#cfe8f3",seaLt:"#eaf7fc",navy:"#0b2740",steel:"#6f93a6",grid:"#9fc4d8",
  sand:"#ecdcae",sandSt:"#c9a24b",red:"#e23b4e",green:"#1f9d57",yellow:"#f2c200",
  sky:"#0e7fa6",cyan:"#17b6cf",lime:"#c9e637",hull:"#0d2944"};

function windRose(bearing){
  const cx=150,cy=150,R=112;
  const dx=d=>Math.sin(d*Math.PI/180), dy=d=>-Math.cos(d*Math.PI/180);
  const pts=[["N",0],["NE",45],["E",90],["SE",135],["S",180],["SW",225],["W",270],["NW",315]];
  let g=`<defs>
    <radialGradient id="wr-sea" cx="50%" cy="42%" r="66%"><stop offset="0" stop-color="${SV.seaLt}"/><stop offset="1" stop-color="${SV.sea}"/></radialGradient>
    <marker id="wr-ah" markerWidth="12" markerHeight="12" refX="7" refY="4" orient="auto"><path d="M0 0 L9 4 L0 8 Z" fill="${SV.sky}"/></marker></defs>`;
  g+=`<circle cx="${cx}" cy="${cy}" r="${R+8}" fill="url(#wr-sea)" stroke="${SV.navy}" stroke-width="1.5"/>`;
  g+=`<circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="${SV.grid}"/>`;
  for(let d=0;d<360;d+=15){const lg=d%45===0;const r1=lg?R-12:R-6;
    g+=`<line x1="${cx+r1*dx(d)}" y1="${cy+r1*dy(d)}" x2="${cx+R*dx(d)}" y2="${cy+R*dy(d)}" stroke="${SV.steel}" stroke-width="${lg?1.6:.8}"/>`;}
  const star=(col,a)=>`<polygon points="${cx},${cy-74} ${cx+9},${cy-10} ${cx},${cy} ${cx-9},${cy-10}" fill="${col}" transform="rotate(${a} ${cx} ${cy})"/>`;
  g+=star(SV.cyan,0)+star(SV.sky,90)+star("#bcd9e6",45)+star("#dbe9f0",135);
  g+=`<circle cx="${cx}" cy="${cy}" r="5" fill="${SV.navy}"/>`;
  pts.forEach(([l,b])=>{const one=l.length===1;
    g+=`<text x="${cx+(R+17)*dx(b)}" y="${cy+(R+17)*dy(b)}" font-size="${one?15:11}" font-weight="${one?800:600}" fill="${l==="N"?SV.red:SV.navy}" text-anchor="middle" dominant-baseline="middle" font-family="Manrope,sans-serif">${l}</text>`;});
  const tx=cx+(R-4)*dx(bearing),ty=cy+(R-4)*dy(bearing),hx=cx+32*dx(bearing),hy=cy+32*dy(bearing);
  for(let i=0;i<3;i++) g+=`<circle r="3.2" fill="${SV.cyan}"><animateMotion dur="1.6s" begin="${i*0.5}s" repeatCount="indefinite" path="M ${tx} ${ty} L ${hx} ${hy}"/><animate attributeName="opacity" values="0;1;1;0" dur="1.6s" begin="${i*0.5}s" repeatCount="indefinite"/></circle>`;
  g+=`<line x1="${tx}" y1="${ty}" x2="${hx}" y2="${hy}" stroke="${SV.sky}" stroke-width="6" stroke-linecap="round" marker-end="url(#wr-ah)"/>`;
  g+=`<text x="${cx}" y="${cy+21}" font-size="10" fill="#5d6f7b" text-anchor="middle" font-family="Manrope,sans-serif">brodica</text>`;
  return svgWrap(g,300,300);
}
function courseRose(bearing){
  const cx=150,cy=150,R=112;
  const dx=d=>Math.sin(d*Math.PI/180), dy=d=>-Math.cos(d*Math.PI/180);
  let g=`<defs><radialGradient id="cr-sea" cx="50%" cy="45%" r="66%"><stop offset="0" stop-color="${SV.seaLt}"/><stop offset="1" stop-color="${SV.sea}"/></radialGradient>
    <marker id="cr-ah" markerWidth="12" markerHeight="12" refX="7" refY="4" orient="auto"><path d="M0 0 L9 4 L0 8 Z" fill="${SV.navy}"/></marker></defs>`;
  g+=`<circle cx="${cx}" cy="${cy}" r="${R+8}" fill="url(#cr-sea)" stroke="${SV.navy}" stroke-width="1.5"/>`;
  for(let d=0;d<360;d+=10){const lg=d%30===0;const r1=lg?R-14:R-7;
    g+=`<line x1="${cx+r1*dx(d)}" y1="${cy+r1*dy(d)}" x2="${cx+R*dx(d)}" y2="${cy+R*dy(d)}" stroke="${SV.steel}" stroke-width="${lg?1.5:.8}"/>`;
    if(lg) g+=`<text x="${cx+(R-27)*dx(d)}" y="${cy+(R-27)*dy(d)}" font-size="9" fill="#5d6f7b" text-anchor="middle" dominant-baseline="middle" font-family="Manrope,sans-serif">${d}</text>`;}
  [["N",0,SV.red],["E",90,SV.navy],["S",180,SV.navy],["W",270,SV.navy]].forEach(([l,b,c])=>{
    g+=`<text x="${cx+(R+15)*dx(b)}" y="${cy+(R+15)*dy(b)}" font-size="14" font-weight="800" fill="${c}" text-anchor="middle" dominant-baseline="middle" font-family="Manrope,sans-serif">${l}</text>`;});
  const ex=cx+(R-22)*dx(bearing),ey=cy+(R-22)*dy(bearing);
  g+=`<line x1="${cx}" y1="${cy}" x2="${ex}" y2="${ey}" stroke="${SV.navy}" stroke-width="5" marker-end="url(#cr-ah)"/>`;
  g+=`<g transform="rotate(${bearing} ${cx} ${cy})"><g>
      <path d="M${cx} ${cy-15} C ${cx+7} ${cy-3}, ${cx+7} ${cy+9}, ${cx} ${cy+13} C ${cx-7} ${cy+9}, ${cx-7} ${cy-3}, ${cx} ${cy-15} Z" fill="${SV.lime}" stroke="${SV.navy}" stroke-width="1.5"/>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -9;0 0" dur="2.6s" repeatCount="indefinite"/></g></g>`;
  return svgWrap(g,300,300);
}
function waterBase(w,y){
  return `<defs><linearGradient id="wb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bfe3f0"/><stop offset="1" stop-color="#8fc7dd"/></linearGradient></defs>
    <rect x="0" y="${y}" width="${w}" height="${260-y}" fill="url(#wb)"/>
    <path d="M0 ${y} Q ${w*0.25} ${y-5} ${w*0.5} ${y} T ${w} ${y}" fill="none" stroke="#ffffff" stroke-width="2" opacity=".6"/>`;
}
function cardinalMark(type){
  const cx=150,bx=130,bw=40,by=120,bh=96,black="#141414",yellow=SV.yellow;
  const rect=(y,h,c)=>`<rect x="${bx}" y="${y}" width="${bw}" height="${h}" fill="${c}" stroke="${SV.navy}" stroke-width="1.2"/>`;
  let bands="";
  if(type==="N") bands=rect(by,bh/2,black)+rect(by+bh/2,bh/2,yellow);
  if(type==="S") bands=rect(by,bh/2,yellow)+rect(by+bh/2,bh/2,black);
  if(type==="E") bands=rect(by,bh/3,black)+rect(by+bh/3,bh/3,yellow)+rect(by+2*bh/3,bh/3,black);
  if(type==="W") bands=rect(by,bh/3,yellow)+rect(by+bh/3,bh/3,black)+rect(by+2*bh/3,bh/3,yellow);
  const s=22,gap=5,half=s*0.5;
  const tri=(yTop,dir)=> dir==="up"
    ? `<polygon points="${cx},${yTop} ${cx-half},${yTop+s} ${cx+half},${yTop+s}" fill="#141414" stroke="${SV.navy}" stroke-width="1"/>`
    : `<polygon points="${cx-half},${yTop} ${cx+half},${yTop} ${cx},${yTop+s}" fill="#141414" stroke="${SV.navy}" stroke-width="1"/>`;
  const t1=by-6-2*s-gap,t2=by-6-s;
  let tops="";
  if(type==="N") tops=tri(t1,"up")+tri(t2,"up");
  if(type==="S") tops=tri(t1,"down")+tri(t2,"down");
  if(type==="E") tops=tri(t1,"up")+tri(t2,"down");
  if(type==="W") tops=tri(t1,"down")+tri(t2,"up");
  const pole=`<line x1="${cx}" y1="${by+bh}" x2="${cx}" y2="${t2+s}" stroke="${SV.navy}" stroke-width="2.5"/>`;
  const buoy=`<g>${pole}${tops}${bands}<animateTransform attributeName="transform" type="translate" values="0 0;0 2.5;0 0" dur="3.2s" repeatCount="indefinite"/></g>`;
  return svgWrap(waterBase(300,196)+buoy+`<ellipse cx="${cx}" cy="200" rx="34" ry="6" fill="#0b2740" opacity=".12"/>`,300,250);
}
function lateralMark(color){
  const cx=150,by=120,bw=46,bh=96,bx=cx-bw/2;
  let body;
  if(color==="red"){ body=`<rect x="${bx}" y="${by}" width="${bw}" height="${bh}" rx="8" fill="${SV.red}" stroke="${SV.navy}" stroke-width="1.5"/>
    <rect x="${bx}" y="${by-16}" width="${bw}" height="16" rx="4" fill="${SV.red}" stroke="${SV.navy}" stroke-width="1.2"/>`;}
  else { body=`<polygon points="${cx},${by-16} ${bx},${by+bh} ${bx+bw},${by+bh}" fill="${SV.green}" stroke="${SV.navy}" stroke-width="1.5"/>`;}
  const pole=`<line x1="${cx}" y1="${by+bh}" x2="${cx}" y2="${by+bh+6}" stroke="${SV.navy}" stroke-width="2"/>`;
  const buoy=`<g>${pole}${body}<animateTransform attributeName="transform" type="translate" values="0 0;0 2.5;0 0" dur="3.2s" repeatCount="indefinite"/></g>`;
  return svgWrap(waterBase(300,200)+buoy+`<ellipse cx="${cx}" cy="202" rx="32" ry="6" fill="#0b2740" opacity=".12"/>`,300,250);
}
function lightStack(colors){
  const cx=150,r=12,gap=38,top=58;
  const map={red:"#e23b4e",green:"#1f9d57",white:"#eef3f5",yellow:"#ffd43b"};
  const H=top+gap*(colors.length-1)+54;
  let g=`<defs>${colors.map((c,i)=>`<radialGradient id="lg${i}" cx="50%" cy="50%" r="60%"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="${map[c]}"/></radialGradient>`).join('')}</defs>`;
  g+=`<line x1="${cx}" y1="${top-18}" x2="${cx}" y2="${H-18}" stroke="${SV.navy}" stroke-width="3.5"/>`;
  g+=`<path d="M${cx-26} ${H-18} Q ${cx} ${H-30} ${cx+26} ${H-18} L ${cx+20} ${H-6} L ${cx-20} ${H-6} Z" fill="${SV.hull}"/>`;
  colors.forEach((c,i)=>{const cy=top+gap*i;
    g+=`<circle cx="${cx}" cy="${cy}" r="${r+6}" fill="${map[c]}" opacity=".25"><animate attributeName="opacity" values=".1;.4;.1" dur="2.2s" begin="${i*0.3}s" repeatCount="indefinite"/></circle>`;
    g+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="url(#lg${i})" stroke="${SV.navy}" stroke-width="1.5"><animate attributeName="opacity" values=".75;1;.75" dur="2.2s" begin="${i*0.3}s" repeatCount="indefinite"/></circle>`;});
  return svgWrap(g,300,H);
}
function northStar(x,y){
  return `<g transform="translate(${x} ${y})"><circle r="13" fill="#fff" stroke="${SV.navy}" stroke-width="1.2"/>
    <polygon points="0,-11 3,0 0,2 -3,0" fill="${SV.red}"/><polygon points="0,11 3,0 0,-2 -3,0" fill="${SV.navy}"/>
    <text y="-15" font-size="9" font-weight="800" fill="${SV.red}" text-anchor="middle" font-family="Manrope,sans-serif">N</text></g>`;
}
function chartCoord(latLines,lonLines,latIdx,lonIdx){
  const x0=72,x1=292,y0=40,y1=226,nLon=lonLines.length,nLat=latLines.length;
  let g=`<defs><linearGradient id="cc-sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eaf5fb"/><stop offset="1" stop-color="#d4e9f4"/></linearGradient></defs>`;
  g+=`<rect x="${x0}" y="${y0}" width="${x1-x0}" height="${y1-y0}" fill="url(#cc-sea)" stroke="${SV.navy}" stroke-width="1.5"/>`;
  // graduirani rub (minutne crtice)
  for(let i=0;i<nLon-1;i++){for(let k=0;k<5;k++){const x=x0+(x1-x0)*(i+k/5)/(nLon-1);const h=k===0?0:3;
    g+=`<line x1="${x}" y1="${y0}" x2="${x}" y2="${y0+h+3}" stroke="${SV.navy}" stroke-width="1"/><line x1="${x}" y1="${y1}" x2="${x}" y2="${y1-h-3}" stroke="${SV.navy}" stroke-width="1"/>`;}}
  for(let i=0;i<nLat-1;i++){for(let k=0;k<5;k++){const y=y0+(y1-y0)*(i+k/5)/(nLat-1);const h=k===0?0:3;
    g+=`<line x1="${x0}" y1="${y}" x2="${x0+h+3}" y2="${y}" stroke="${SV.navy}" stroke-width="1"/><line x1="${x1}" y1="${y}" x2="${x1-h-3}" y2="${y}" stroke="${SV.navy}" stroke-width="1"/>`;}}
  lonLines.forEach((lab,i)=>{const x=x0+(x1-x0)*i/(nLon-1);
    g+=`<line x1="${x}" y1="${y0}" x2="${x}" y2="${y1}" stroke="${SV.grid}" stroke-dasharray="2 3"/>`;
    g+=`<text x="${x}" y="${y1+16}" font-size="10" text-anchor="middle" fill="${SV.navy}" font-family="Manrope,sans-serif">${lab}</text>`;});
  latLines.forEach((lab,i)=>{const y=y0+(y1-y0)*i/(nLat-1);
    g+=`<line x1="${x0}" y1="${y}" x2="${x1}" y2="${y}" stroke="${SV.grid}" stroke-dasharray="2 3"/>`;
    g+=`<text x="${x0-6}" y="${y+4}" font-size="10" text-anchor="end" fill="${SV.navy}" font-family="Manrope,sans-serif">${lab}</text>`;});
  const px=x0+(x1-x0)*lonIdx/(nLon-1),py=y0+(y1-y0)*latIdx/(nLat-1);
  g+=`<line x1="${x0}" y1="${py}" x2="${px}" y2="${py}" stroke="${SV.red}" stroke-width="1.3" stroke-dasharray="4 3" opacity=".8"/>`;
  g+=`<line x1="${px}" y1="${y1}" x2="${px}" y2="${py}" stroke="${SV.red}" stroke-width="1.3" stroke-dasharray="4 3" opacity=".8"/>`;
  g+=`<circle cx="${px}" cy="${py}" r="6" fill="none" stroke="${SV.red}" stroke-width="2"><animate attributeName="r" values="6;13;6" dur="1.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0;1" dur="1.8s" repeatCount="indefinite"/></circle>`;
  g+=`<circle cx="${px}" cy="${py}" r="5.5" fill="${SV.red}" stroke="#fff" stroke-width="1.5"/>`;
  g+=northStar(30,60);
  return svgWrap(g,320,262);
}

function boatMV(fill){ // brodica usmjerena prema +x (desno); rotate="auto" je okreće po smjeru
  return `<path d="M17 0 L -12 -10 Q -18 0 -12 10 Z" fill="${fill}" stroke="${SV.navy}" stroke-width="1.5" stroke-linejoin="round"/><circle cx="-3" cy="0" r="2.4" fill="${SV.navy}"/>`;

function mover(path,fill,dur,begin){
  return `<g>${boatMV(fill)}<animateMotion dur="${dur}s" begin="${begin||0}s" repeatCount="indefinite" rotate="auto" path="${path}"/></g>`;
}
function riskPt(x,y){return `<circle cx="${x}" cy="${y}" r="7" fill="none" stroke="${SV.red}" stroke-width="2"><animate attributeName="r" values="7;17;7" dur="1.6s" repeatCount="indefinite"/><animate attributeName="opacity" values=".9;0;.9" dur="1.6s" repeatCount="indefinite"/></circle>`;}
function collisionScene(kind){
  const W=320,H=236;
  let g=`<defs><linearGradient id="cs-sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dff1f8"/><stop offset="1" stop-color="#b5ddec"/></linearGradient></defs>`;
  g+=`<rect x="0" y="0" width="${W}" height="${H}" rx="12" fill="url(#cs-sea)"/>`;
  g+=northStar(W-24,26);
  g+=`<circle cx="16" cy="16" r="6" fill="${SV.lime}" stroke="${SV.navy}"/><text x="27" y="20" font-size="12" font-weight="800" fill="${SV.navy}" font-family="Manrope,sans-serif">A</text>`;
  g+=`<circle cx="58" cy="16" r="6" fill="${SV.red}" stroke="${SV.navy}"/><text x="69" y="20" font-size="12" font-weight="800" fill="${SV.navy}" font-family="Manrope,sans-serif">B</text>`;
  const dash=(p)=>`<path d="${p}" stroke="${SV.steel}" stroke-width="1.3" stroke-dasharray="5 4" fill="none" opacity=".7"/>`;
  if(kind==="headon"){
    g+=dash("M150 214 L150 110")+dash("M172 26 L172 120")+riskPt(161,118);
    g+=mover("M150 214 L150 112",SV.lime,3.2)+mover("M172 26 L172 118",SV.red,3.2);
  } else if(kind==="crossing"){
    g+=dash("M150 216 L150 92")+dash("M298 120 L128 120")+riskPt(150,120);
    g+=mover("M150 216 L150 96",SV.lime,3.6)+mover("M298 120 L130 120",SV.red,3.6);
  } else { // overtaking
    g+=dash("M164 150 L164 90")+dash("M150 232 L150 120")+riskPt(157,128);
    g+=mover("M164 150 L164 96",SV.lime,4.6)+mover("M150 232 L150 126",SV.red,2.7);
  }
  return svgWrap(g,W,H);
}
/* ---- bljeskajuće svjetlo (karakteristika) ---- */
function flashAnim(n){
  if(!n) return `<animate attributeName="opacity" values="0;1;0;1;0" keyTimes="0;.2;.4;.6;1" dur="1.1s" repeatCount="indefinite"/>`;
  const on=.28,gap=.3,ecl=1.9; let t=0,times=[],vals=[];
  const push=(tt,v)=>{times.push(tt);vals.push(v);};
  for(let i=0;i<n;i++){push(t,0);push(t+.02,1);push(t+on,1);push(t+on+.02,0);t+=on+gap;}
  const cyc=t+ecl; push(cyc,0);
  return `<animate attributeName="opacity" values="${vals.join(';')}" keyTimes="${times.map(x=>(x/cyc).toFixed(3)).join(';')}" dur="${cyc.toFixed(2)}s" repeatCount="indefinite"/>`;
}

  g+=`<rect x="0" y="150" width="${W}" height="${H-150}" fill="url(#ff-wb)"/>`;
  g+=`<polygon points="${cx-17},150 ${cx+17},150 ${cx+10},92 ${cx-10},92" fill="${SV.navy}"/>`;
  g+=`<rect x="${cx-17}" y="124" width="34" height="11" fill="${SV.yellow}" stroke="${SV.navy}" stroke-width="1"/>`;
  g+=`<rect x="${cx-10}" y="76" width="20" height="18" rx="2" fill="#d9e3e8" stroke="${SV.navy}"/>`;
  g+=`<circle cx="${cx}" cy="${ly+6}" r="42" fill="url(#ff-glow)">${flashAnim(n)}</circle>`;
  g+=`<circle cx="${cx}" cy="${ly+6}" r="7.5" fill="#fffbe6" stroke="${SV.navy}" stroke-width="1.2">${flashAnim(n)}</circle>`;
  g+=`<text x="${cx}" y="190" font-size="13" font-weight="800" fill="${SV.navy}" text-anchor="middle" font-family="Manrope,sans-serif">${n?('Fl('+n+')'):'Q — neprekidno'}</text>`;
  return svgWrap(g,W,H);
}
function buildVisuals(){
  const V=[];

  const windList=[[0,"Tramontana","str. 13 — Tramontana (N)"],[45,"Bura","str. 16 — Bura (NE)"],[90,"Levant","str. 17 — Levant (E)"],[135,"Jugo (široko)","str. 17 — Jugo (SE)"],[225,"Lebić (garbin)","str. 17 — Lebić (SW)"],[270,"Pulenat","str. 17 — Pulenat (W)"],[315,"Maestral","str. 18 — Maestral (NW)"]];
  const allW=windList.map(w=>w[1]);
  windList.forEach(([b,name,ref],i)=>{
    const o=allW.filter(n=>n!==name);
    V.push({id:"viz-wind-"+b,topic:"vjetar",level:"viz",q:"Plava strelica pokazuje ODAKLE vjetar dolazi (puše prema brodici). Koji je to vjetar na Jadranu?",choices:[name,o[i%o.length],o[(i+1)%o.length],o[(i+2)%o.length]],hint:"Gledaj s koje strane svijeta počinje strelica.",ref:ref,visual:windRose(b)});
  });

  const card=[["N","Sjeverna kardinalna oznaka"],["E","Istočna kardinalna oznaka"],["S","Južna kardinalna oznaka"],["W","Zapadna kardinalna oznaka"]];
  const cn=card.map(c=>c[1]);

function norm(s){return (s||'').toString().toLowerCase()
  .replace(/[čć]/g,'c').replace(/š/g,'s').replace(/ž/g,'z').replace(/đ/g,'dj')
  .replace(/[^a-z0-9 ]+/g,' ').replace(/\s+/g,' ').trim();}
function firstNum(s){const m=(s||'').toString().replace(',','.').match(/-?\d+(?:\.\d+)?/);return m?parseFloat(m[0]):NaN;}
function isCorrect(raw,q){
  if(q.num){const v=firstNum(raw); if(!isNaN(v)&&Math.abs(v-q.num.value)<=q.num.tol) return true;}
  const u=norm(raw); if(!u) return false;
  const uTok=u.split(' ').filter(Boolean);
  // duljina zajedničkog početka (korijena) dviju riječi
  const cpl=(a,b)=>{let i=0,m=Math.min(a.length,b.length);while(i<m&&a[i]===b[i])i++;return i;};
  // token se poklapa: identičan, ILI dijele korijen (≥3 slova) a razlikuju se samo u nastavku (do 2 slova sa svake strane).
  // Time 'desnu'≈'desno', 'jugozapada'≈'jugozapad' prolaze, a 'sjeveroistok'≠'sjever' se odbija.
  const tokMatch=(ut,at)=>{
    if(ut===at) return true;
    if(at.length<3) return false;
    const cp=cpl(ut,at);
    return cp>=3 && (ut.length-cp)<=2 && (at.length-cp)<=2;
  };
  // tražena fraza (niz tokena) mora se pojaviti kao uzastopni niz u korisnikovom odgovoru
  const seqMatch=(aTok)=>{
    for(let i=0;i+aTok.length<=uTok.length;i++){
      let ok=true;
      for(let j=0;j<aTok.length;j++){ if(!tokMatch(uTok[i+j],aTok[j])){ok=false;break;} }
      if(ok) return true;
    }
    return false;
  };
  return (q.accept||[]).some(a=>{
    const an=norm(a); if(!an) return false;
    if(an.length<=2) return u===an;               // kratke šifre (ne, se, sw, n, w…) = potpuno poklapanje
    const aTok=an.split(' ').filter(Boolean);
    return aTok.length>0 && seqMatch(aTok);
  });
}

  g+=`<circle cx="${pts[0][0]}" cy="${pts[0][1]-4}" r="13" fill="none" stroke="${SV.red}" stroke-width="2"><animate attributeName="r" values="13;18;13" dur="1.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;.3;1" dur="1.8s" repeatCount="indefinite"/></circle>`;
  g+=northStar(x0+18,y0+18);
  return svgWrap(g,x0+w+20,y0+h+20);
}

/* ============================================================
   SLOJ PODATAKA (DEMO) — sve ide kroz KV + Auth.
   U produkciji: Auth.* i KV pozivi postaju API pozivi (baza),
   ekrani se ne mijenjaju.
   ============================================================ */
const K_USERS="btr_users", K_LOGS="btr_logins", K_SESSION="btr_session", STORE_KEY="kvizBrodicaV1";
const _mem={};
const KV={
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return (k in _mem)?_mem[k]:null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){ _mem[k]=v; } },
  del(k){ try{ localStorage.removeItem(k); }catch(e){ delete _mem[k]; } },
  json(k,d){ try{ const v=this.get(k); return v?JSON.parse(v):d; }catch(e){ return d; } },
  put(k,o){ this.set(k,JSON.stringify(o)); }
};
function rid(){ try{ return crypto.randomUUID(); }catch(e){ return Date.now().toString(36)+Math.random().toString(36).slice(2,10); } }
async function hashPw(pw,salt){
  const data=new TextEncoder().encode(salt+":"+pw);
  try{ const h=await crypto.subtle.digest("SHA-256",data); return [...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,"0")).join(""); }
  catch(e){ let h=5381; for(const b of data) h=((h<<5)+h+b)>>>0; return "x"+h.toString(16); } // samo bez HTTPS-a (demo)
}
const normEmail=e=>(e||"").trim().toLowerCase();
const validEmail=e=>/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(e);
function genPassword(){ const a="abcdefghjkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789"; let s=""; const r=new Uint32Array(10);
  try{ crypto.getRandomValues(r); }catch(e){ for(let i=0;i<10;i++) r[i]=Math.random()*1e9; } r.forEach(n=>s+=a[n%a.length]); return s; }

// Demo računi (seed) — samo za prezentaciju
const DEMO_ACCOUNTS={ admin:{email:"admin@demo.hr",password:"admin-demo-2026",name:"Administrator",role:"admin"},
                      user:{email:"ucenik@demo.hr",password:"ucenik-demo-2026",name:"Demo učenik",role:"user"} };

const Auth={
  users(){ return KV.json(K_USERS,[]); },
  saveUsers(u){ KV.put(K_USERS,u); },
  logs(){ return KV.json(K_LOGS,[]); },
  addLog(e){ const l=this.logs(); l.unshift(e); KV.put(K_LOGS,l.slice(0,3000)); },
  async seed(){ if(this.users().length) return; for(const a of Object.values(DEMO_ACCOUNTS)) await this.createUser(a,null); },
  async createUser({email,password,name,role},byId){
    email=normEmail(email);
    if(!validEmail(email)) throw new Error("Upiši ispravnu e-mail adresu.");
    if(!password || password.length<8) throw new Error("Lozinka mora imati najmanje 8 znakova.");
    const users=this.users();
    if(users.some(u=>u.email===email)) throw new Error("Korisnik s tim e-mailom već postoji.");
    const salt=rid();
    const u={id:rid(),email,name:(name||"").trim(),role:role==="admin"?"admin":"user",active:true,salt,
      pw:await hashPw(password,salt),createdAt:Date.now(),createdBy:byId||null,lastLogin:null,loginCount:0};
    users.push(u); this.saveUsers(users); return u;
  },
  async login(email,password){
    email=normEmail(email);
    const users=this.users(), u=users.find(x=>x.email===email);
    const pwOk = !!u && (await hashPw(password,u.salt))===u.pw;
    const ok = pwOk && u.active;
    this.addLog({at:Date.now(),email,userId:u?u.id:null,ok,
      reason: ok?"":(!u?"Nepoznat e-mail":!pwOk?"Pogrešna lozinka":"Račun deaktiviran")});
    if(!ok) throw new Error(pwOk && !u.active ? "Račun je deaktiviran. Javi se Boat Training Rovinj." : "Pogrešan e-mail ili lozinka.");
    u.lastLogin=Date.now(); u.loginCount=(u.loginCount||0)+1; this.saveUsers(users);
    KV.put(K_SESSION,{userId:u.id,at:Date.now()});
    return u;
  },
  current(){ const s=KV.json(K_SESSION,null); if(!s) return null; const u=this.users().find(x=>x.id===s.userId); return u&&u.active?u:null; },
  logout(){ KV.del(K_SESSION); },
  update(id,fn){ const users=this.users(); const u=users.find(x=>x.id===id); if(!u) return; fn(u); this.saveUsers(users); },
  async setPassword(id,pw){ if(!pw||pw.length<8) throw new Error("Lozinka mora imati najmanje 8 znakova.");
    const salt=rid(), h=await hashPw(pw,salt); this.update(id,u=>{u.salt=salt;u.pw=h;}); },
  activeAdmins(){ return this.users().filter(u=>u.role==="admin"&&u.active); },
  remove(id){ this.saveUsers(this.users().filter(u=>u.id!==id)); KV.del(STORE_KEY+":"+id); }
};

const TOPIC_GROUPS=[
  {name:"Usmeni ispit",icon:"speech",keys:["pula"]},
  {name:"Navigacija",icon:"compass",keys:["karta","kurs","vjetar"]},

];
(function(){ const g=TOPIC_GROUPS.flatMap(x=>x.keys); const extra=Object.keys(TOPICS).filter(k=>!g.includes(k)); if(extra.length) TOPIC_GROUPS.push({name:"Ostalo",icon:"layers",keys:extra}); })();
const LEVEL_META={
  osn:{t:"Osnovna",d:"Gradivo iz skripte, direktno"},
  napr:{t:"Napredna",d:"Detalji, formule i tablice"},
  trik:{t:"Zamke",d:"Pitanja sa skrivenom klopkom"},

};
const ALL_T=()=>Object.keys(TOPICS), ALL_L=()=>Object.keys(LEVELS);
const topicName=k=>k==='pula'?'Usmeni ispit — najčešća pitanja':(TOPICS[k]||k).replace(/^⭐\s*/,'');
const plural=(n,one,few,many)=>{const a=n%10,b=n%100; return a===1&&b!==11?one:(a>=2&&a<=4&&(b<12||b>14))?few:many;};
const nQ=n=>`${n} ${plural(n,'pitanje','pitanja','pitanja')}`;
const countQ=(topics,levels)=>QUESTIONS.filter(q=>topics.includes(q.topic)&&levels.includes(q.level||'osn')).length;
const minutes=n=>Math.max(1,Math.round(n*0.5));

/* ---------- napredak po korisniku ---------- */
function loadProgress(){
  let p=KV.json(STORE_KEY+":"+currentUser.id,null);
  if(!p && currentUser.role!=="admin" && !KV.get("btr_legacy_done")){
    const legacy=KV.json(STORE_KEY,null);
    if(legacy && legacy.q){ p=legacy; KV.set("btr_legacy_done","1"); }
  }
  p=p||{}; if(!p.q) p.q={}; if(!p.days) p.days=[];
  const old=p.prefs||{};
  p.prefs={ custom: old.custom || {topics:old.topics||null, levels:old.levels||null, len:old.len||15},
            last: old.last||null, lessonLevels: old.lessonLevels||null };
  return p;
}
function persist(){ if(currentUser&&progress) KV.put(STORE_KEY+":"+currentUser.id, progress); }
function qStat(id){ if(!progress.q[id]) progress.q[id]={box:0,seen:0,correct:0,wrong:0}; return progress.q[id]; }
const dayKey=(d=new Date())=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
function markDay(){ const k=dayKey(); if(progress.days[progress.days.length-1]!==k){ progress.days.push(k); if(progress.days.length>400) progress.days.shift(); } }
function streak(){
  const set=new Set(progress.days); let n=0; const d=new Date();
  if(!set.has(dayKey(d))) d.setDate(d.getDate()-1);
  while(set.has(dayKey(d))){ n++; d.setDate(d.getDate()-1); }
  return n;
}
function statsFor(qs){
  let sum=0,seen=0,ans=0,cor=0; const boxes=[0,0,0,0,0,0];
  qs.forEach(q=>{ const s=progress.q[q.id]; if(s&&s.seen){ sum+=Math.min(s.box,5); seen++; ans+=s.seen; cor+=s.correct; boxes[Math.max(1,Math.min(s.box,5))]++; } else boxes[0]++; });
  return {total:qs.length, mastery:qs.length?Math.round(sum/(5*qs.length)*100):0, seen, answers:ans, acc:ans?Math.round(cor/ans*100):null, boxes};
}
const topicStats=k=>statsFor(QUESTIONS.filter(q=>q.topic===k));
const weakPool=()=>QUESTIONS.filter(q=>{ const s=progress.q[q.id]; return s&&s.wrong>0&&s.box<=2; });

const BOX_WEIGHT={0:7,1:9,2:5,3:3,4:1.5,5:0.7};
function pickQuestions(topics,n,levels){
  levels=levels||ALL_L();
  const pool=QUESTIONS.filter(q=>topics.includes(q.topic)&&levels.includes(q.level||'osn'));
  if(!pool.length) return [];
  const items=pool.map(q=>{ const s=progress.q[q.id]||{box:0,seen:0}; let w=BOX_WEIGHT[Math.min(s.box,5)]??1; if(s.seen===0) w+=3; return {q,w}; });
  const chosen=[], limit=n==='all'?items.length:Math.min(n,items.length);
  for(let k=0;k<limit;k++){ let total=items.reduce((a,b)=>a+b.w,0), r=Math.random()*total, idx=0;
    for(let i=0;i<items.length;i++){ r-=items[i].w; if(r<=0){idx=i;break;} } chosen.push(items[idx].q); items.splice(idx,1); }
  return chosen;
}
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]];} return a; }

/* ---------- pokretanje vježbe iz konfiguracije ---------- */
// cfg: {kind, label, topics, levels, len}
function cfgText(c){
  const t=c.topics||ALL_T(), l=c.levels||ALL_L();
  const tTxt=t.length===ALL_T().length?'sve lekcije':t.length===1?topicName(t[0]):`${t.length} ${plural(t.length,'lekcija','lekcije','lekcija')}`;
  const lTxt=l.length===ALL_L().length?'sve težine':l.map(k=>LEVEL_META[k].t.toLowerCase()).join(', ');
  return {tTxt,lTxt};
}
function startCfg(cfg,from){
  let list;
  if(cfg.kind==='weak'){ const pool=weakPool(); list=shuffle(pool).slice(0,cfg.len==='all'?pool.length:Math.min(cfg.len,pool.length)); }
  else list=pickQuestions(cfg.topics||ALL_T(), cfg.len, cfg.levels||ALL_L());
  if(!list.length){ toast(cfg.kind==='weak'?'Nemaš pitanja za ponavljanje — odlično!':'Za taj odabir nema pitanja.'); return; }
  progress.prefs.last=cfg; persist();
  session={queue:list.slice(), idx:0, correct:0, answered:0, wrongIds:[], byTopic:{}, requeued:new Set(), cfg, from:from||'#/pocetna'};
  go('#/kviz');
}
const PRESETS={
  mix:()=>({kind:'mix',label:'Mješovita vježba',topics:null,levels:null,len:15}),
  oral:()=>({kind:'oral',label:'Usmeni ispit — najčešća pitanja',topics:['pula'],levels:null,len:15}),
  viz:()=>({kind:'viz',label:'Slikovna pitanja',topics:null,levels:['viz'],len:15}),
  weak:()=>({kind:'weak',label:'Ponavljanje slabih pitanja',len:15})
};

/* ---------- ruter i ljuska ---------- */
function go(h){ if(location.hash===h) render(); else location.hash=h; }
const routeParts=()=>location.hash.replace(/^#\/?/,'').split('/').filter(Boolean).map(decodeURIComponent);
let pendingRoute=null;
const NAV_USER=[['pocetna','Početna','home'],['vjezba','Vježba','target'],['lekcije','Lekcije','book'],['profil','Profil','user']];
const NAV_ADMIN=[['admin/korisnici','Korisnici','users'],['admin/prijave','Prijave','history'],['pocetna','Aplikacija','home'],['profil','Profil','user']];
function shell({title='',back=null,nav=null,chrome=true,wide=false}={}){
  const app=$('app'), items=currentUser&&currentUser.role==='admin'?NAV_ADMIN:NAV_USER;
  app.classList.toggle('has-nav', chrome && !!currentUser);

  bb.innerHTML=icon('left'); bb.onclick=()=>go(back);
  const html=items.map(([r,l,i])=>`<a href="#/${r}" ${nav===r?'aria-current="page"':''}>${icon(i)}<span>${l}</span></a>`).join('');
  $('bottomNav').innerHTML=html; $('sideNav').innerHTML=html;
  if(currentUser){ $('sideWho').textContent=currentUser.name||currentUser.email; $('sideRole').textContent=currentUser.role==='admin'?'Administrator':'Učenik'; }
  const v=$('view'); v.className=(wide?'wide ':'')+(chrome?'':'bare'); document.title=(title?title+' · ':'')+'Boat Training Rovinj';
}
function mount(html,{focus=true}={}){
  const v=$('view'); v.innerHTML=`<div class="view-enter">${html}</div>`; window.scrollTo(0,0);
  if(focus) v.focus({preventScroll:true});
}
function render(){
  const p=routeParts(), r=p[0]||'';
  if($('dlg').open) $('dlg').close();
  if(!currentUser){ if(r!=='prijava'){ if(r) pendingRoute=location.hash; location.replace('#/prijava'); return; } return viewLogin(); }
  if(!r||r==='prijava'){ location.replace(currentUser.role==='admin'?'#/admin/korisnici':'#/pocetna'); return; }
  if(r==='admin' && currentUser.role!=='admin'){ location.replace('#/pocetna'); return; }
  const key=p.join('/');
  if(r!=='kviz' && r!=='rezultat' && session && !session.done){ session=null; }
  switch(true){
    case key==='pocetna': return viewHome();
    case key==='vjezba': return viewPractice();
    case key==='vjezba/slozi': return viewCompose();
    case key==='vjezba/slozi/lekcije': return viewComposeLessons();
    case key==='vjezba/slozi/tezina': return viewComposeLevels();
    case key==='lekcije': return viewLessons();
    case r==='lekcije' && !!TOPICS[p[1]]: return viewLesson(p[1]);
    case key==='profil': return viewProfile();
    case key==='kviz': return viewQuiz();
    case key==='rezultat': return viewResult();
    case key==='admin/korisnici': return viewAdminUsers();
    case key==='admin/prijave': return viewAdminLogins();
    default: location.replace(currentUser.role==='admin'?'#/admin/korisnici':'#/pocetna');
  }
}
window.addEventListener('hashchange',render);

/* ---------- pomoćne komponente ---------- */
function ring(pct,size=96,label='Spremnost'){
  const r=(size-12)/2, c=2*Math.PI*r;
  return `<svg class="ring" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img" aria-label="${label} ${pct}%">
    <circle class="ring-bg" cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke-width="10"/>
    <circle class="ring-fg" cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke-width="10" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-pct/100)}" transform="rotate(-90 ${size/2} ${size/2})"/>
    <text x="50%" y="50%" text-anchor="middle" dominant-baseline="central" font-size="${size/4.6}">${pct}%</text></svg>`;
}
function toast(msg,ic='ok'){
  const t=document.createElement('div'); t.className='toast'; t.innerHTML=icon(ic,'sm')+`<span>${escapeHtml(msg)}</span>`;
  $('toasts').appendChild(t); setTimeout(()=>t.remove(),3800);
}
function dialog({title,body,foot,onMount}){
  const d=$('dlg');
  d.innerHTML=`<div class="dlg-head"><h2 id="dlgTitle">${title}</h2><button class="icon-btn" data-close aria-label="Zatvori">${icon('x')}</button></div>
    <div class="dlg-body">${body}</div>${foot?`<div class="dlg-foot">${foot}</div>`:''}`;
  d.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>d.close());
  if(!d.open) d.showModal();
  if(onMount) onMount(d);
}
function confirmDlg({title,text,ok='Potvrdi',danger=false}){
  return new Promise(res=>{
    dialog({title,body:`<p style="margin:0">${text}</p>`,
      foot:`<button class="btn secondary" data-close>Odustani</button><button class="btn ${danger?'danger':'primary'}" id="dlgOk">${ok}</button>`,
      onMount:d=>{ let done=false; $('dlgOk').onclick=()=>{done=true;d.close();res(true);}; d.addEventListener('close',()=>{ if(!done) res(false); },{once:true}); $('dlgOk').focus(); }});
  });
}
const fmtTime=ts=>ts?new Date(ts).toLocaleString('hr-HR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}):'—';
function relTime(ts){ if(!ts) return 'nikad'; const m=Math.round((Date.now()-ts)/60000); if(m<1) return 'upravo'; if(m<60) return `prije ${m} min`; const h=Math.round(m/60); if(h<24) return `prije ${h} h`; const d=Math.round(h/24); return d<8?`prije ${d} ${plural(d,'dan','dana','dana')}`:fmtTime(ts); }
