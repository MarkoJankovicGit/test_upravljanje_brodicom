(function applyQuestionLang(){
  if(LANG==='hr') return; const m=I18N_Q[LANG]||{};

function rid(){ try{ return crypto.randomUUID(); }catch(e){ return Date.now().toString(36)+Math.random().toString(36).slice(2,10); } }
async function hashPw(pw,salt){
  const data=new TextEncoder().encode(salt+":"+pw);
  try{ const h=await crypto.subtle.digest("SHA-256",data); return [...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,"0")).join(""); }
  catch(e){ let h=5381; for(const b of data) h=((h<<5)+h+b)>>>0; return "x"+h.toString(16); } // samo bez HTTPS-a (demo)
}
const normEmail=e=>(e||"").trim().toLowerCase();
const validEmail=e=>/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(e);
function genPassword(){ const a="abcdefghjkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789"; let s=""; const r=new Uint32Array(10);
  try{ crypto.getRandomValues(r); }catch(e){ for(let i=0;i<10;i++) r[i]=Math.random()*1e9; } r.forEach(n=>s+=a[n%a.length]); return s; }

const Auth={

  addLog(e){ const l=this.logs(); l.unshift(e); KV.put(K_LOGS,l.slice(0,3000)); },
  async seed(){ if(this.users().length) return; for(const a of Object.values(DEMO_ACCOUNTS)) await this.createUser(a,null); },
  async createUser({email,password,name,role},byId){
    email=normEmail(email);
    if(!validEmail(email)) throw new Error("Upiši ispravnu e-mail adresu.");
    if(!password || password.length<8) throw new Error("Lozinka mora imati najmanje 8 znakova.");
    const users=this.users();
    if(users.some(u=>u.email===email)) throw new Error("Korisnik s tim e-mailom već postoji.");
    const salt=rid();
    const u={id:rid(),email,name:(name||"").trim(),role:role==="admin"?"admin":"user",active:true,salt,
      pw:await hashPw(password,salt),createdAt:Date.now(),createdBy:byId||null,lastLogin:null,loginCount:0};
    users.push(u); this.saveUsers(users); return u;
  },
  async login(email,password){
    email=normEmail(email);
    const users=this.users(), u=users.find(x=>x.email===email);
    const pwOk = !!u && (await hashPw(password,u.salt))===u.pw;
    const ok = pwOk && u.active;
    this.addLog({at:Date.now(),email,userId:u?u.id:null,ok,
      reason: ok?"":(!u?"Nepoznat e-mail":!pwOk?"Pogrešna lozinka":"Račun deaktiviran")});
    if(!ok) throw Object.assign(new Error(pwOk && !u.active ? "Račun je deaktiviran. Javi se Boat Training Rovinj." : "Pogrešan e-mail ili lozinka."),{code:(pwOk && !u.active)?"off":"bad"});
    u.lastLogin=Date.now(); u.loginCount=(u.loginCount||0)+1; this.saveUsers(users);
    KV.put(K_SESSION,{userId:u.id,at:Date.now()});
    return u;
  },
  current(){ const s=KV.json(K_SESSION,null); if(!s) return null; const u=this.users().find(x=>x.id===s.userId); return u&&u.active?u:null; },
  logout(){ KV.del(K_SESSION); },
  update(id,fn){ const users=this.users(); const u=users.find(x=>x.id===id); if(!u) return; fn(u); this.saveUsers(users); },
  async setPassword(id,pw){ if(!pw||pw.length<8) throw new Error("Lozinka mora imati najmanje 8 znakova.");
    const salt=rid(), h=await hashPw(pw,salt); this.update(id,u=>{u.salt=salt;u.pw=h;}); },
  activeAdmins(){ return this.users().filter(u=>u.role==="admin"&&u.active); },
  remove(id){ this.saveUsers(this.users().filter(u=>u.id!==id)); KV.del(STORE_KEY+":"+id); }

function persist(){ if(currentUser&&progress) KV.put(STORE_KEY+":"+currentUser.id, progress); }
function qStat(id){ if(!progress.q[id]) progress.q[id]={box:0,seen:0,correct:0,wrong:0}; return progress.q[id]; }
const dayKey=(d=new Date())=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
function markDay(){ const k=dayKey(); if(progress.days[progress.days.length-1]!==k){ progress.days.push(k); if(progress.days.length>400) progress.days.shift(); } }
function streak(){
  const set=new Set(progress.days); let n=0; const d=new Date();
  if(!set.has(dayKey(d))) d.setDate(d.getDate()-1);
  while(set.has(dayKey(d))){ n++; d.setDate(d.getDate()-1); }
  return n;
}
function statsFor(qs){
  let sum=0,seen=0,ans=0,cor=0; const boxes=[0,0,0,0,0,0];
  qs.forEach(q=>{ const s=progress.q[q.id]; if(s&&s.seen){ sum+=Math.min(s.box,5); seen++; ans+=s.seen; cor+=s.correct; boxes[Math.max(1,Math.min(s.box,5))]++; } else boxes[0]++; });
  return {total:qs.length, mastery:qs.length?Math.round(sum/(5*qs.length)*100):0, seen, answers:ans, acc:ans?Math.round(cor/ans*100):null, boxes};
}
const topicStats=k=>statsFor(QUESTIONS.filter(q=>q.topic===k));
const weakPool=()=>QUESTIONS.filter(q=>{ const s=progress.q[q.id]; return s&&s.wrong>0&&s.box<=2; });

const BOX_WEIGHT={0:7,1:9,2:5,3:3,4:1.5,5:0.7};
function pickQuestions(topics,n,levels){
  levels=levels||ALL_L();
  const pool=QUESTIONS.filter(q=>topics.includes(q.topic)&&levels.includes(q.level||'osn'));
  if(!pool.length) return [];
  const items=pool.map(q=>{ const s=progress.q[q.id]||{box:0,seen:0}; let w=BOX_WEIGHT[Math.min(s.box,5)]??1; if(s.seen===0) w+=3; return {q,w}; });
  const chosen=[], limit=n==='all'?items.length:Math.min(n,items.length);
  for(let k=0;k<limit;k++){ let total=items.reduce((a,b)=>a+b.w,0), r=Math.random()*total, idx=0;
    for(let i=0;i<items.length;i++){ r-=items[i].w; if(r<=0){idx=i;break;} } chosen.push(items[idx].q); items.splice(idx,1); }
  return chosen;
}
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]];} return a; }

function render(){

  if($('dlg').open) $('dlg').close();
  if(!currentUser){ if(r!=='prijava'){ if(r) pendingRoute=location.hash; location.replace('#/prijava'); return; } return viewLogin(); }

  if(r==='admin' && currentUser.role!=='admin'){ location.replace('#/pocetna'); return; }
  if(r!=='admin' && currentUser.role==='admin'){ location.replace('#/admin/korisnici'); return; }
  const key=p.join('/');
  if(r!=='kviz' && r!=='rezultat' && session && !session.done){ session=null; }
  switch(true){
    case key==='pocetna': return viewHome();
    case key==='vjezba': return viewPractice();
    case key==='vjezba/slozi': return viewCompose();
    case key==='vjezba/slozi/lekcije': return viewComposeLessons();
    case key==='vjezba/slozi/tezina': return viewComposeLevels();
    case key==='lekcije': return viewLessons();
    case r==='lekcije' && !!TOPICS[p[1]]: return viewLesson(p[1]);
    case key==='profil': return viewProfile();
    case key==='kviz': return viewQuiz();
    case key==='rezultat': return viewResult();

  }
}

/* ---------- pomoćne komponente ---------- */
function ring(pct,size=96,label){
  const r=(size-12)/2, c=2*Math.PI*r;
  return `<svg class="ring" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img" aria-label="${escapeHtml(label||t('home.ready'))} ${pct}%">
    <circle class="ring-bg" cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke-width="10"/>
    <circle class="ring-fg" cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke-width="10" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-pct/100)}" transform="rotate(-90 ${size/2} ${size/2})"/>
    <text x="50%" y="50%" text-anchor="middle" dominant-baseline="central" font-size="${size/4.6}">${pct}%</text></svg>`;
}
function toast(msg,ic='ok'){
  const el=document.createElement('div'); el.className='toast'; el.innerHTML=icon(ic,'sm')+`<span>${escapeHtml(msg)}</span>`;
  $('toasts').appendChild(el); setTimeout(()=>el.remove(),3800);
}
function dialog({title,body,foot,onMount}){
  const d=$('dlg');
  d.innerHTML=`<div class="dlg-head"><h2 id="dlgTitle">${title}</h2><button class="icon-btn" data-close aria-label="${t('close')}">${icon('x')}</button></div>
    <div class="dlg-body">${body}</div>${foot?`<div class="dlg-foot">${foot}</div>`:''}`;
  d.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>d.close());
  if(!d.open) d.showModal();
  if(onMount) onMount(d);
}
function confirmDlg({title,text,ok,danger=false}){
  return new Promise(res=>{
    dialog({title,body:`<p style="margin:0">${text}</p>`,
      foot:`<button class="btn secondary" data-close>${t('cancel')}</button><button class="btn ${danger?'danger':'primary'}" id="dlgOk">${ok||'OK'}</button>`,
      onMount:d=>{ let done=false; $('dlgOk').onclick=()=>{done=true;d.close();res(true);}; d.addEventListener('close',()=>{ if(!done) res(false); },{once:true}); $('dlgOk').focus(); }});
  });
}
const fmtTime=ts=>ts?new Date(ts).toLocaleString('hr-HR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}):'—';
function relTime(ts){ if(!ts) return 'nikad'; const m=Math.round((Date.now()-ts)/60000); if(m<1) return 'upravo'; if(m<60) return `prije ${m} min`; const h=Math.round(m/60); if(h<24) return `prije ${h} h`; const d=Math.round(h/24); return d<8?`prije ${d} ${plural(d,'dan','dana','dana')}`:fmtTime(ts); }
function langSwitch(){
  return `<div class="seg lang-seg" role="group" aria-label="${t('lang.label')}">${LANGS.map(l=>`<button type="button" data-lang="${l}" aria-pressed="${l===LANG}" lang="${l}" title="${{hr:'Hrvatski',en:'English',de:'Deutsch'}[l]}">${l.toUpperCase()}</button>`).join('')}</div>`;
}
function bindLangSwitch(){ document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{ if(b.dataset.lang!==LANG) setLang(b.dataset.lang); }); }

function viewLogin(){

  shell({chrome:false});
  mount(`<div class="login"><div class="login-card">
    <div class="login-top"><img class="login-logo" src="btr-logo.jpg" alt="Boat Training Rovinj" width="72" height="72">${langSwitch()}</div>
    <h1>${t('login.title')}</h1>

    <form id="loginForm" novalidate>
      <div id="loginErr" class="alert hidden" role="alert"></div>
      <div class="field"><label for="lEmail">${t('login.email')}</label>
        <input class="input" id="lEmail" type="email" autocomplete="username" inputmode="email" required></div>
      <div class="field"><label for="lPw">${t('login.password')}</label>
        <div class="pw"><input class="input" id="lPw" type="password" autocomplete="current-password" required>
          <button type="button" class="icon-btn" id="pwToggle" aria-label="${t('login.show')}" aria-pressed="false">${icon('eye')}</button></div></div>
      <button class="btn primary block" id="lBtn" type="submit">${t('login.submit')}</button>
    </form>
    <p class="muted small" style="margin-top:16px">${t('login.help')}</p>
    <details class="demo"><summary><span class="demo-badge">DEMO</span> ${t('login.demo')}</summary>
      <div class="row"><button type="button" class="btn secondary sm" data-demo="user">${t('login.demoUser')}</button><button type="button" class="btn secondary sm" data-demo="admin">${t('login.demoAdmin')}</button></div></details>
  </div></div>`,{focus:false});
  bindLangSwitch();
  $('pwToggle').onclick=()=>{ const i=$('lPw'), s=i.type==='password'; i.type=s?'text':'password'; $('pwToggle').innerHTML=icon(s?'eyeoff':'eye'); $('pwToggle').setAttribute('aria-pressed',s); $('pwToggle').setAttribute('aria-label',s?t('login.hide'):t('login.show')); };
  document.querySelectorAll('[data-demo]').forEach(b=>b.onclick=()=>{ const a=DEMO_ACCOUNTS[b.dataset.demo]; $('lEmail').value=a.email; $('lPw').value=a.password; $('lBtn').focus(); });
  $('loginForm').onsubmit=async e=>{
    e.preventDefault(); const err=$('loginErr'), btn=$('lBtn');
    const email=$('lEmail').value, pw=$('lPw').value;
    if(!email.trim()||!pw){ err.innerHTML=icon('alert','sm')+`<span>${t('login.fill')}</span>`; err.classList.remove('hidden'); (email.trim()?$('lPw'):$('lEmail')).focus(); return; }
    btn.disabled=true; btn.textContent=t('login.busy');
    try{ const u=await Auth.login(email,pw); enterApp(u); }
    catch(ex){ err.innerHTML=icon('alert','sm')+`<span>${escapeHtml(ex.code==='off'?t('login.off'):t('login.bad'))}</span>`; err.classList.remove('hidden'); btn.disabled=false; btn.textContent=t('login.submit'); $('lPw').select(); }
  };
  setTimeout(()=>$('lEmail').focus(),50);
}
function enterApp(u){
  currentUser=u; UI_ADMIN=u.role==='admin'; progress=u.role==='admin'?null:loadProgress(); session=null;
  const target=pendingRoute; pendingRoute=null;
  const home=u.role==='admin'?'#/admin/korisnici':'#/pocetna';
  const ok=target && target!=='#/prijava' && (u.role==='admin')===target.startsWith('#/admin');
  location.replace(ok?target:home);
  render();
}
async function logout(){
  if(!await confirmDlg({title:t('logout.t'),text:UI_ADMIN?'Želiš li se odjaviti?':t('logout.d'),ok:t('pr.logout')})) return;
  Auth.logout(); currentUser=null; UI_ADMIN=false; progress=null; session=null; location.replace('#/prijava'); render();
}

function customState(){ const c=progress.prefs.custom; return {topics:c.topics||ALL_T(), levels:c.levels||ALL_L(), len:c.len}; }
function saveCustom(topics,levels,len){
  progress.prefs.custom={ topics: topics.length===ALL_T().length?null:topics, levels: levels.length===ALL_L().length?null:levels, len };
  persist();
}

function viewQuiz(){
  if(!session||session.done){ const lost=!session; location.replace('#/vjezba'); if(lost) setTimeout(()=>toast(t('q.interrupted'),'alert'),50); return; }
  shell({chrome:false,title:cfgLabel(session.cfg)});
  mount(`
    <div class="quiz-top">
      <button class="icon-btn" id="quitBtn" aria-label="${t('q.quit')}">${icon('x')}</button>
      <div class="bar" role="progressbar" aria-label="${t('q.bar')}" aria-valuemin="0" aria-valuemax="100" id="qBarWrap"><i id="qBar"></i></div>
      <span class="qt-count" id="qProgress"></span>
      <button class="icon-btn" id="hintBtn" aria-label="${t('q.hint')}">${icon('bulb')}</button>
    </div>
    <div class="card">
      <div class="q-meta"><span class="tag" id="qTopic"></span><span class="score" id="qScore"></span></div>
      <h2 class="qtext" id="qText" tabindex="-1"></h2>
      <div class="qvisual" id="qVisual"></div>
      <div class="choices" id="qChoices"></div>
      <div id="qInput" class="hidden"><label class="sr-only" for="answerInput">${t('q.yourAnswer')}</label><input type="text" id="answerInput" placeholder="${t('q.placeholder')}" autocomplete="off"></div>
      <div id="hintWrap"></div>
      <div id="feedbackWrap" aria-live="polite"></div>
    </div>
    <div class="actionbar">
      <button class="btn secondary hidden" id="revealBtn">${t('q.dontKnow')}</button>
      <button class="btn primary hidden" id="checkBtn">${t('q.check')}</button>
      <button class="btn primary hidden" id="nextBtn">${t('q.next')} ${icon('right','sm')}</button>
    </div>`,{focus:false});
  $('quitBtn').onclick=async()=>{ if(await confirmDlg({title:t('q.quitT'),text:t('q.quitD'),ok:t('q.quitOk')})){ const f=session.from; session=null; go(f); } };
  $('hintBtn').onclick=showHint;
  $('checkBtn').onclick=checkTyped;
  $('revealBtn').onclick=revealTyped;
  $('nextBtn').onclick=nextQuestion;
  $('answerInput').addEventListener('keydown',e=>{ if(e.key==='Enter'&&session&&session.currentQ&&!session.answeredThis&&session.currentQ.mode==='type') checkTyped(); });
  renderQuestion();
}
function renderQuestion(){
  const q=session.queue[session.idx];
  session.currentQ=q; session.answeredThis=false;
  $('qProgress').textContent=`${session.idx+1} / ${session.queue.length}`;
  $('qScore').textContent=t('q.correct',{n:session.correct});
  const pct=Math.round(session.idx/session.queue.length*100);
  $('qBar').style.width=pct+'%'; $('qBarWrap').setAttribute('aria-valuenow',pct);
  $('qTopic').textContent=topicName(q.topic);
  $('qText').textContent=q.q;
  $('qVisual').innerHTML=q.visual||'';
  $('hintWrap').innerHTML=''; $('feedbackWrap').innerHTML='';
  $('nextBtn').classList.add('hidden');
  $('hintBtn').classList.toggle('hidden',!q.hint);
  const mode=q.mode||'mcq', choicesEl=$('qChoices'), inputEl=$('qInput');
  choicesEl.innerHTML='';
  $('checkBtn').classList.add('hidden'); $('revealBtn').classList.add('hidden');
  if(mode==='mcq'){
    inputEl.classList.add('hidden'); choicesEl.classList.remove('hidden');
    const opts=shuffle(q.choices.map((text,i)=>({text,correct:i===0})));
    opts.forEach((o,i)=>{ const b=document.createElement('button'); b.className='choice';
      b.innerHTML=`<span class="mk">${'ABCDE'[i]}</span><span>${o.text}</span>`; b.onclick=()=>answer(b,o.correct,opts); choicesEl.appendChild(b); });
  } else if(mode==='note'){
    choicesEl.classList.add('hidden'); inputEl.classList.add('hidden'); $('hintBtn').classList.add('hidden');
    const s=qStat(q.id); if(s.seen===0){ s.seen++; s.box=5; persist(); }
    $('feedbackWrap').innerHTML=`<div class="notebox">${escapeHtml(q.answer)}</div>`;
    $('nextBtn').classList.remove('hidden');
  } else {
    choicesEl.classList.add('hidden'); inputEl.classList.remove('hidden');
    const ai=$('answerInput'); ai.value=''; ai.disabled=false;
    $('checkBtn').classList.toggle('hidden',mode!=='type');
    $('revealBtn').classList.remove('hidden');
    $('revealBtn').textContent=mode==='open'?t('q.show'):t('q.dontKnow');
    ai.placeholder=mode==='open'?t('q.openPlaceholder'):t('q.placeholder');
    setTimeout(()=>ai.focus(),40);
  }
  if(session.idx>0) $('qText').focus({preventScroll:true});
}
function bookTopic(q,ok){
  if(!session.byTopic[q.topic]) session.byTopic[q.topic]={c:0,t:0};
  session.byTopic[q.topic].t++; if(ok) session.byTopic[q.topic].c++;
}
function requeue(q){
  if(!session.requeued.has(q.id)){ session.requeued.add(q.id);
    session.queue.splice(Math.min(session.queue.length,session.idx+3+(Math.random()*3|0)),0,q); }
}
function recordAnswer(q,ok){
  const s=qStat(q.id); s.seen++; session.answered++; bookTopic(q,ok); markDay();
  if(ok){ s.correct++; s.box=Math.min(s.box+1,5); session.correct++; }
  else { s.wrong++; s.box=1; session.wrongIds.push(q.id); requeue(q); }
  persist(); $('qScore').textContent=t('q.correct',{n:session.correct});
}
function refLine(q){ return q.ref?`<span class="ref">${icon('book','sm')} ${escapeHtml(t('q.ref',{r:q.ref}))}</span>`:''; }
function typedFeedback(ok,q){
  $('feedbackWrap').innerHTML=`<div class="feedback ${ok===true?'ok':ok===false?'bad':''}">
    ${ok===true?`<b>${t('q.right')}</b>`:ok===false?`<b>${t('q.wrong')}</b>`:''}
    <div class="ans"><b>${t('q.answerLabel')}</b> ${escapeHtml(q.answer)}</div>${refLine(q)}</div>`;
}
function finishTyped(){
  ['checkBtn','revealBtn'].forEach(i=>$(i).classList.add('hidden')); $('hintBtn').classList.add('hidden');
  $('answerInput').disabled=true; $('nextBtn').classList.remove('hidden'); $('nextBtn').focus();
}
function checkTyped(){
  if(session.answeredThis) return; session.answeredThis=true;
  const q=session.currentQ, ok=isCorrect($('answerInput').value,q);
  recordAnswer(q,ok); typedFeedback(ok,q); finishTyped();
}
function revealTyped(){
  if(session.answeredThis) return; session.answeredThis=true;
  const q=session.currentQ;
  if(q.mode==='open'){
    typedFeedback(null,q); $('answerInput').disabled=true;
    ['checkBtn','revealBtn'].forEach(i=>$(i).classList.add('hidden')); $('hintBtn').classList.add('hidden');
    const div=document.createElement('div'); div.className='selfrow';
    div.innerHTML=`<button class="btn secondary" id="didntBtn">${icon('x','sm')} ${t('q.didnt')}</button><button class="btn primary" id="knewBtn">${icon('check','sm')} ${t('q.knew')}</button>`;
    $('feedbackWrap').appendChild(div);
    const done=ok=>{ recordAnswer(q,ok); div.remove(); $('nextBtn').classList.remove('hidden'); $('nextBtn').focus(); };
    $('knewBtn').onclick=()=>done(true); $('didntBtn').onclick=()=>done(false);
  } else { recordAnswer(q,false); typedFeedback(false,q); finishTyped(); }
}
function answer(btn,ok,opts){
  if(session.answeredThis) return; session.answeredThis=true;
  const q=session.currentQ, s=qStat(q.id); s.seen++; session.answered++; bookTopic(q,ok); markDay();
  const buttons=[...document.querySelectorAll('#qChoices .choice')]; buttons.forEach(b=>b.disabled=true); $('hintBtn').classList.add('hidden');
  if(ok){ btn.classList.add('correct'); s.correct++; s.box=Math.min(s.box+1,5); session.correct++; }
  else { btn.classList.add('wrong'); s.wrong++; s.box=1; session.wrongIds.push(q.id);
    buttons.forEach((b,i)=>{ if(opts[i].correct) b.classList.add('correct'); }); requeue(q); }
  persist();
  $('feedbackWrap').innerHTML=`<div class="feedback ${ok?'ok':'bad'}">${ok?`<b>${t('q.right')}</b>`:`<b>${t('q.wrong')}</b> ${t('q.wrongAns')} <b>${q.choices[0]}</b>`}${refLine(q)}</div>`;
  $('qScore').textContent=t('q.correct',{n:session.correct});
  $('nextBtn').classList.remove('hidden'); $('nextBtn').focus({preventScroll:true});
}
function nextQuestion(){ session.idx++; if(session.idx>=session.queue.length){ session.done=true; go('#/rezultat'); } else { renderQuestion(); window.scrollTo(0,0); } }
function showHint(){ const q=session.currentQ; if(q.hint) $('hintWrap').innerHTML=`<div class="hintbox">${escapeHtml(q.hint)}</div>`; }

function filteredUsers(){

    &&(adm.role==='all'||u.role===adm.role)&&(adm.status==='all'||(adm.status==='on')===u.active))

function drawUsers(){

      <td data-label="Zadnja prijava" class="num" title="${fmtTime(u.lastLogin)}">${relTime(u.lastLogin)}</td>

        <button class="btn danger-ghost sm" data-act="del" aria-label="Obriši ${escapeHtml(u.email)}">${icon('trash','sm')}</button>`}</div></td></tr>`;}).join('')}</tbody>`;

  t.querySelectorAll('[data-sel]').forEach(c=>c.onchange=()=>{ c.checked?adm.sel.add(c.dataset.sel):adm.sel.delete(c.dataset.sel); drawUsers(); });

}
function canDisable(u){ return !(u.role==='admin'&&u.active&&Auth.activeAdmins().length<=1); }
function bulkActive(on){
  let n=0, skipped=0;
  adm.sel.forEach(id=>{ const u=Auth.users().find(x=>x.id===id); if(!u||u.id===currentUser.id) return; if(!on&&!canDisable(u)){skipped++;return;} if(u.active!==on){ Auth.update(id,x=>x.active=on); n++; } });
  adm.sel.clear(); drawUsers();
  toast(`${on?'Aktivirano':'Deaktivirano'}: ${n}${skipped?` · preskočeno ${skipped} (zadnji administrator)`:''}`);
}
async function userAction(id,act){
  const u=Auth.users().find(x=>x.id===id); if(!u) return;
  if(act==='pw') return pwDialog(u);
  if(act==='toggle'){
    if(u.active&&!canDisable(u)){ toast('Ne možeš deaktivirati zadnjeg administratora.','alert'); return; }
    Auth.update(id,x=>x.active=!x.active); drawUsers(); toast(u.active?`${u.email} je deaktiviran.`:`${u.email} je aktiviran.`); return;
  }
  if(act==='del'){
    if(!canDisable(u)){ toast('Ne možeš obrisati zadnjeg administratora.','alert'); return; }

    Auth.remove(id); adm.sel.delete(id); drawUsers(); toast('Korisnik je obrisan.');
  }
}

      <div class="alert hidden" id="nuErr" role="alert"></div>
      <div class="field"><label for="nuEmail">E-mail *</label><input class="input" id="nuEmail" type="email" autocomplete="off" required></div>
      <div class="field"><label for="nuName">Ime i prezime</label><input class="input" id="nuName" type="text" autocomplete="off"><small>Neobavezno. Prikazuje se u popisu i pozdravu.</small></div>
      <div class="field"><label for="nuPw">Lozinka *</label>
        <div class="pw"><input class="input" id="nuPw" type="text" autocomplete="new-password" value="${genPassword()}" required>
          <button type="button" class="icon-btn" id="nuGen" aria-label="Generiraj novu lozinku" title="Generiraj novu">${icon('refresh','sm')}</button></div>
        <small>Najmanje 8 znakova. Predložena je sigurna lozinka.</small></div>
      <div class="field"><label for="nuRole">Uloga</label><select class="input" id="nuRole"><option value="user">Učenik</option><option value="admin">Administrator</option></select></div>
    </form>`,
    foot:`<button class="btn secondary" data-close>Odustani</button><button class="btn primary" id="nuSave">Kreiraj korisnika</button>`,
    onMount:()=>{
      $('nuEmail').focus();
      $('nuGen').onclick=()=>{ $('nuPw').value=genPassword(); };
      const save=async e=>{ if(e) e.preventDefault(); const btn=$('nuSave'); btn.disabled=true;
        try{
          const pw=$('nuPw').value, u=await Auth.createUser({email:$('nuEmail').value,password:pw,name:$('nuName').value,role:$('nuRole').value},currentUser.id);
          const c=credsBlock(u.email,pw);
          dialog({title:'Korisnik je kreiran',body:`<div class="alert ok">${icon('ok','sm')}<span>${escapeHtml(u.email)} može se prijaviti.</span></div>${c.html}`,
            foot:`<button class="btn secondary" id="nuMore">${icon('plus','sm')} Dodaj još jednog</button><button class="btn primary" id="nuCopy">${icon('copy','sm')} Kopiraj poruku</button>`,
            onMount:()=>{ $('nuCopy').onclick=()=>copyText(c.msg); $('nuMore').onclick=()=>userDialog(); }});
          drawUsers();
        }catch(ex){ $('nuErr').innerHTML=icon('alert','sm')+`<span>${escapeHtml(ex.message)}</span>`; $('nuErr').classList.remove('hidden'); btn.disabled=false;
          (/e-mail/i.test(ex.message)?$('nuEmail'):$('nuPw')).focus(); }
      };
      $('nuSave').onclick=save; $('nuForm').onsubmit=save;
    }});
}
function pwDialog(u){
  dialog({title:'Nova lozinka',
    body:`<p style="margin:0 0 14px">Za <b>${escapeHtml(u.email)}</b>. Stara lozinka prestaje vrijediti.</p>
      <div class="alert hidden" id="pwErr" role="alert"></div>
      <div class="field"><label for="pwNew">Nova lozinka</label><div class="pw"><input class="input" id="pwNew" type="text" value="${genPassword()}" autocomplete="new-password">
        <button type="button" class="icon-btn" id="pwGen" aria-label="Generiraj novu lozinku">${icon('refresh','sm')}</button></div></div>`,
    foot:`<button class="btn secondary" data-close>Odustani</button><button class="btn primary" id="pwSave">Spremi lozinku</button>`,
    onMount:()=>{
      $('pwGen').onclick=()=>{ $('pwNew').value=genPassword(); };
      $('pwSave').onclick=async()=>{ const pw=$('pwNew').value;
        try{ await Auth.setPassword(u.id,pw); const c=credsBlock(u.email,pw);
          dialog({title:'Lozinka je promijenjena',body:c.html,foot:`<button class="btn secondary" data-close>Zatvori</button><button class="btn primary" id="pwCopy">${icon('copy','sm')} Kopiraj poruku</button>`,
            onMount:()=>{ $('pwCopy').onclick=()=>copyText(c.msg); }});
        }catch(ex){ $('pwErr').innerHTML=icon('alert','sm')+`<span>${escapeHtml(ex.message)}</span>`; $('pwErr').classList.remove('hidden'); } };
    }});
}

/* ==================== ADMIN: PRIJAVE ==================== */
function viewAdminLogins(){
  shell({title:'Prijave',nav:'admin/prijave',wide:true});
  mount(`
    <div class="page-head"><div><h2 class="h-l">Povijest prijava</h2><p class="muted small" style="margin:4px 0 0" id="lCount"></p></div></div>
    <div class="filters">
      <div class="search">${icon('search','sm')}<label class="sr-only" for="lQ">Korisnik</label><input class="input" id="lQ" type="search" placeholder="Traži po e-mailu" value="${escapeHtml(adm.lq)}"></div>
      <label class="sr-only" for="lSt">Status</label><select class="input" id="lSt"><option value="all">Sve prijave</option><option value="ok">Uspješne</option><option value="fail">Neuspješne</option></select>
      <label class="sr-only" for="lPer">Razdoblje</label><select class="input" id="lPer"><option value="1">Danas</option><option value="7">Zadnjih 7 dana</option><option value="30">Zadnjih 30 dana</option><option value="all">Sve</option></select>
    </div>
    <div class="table-wrap"><table class="tbl no-cb" id="lTbl"></table></div>
    <div style="text-align:center;margin-top:12px"><button class="btn ghost hidden" id="lMore">Učitaj još</button></div>`);
  $('lSt').value=adm.lstatus; $('lPer').value=adm.lperiod;
  $('lQ').oninput=e=>{ adm.lq=e.target.value; adm.llimit=50; drawLogins(); };
  $('lSt').onchange=e=>{ adm.lstatus=e.target.value; adm.llimit=50; drawLogins(); };
  $('lPer').onchange=e=>{ adm.lperiod=e.target.value; adm.llimit=50; drawLogins(); };
  $('lMore').onclick=()=>{ adm.llimit+=50; drawLogins(); };
  drawLogins();
}
function drawLogins(){
  const q=adm.lq.trim().toLowerCase(), now=new Date(); now.setHours(0,0,0,0);
  const from=adm.lperiod==='all'?0:now.getTime()-(+adm.lperiod-1)*864e5;
  const users=Auth.users();
  const rows=Auth.logs().filter(l=>l.at>=from&&(!q||(l.email||'').includes(q))&&(adm.lstatus==='all'||(adm.lstatus==='ok')===!!l.ok));
  const okN=rows.filter(l=>l.ok).length;
  $('lCount').textContent=`${rows.length} ${plural(rows.length,'prijava','prijave','prijava')} · ${okN} uspješnih · ${rows.length-okN} neuspješnih`;
  const t=$('lTbl');
  if(!rows.length){ t.innerHTML=`<tbody><tr><td><div class="empty">${icon('history')}<div>Nema prijava za taj filter.</div></div></td></tr></tbody>`; $('lMore').classList.add('hidden'); return; }
  t.innerHTML=`<thead><tr><th>Vrijeme</th><th>Korisnik</th><th>Status</th><th>Napomena</th></tr></thead><tbody>${rows.slice(0,adm.llimit).map(l=>{
    const u=users.find(x=>x.id===l.userId); return `<tr>
      <td class="main num">${fmtTime(l.at)}</td>
      <td data-label="Korisnik"><div class="u-name">${escapeHtml(u&&u.name?u.name:(l.email||'—'))}</div>${u&&u.name?`<div class="u-mail">${escapeHtml(l.email)}</div>`:''}</td>
      <td data-label="Status">${l.ok?`<span class="badge ok">${icon('check')}Uspješna</span>`:`<span class="badge bad">${icon('x')}Neuspješna</span>`}</td>
      <td data-label="Napomena" class="muted">${escapeHtml(l.reason||'')}</td></tr>`;}).join('')}</tbody>`;
  $('lMore').classList.toggle('hidden',rows.length<=adm.llimit);
}

/* ---------- start ---------- */
(async function boot(){
  await Auth.seed();
  const u=Auth.current();
  if(u){ currentUser=u; UI_ADMIN=u.role==='admin'; progress=u.role==='admin'?null:loadProgress(); }
  render();
})();

</script>
