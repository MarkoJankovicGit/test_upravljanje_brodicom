t = green.","ref":"p. 55 — lateral marks, Region A"},"ozn3":{"q":"What colour is the LATERAL mark on the RIGHT side of the fairway (Region A)?","choices":["Green","Red","Yellow","White"],"hint":"The opposite of the left one (red).","ref":"p. 55 — lateral marks, Region A"},"ozn4":{"q":"What do CARDINAL marks indicate?","choices":["On which side (N/E/S/W) of the danger the safe water lies","The edge of a harbour","An anchoring prohibition","A berthing place"],"hint":"They are placed around dangers according to the points of the compass.","ref":"p. 55 — cardinal marks"},"ozn5":{"q":"How many cardinal marks are there?","choices":["Four (N, E, S, W)","Two","Eight","Six"],"hint":"According to the four main points of the compass.","ref":"p. 55 — cardinal marks"},"ozn6":{"q":"What colours are cardinal marks?","choices":["Yellow-black","Red-green","Red-white","Blue-white"],"hint":"A combination of yellow and black, depending on the side.","ref":"p. 55 — cardinal marks (colour annex)"},"ozn7":{"q":"What does the topmark of the NORTH cardinal mark look like?","choices":["Two black cones with their points UP","Two cones pointing down","Two spheres","A cross"],"hint":"North = arrows pointing up (towards north).","ref":"p. 55 — cardinal marks"},"ozn8":{"q":"What topmark does the SOUTH cardinal mark have?","choices":["Two cones with their points DOWN","Two cones pointing up","Two cones joined at their bases","One sphere"],"hint":"The opposite of the north one.","ref":"p. 55 — cardinal marks"},"ozn9":{"q":"What do SPECIAL marks (yellow, with an 'X' cross as the topmark) indicate?","choices":["A special area (e.g. cables, military exercises, zones)","Safe water","An isolated danger","The main channel"],"hint":"Always yellow in colour.","ref":"p. 55 — special marks"},"ozn10":{"q":"What do lateral marks show?","choices":["The edges of the fairway / main channel","The depth of the sea","The wind direction","A prohibited anchorage"],"hint":"They are followed by the colour of the left and right side.","ref":"p. 55 — lateral marks"},"opr1":{"q":"Which regulation specifies the mandatory equipment of a boat?","choices":["The Boat Ordinance (Pravilnik o brodicama, NN 13/2020)","The MARPOL Convention","The SOLAS Convention","The Roads Act"],"hint":"The equipment is listed by navigation area (IV to I).","ref":"p. 27 — mandatory equipment"},"opr2":{"q":"For whom must there be a life jacket on the boat?","choices":["For all persons on the boat (adults and children)","Only for the operator","Only for children","For half of the passengers"],"hint":"While under way, without exception.","ref":"p. 27 — life-saving equipment"},"opr3":{"q":"How many mooring lines must a boat carry at minimum, and of what minimum length?","choices":["At least 3, not shorter than 5 m","At least 1, of any length","At least 2, 10 m each","At least 5, 3 m each"],"hint":"The length corresponds to the boat's length, but not less than 5 m.","ref":"pp. 27 and 29 — mooring lines"},"opr4":{"q":"How long must the tow rope (tegalj) be?","choices":["Four boat lengths","One boat length","5 metres","Two boat lengths"],"hint":"Considerably longer than the mooring line.","ref":"p. 27 — tow rope"},"opr5":{"q":"What proves competence to operate a boat?","choices":["The certificate of competence for a boat operator","An identity card","The navigation permit (plovidbena dozvola)","A marina confirmation"],"hint":"Categories A, B or C.","ref":"p. 47 — boat crew"},"opr6":{"q":"What is the minimum age for a category B boat operator?","choices":["16 years","15 years","18 years","14 years"],"hint":"Category A requires one year less.","ref":"p. 2 — certificates"},"opr7":{"q":"What is the minimum age for a category A boat operator?","choices":["15 years","16 years","18 years","12 years"],"hint":"The lowest age limit of the three categories.","ref":"p. 2 — certificates"},"opr8":{"q":"What is the minimum age for a category C boat operator?","choices":["18 years","16 years","15 years","21 years"],"hint":"It also requires health conditions (vision, hearing) and longer training.","ref":"p. 2 — certificates"},"opr9":{"q":"Up to what length and power may a category A operator handle a boat?","choices":["Up to 7 m and up to 15 kW","Up to 12 m and up to 30 kW","Up to 5 m and up to 5 kW","No restrictions"],"hint":"Navigation areas IIIa, IIIb, IIIc and IV.","ref":"p. 2 — category A authorisations"},"opr10":{"q":"Who may operate a boat with a propulsion power GREATER than 15 kW?","choices":["A person aged 18 or over holding a category B certificate","Anyone with category A","A person older than 16","A person with category C"],"hint":"An age of 18 is also required.","ref":"p. 3 — power > 15 kW"},"opr11":{"q":"From what age may one operate a ROWING boat (for personal use)?","choices":["Older than 12 years","Older than 16 years","Older than 18 years","No restrictions"],"hint":"No certificate, only an age limit.","ref":"p. 47 — rowing boat"},"opr12":{"q":"How many nautical miles from the coast does navigation area IIIa extend?","choices":["6 NM","3 NM","1 NM","12 NM"],"hint":"IIIa = 6, IIIb = 3, IIIc = 1.","ref":"p. 3 — navigation areas"},"opr13":{"q":"How many nautical miles from the coast does navigation area IIIc extend?","choices":["1 NM","3 NM","6 NM","0.5 NM"],"hint":"The narrowest of the three sub-areas of III.","ref":"p. 3 — navigation areas"},"opr14":{"q":"Where is the permitted number of persons and cargo on a boat recorded?","choices":["In the boat's Navigation Permit (Dozvola za plovidbu)","In the operator's certificate","On the boat's hull","In the pilot book"],"hint":"The skipper may only embark as many as stated there.","ref":"p. 23 — stability and loading"},"opr15":{"q":"What must be submitted when registering for the boat operator exam?","choices":["2 photographs 3×2.5 cm, ID card/passport and proof of payment","Only an ID card","A medical certificate","A driving licence"],"hint":"Plus a completed application form.","ref":"p. 2 — exam registration"},"vje1":{"q":"From which direction does the TRAMONTANA blow?","choices":["From the north (N)","From the south (S)","From the east (E)","From the west (W)"],"hint":"Also called the northerly (sjevernjak).","ref":"p. 13 — Tramontana (N)"},"vje2":{"q":"From which direction does the BORA blow?","choices":["Northeast (NE)","Southeast (SE)","West (W)","South (S)"],"hint":"Cold air spills over the mountains towards the sea.","ref":"p. 16 — Bora (NE)"},"vje3":{"q":"What is the main characteristic of the Bora?","choices":["Sudden, cold, dry, with strong gusts (refuli)","Warm and humid, steady","Weak and long-lasting","Always with rain"],"hint":"It arrives suddenly and immediately at full strength.","ref":"p. 16 — Bora"},"vje4":{"q":"At what speed can a hurricane-force Bora blow?","choices":["Even over 200 km/h","Up to 50 km/h","About 100 km/h","Up to 30 km/h"],"hint":"That is when it is called hurricane-force.","ref":"p. 16 — Bora"},"vje5":{"q":"When is the Bora usually STRONGEST?","choices":["At the very beginning","After 24 hours","Towards the end","Always the same"],"hint":"Because of the sudden spilling of air over the mountains.","ref":"p. 16 — Bora"},"vje6":{"q":"Which two types of Bora do we distinguish?","choices":["Anticyclonic (clear) and cyclonic (dark/overcast)","Warm and cold","Summer and winter","Sea and land"],"hint":"The cyclonic one is more humid ('rotten Bora') and brings rain.","ref":"p. 16 — types of Bora"},"vje7":{"q":"Which wind blows from the land to the sea at night (in summer)?","choices":["Burin","Maestral (Mistral)","Jugo (Sirocco)","Levant"],"hint":"It occurs because the land cools faster than the sea at night.","ref":"p. 17 — Burin (N)"},"vje8":{"q":"From which direction does the JUGO (Široko, Sirocco) blow?","choices":["Southeast (SE)","Northeast (NE)","West (W)","North (N)"],"hint":"It blows from Otranto along the entire Adriatic.","ref":"p. 17 — Jugo/Široko (SE)"},"vje9":{"q":"What weather and waves does the Jugo bring?","choices":["Warm, humid; long and high waves","Cold and dry; short waves","Clear, without waves","Snow"],"hint":"It develops gradually (strengthening over three days).","ref":"p. 17 — Jugo"},"vje10":{"q":"Which wind creates the highest waves in the Adriatic (up to 5 m)?","choices":["Jugo (Sirocco)","Bora","Maestral (Mistral)","Tramontana"],"hint":"It has open space and a constant, steady flow.","ref":"p. 17 — Jugo, waves up to 5 m"},"vje11":{"q":"From which direction does the LEBIĆ (Garbin) blow?","choices":["Southwest (SW)","Northwest (NW)","East (E)","South (S)"],"hint":"It introduces us to the realm of squalls and storms.","ref":"p. 17 — Lebić/Garbin (SW)"},"vje12":{"q":"How strong can the Lebić be?","choices":["Gale/hurricane force, up to 12 Bf (68 kn)","At most 5 Bf","Up to 3 Bf","Always weak"],"hint":"With precipitation and strong, often cross-running waves.","ref":"p. 17 — Lebić"},"vje13":{"q":"From which direction does the PULENAT (Ponente) blow?","choices":["West (W)","East (E)","North (N)","South (S)"],"hint":"Also called the westerly; it raises large cross waves.","ref":"p. 17 — Pulenat (W)"},"vje14":{"q":"What is a nevera?","choices":["A local storm: sudden pressure drop and violent wind with a downpour","A long-lasting warm wind","A type of fog","A sea current"],"hint":"More frequent in summer; short-lived but dangerous.","ref":"p. 17–18 — Nevera (SW-NW)"},"vje15":{"q":"Which cloud heralds a nevera on the western horizon?","choices":["A dark mushroom/anvil-shaped cloud (cumulonimbus)","A white fluffy cumulus","A high cirrus","Fog"],"hint":"It is accompanied by lightning and thunder.","ref":"p. 18 — warning sign of a nevera"},"vje16":{"q":"How long does a nevera usually last?","choices":["From half an hour to an hour and a half","The whole day","3–7 days","A few minutes"],"hint":"It roars through and usually the sun comes out behind it.","ref":"p. 18 — duration of a nevera"},"vje17":{"q":"What is a waterspout (tromba, surlada)?","choices":["A miniature tornado over the sea","A strong sea current","A type of wave","A cloud of fog"],"hint":"Seen as a slanted, upright thin tube that moves.","ref":"p. 18 — Waterspout"},"vje18":{"q":"From which direction does the MAESTRAL (Mistral) blow?","choices":["Northwest (NW)","Southeast (SE)","East (E)","South (S)"],"hint":"The sailors' favourite wind.","ref":"p. 18 — Maestral (NW)"},"vje19":{"q":"What kind of wind is the Maestral?","choices":["A fair-weather wind that refreshes","A dangerous storm wind","A cold winter wind","A wind that brings rain"],"hint":"When it fails to appear in summer in fine weather — a sign of imminent deterioration.","ref":"p. 18 — Maestral"},"vje20":{"q":"When does the Maestral usually start to blow?","choices":["After the sun has warmed the air, after 10 o'clock","At dawn","At night","Always at the same time, at midnight"],"hint":"Several hours of warming from early morning are needed.","ref":"p. 18 — Maestral"},"vje21":{"q":"Which is the MOST DANGEROUS wind for navigation in the Adriatic?","choices":["Bora","Maestral (Mistral)","Burin","Tramontana"],"hint":"Because of its sudden arrival and strong gusts.","ref":"p. 17 — Bora is the most dangerous"},"vje22":{"q":"Which cloud is a sign of fair, good weather?","choices":["Cu (cumulus) — white, fluffy like raw cotton","Cb (cumulonimbus)","Ci (cirrus)","Ns (nimbostratus)"],"hint":"They drift lazily over the land or islands.","ref":"p. 16 — Cu clouds"},"vje23":{"q":"What weather does an anticyclone bring?","choices":["Dry and sunny","Cloudy and rainy","Fog","Snow and ice"],"hint":"Highest pressure at the centre (about 1020 hPa).","ref":"p. 15 — anticyclone"},"vje24":{"q":"What weather does a cyclone (depression) bring?","choices":["Cloudy and rainy","Dry and sunny","Clear and calm","Always Bora"],"hint":"Lowest pressure at the centre (about 980 hPa).","ref":"p. 14–15 — cyclone"},"vje25":{"q":"Which are the FOUR cardinal (main) directions and their abbreviations?","choices":["North N, east E, south S, west W","N, S, E only","Up, down, left, right","NE, SE, SW, NW"],"hint":"Between them are the intercardinal ones: NE, SE, SW, NW.","ref":"p. 13 — points of the compass"},"zvu1":{"q":"What does ONE short sound signal mean?","choices":["Altering course to starboard","Altering course to port","Going astern","Danger"],"hint":"One = right.","ref":"p. 39 — sound signals"},"zvu2":{"q":"What do TWO short sound signals mean?","choices":["Altering course to port","Altering course to starboard","Going astern","Overtaking"],"hint":"Two = left.","ref":"p. 39 — sound signals"},"zvu3":{"q":"What do THREE short sound signals mean?","choices":["Going astern (backwards)","Turning to starboard","Turning to port","Stopping"],"hint":"Three = I am going astern.","ref":"p. 39 — sound signals"},"zvu4":{"q":"What do FIVE or more short sound signals mean?","choices":["Warning — the intentions of the other vessel are not understood","A call for help","Turning to starboard","Anchoring"],"hint":"A signal of doubt/warning.","ref":"p. 39 — sound signals"},"zvu5":{"q":"Which signal does a vessel give when approaching a headland or bend and cannot see the other side?","choices":["One prolonged blast","One short blast","Three short blasts","Five short blasts"],"hint":"A vessel on the other side answers with the same — one prolonged blast.","ref":"p. 39 — signal at a headland"},"zvu6":{"q":"How does a vessel in a narrow channel ask for permission to overtake on the STARBOARD side?","choices":["Two prolonged and one short","Two prolonged and two short","One prolonged","Three short"],"hint":"Two prolonged + one short = starboard.","ref":"p. 40 — overtaking"},"zvu7":{"q":"How does a vessel ask for permission to overtake on the PORT side?","choices":["Two prolonged and two short","Two prolonged and one short","One prolonged and one short","Five short"],"hint":"Two prolonged + two short = port.","ref":"p. 40 — overtaking"},"zvu8":{"q":"How does the vessel ahead AGREE to being overtaken?","choices":["One prolonged, one short, one prolonged, one short","Five short","Three prolonged","One prolonged"],"hint":"If there is no reply — overtaking is not permitted.","ref":"p. 40 — reply to overtaking signal"},"zvu9":{"q":"At what intervals do vessels sound their horn in fog?","choices":["Every 2 minutes","Every 30 seconds","Every 1 minute","Every 5 minutes"],"hint":"Anchored and grounded vessels sound more often (every 1 min, with a bell).","ref":"p. 40 — fog signals"},"zvu10":{"q":"How does a power-driven vessel underway sound in fog?","choices":["One prolonged blast","Two prolonged blasts","One prolonged and two short","Four short"],"hint":"The simplest signal — one prolonged.","ref":"p. 40 — fog, vessel underway"},"zvu11":{"q":"How does a vessel that is underway but NOT making way through the water sound in fog?","choices":["Two prolonged blasts","One prolonged blast","Three short","One prolonged and two short"],"hint":"One prolonged blast more than a vessel making way.","ref":"p. 40 — fog"},"zvu12":{"q":"Which signal is sounded in fog by a sailing vessel, a fishing vessel, a tug or a vessel not under command?","choices":["One prolonged followed by two short","One prolonged","Two prolonged","Four short"],"hint":"Prolonged + two short — the same group of 'special' vessels.","ref":"p. 40 — fog, special vessels"},"zvu13":{"q":"How does an ANCHORED vessel sound in fog?","choices":["Rapid ringing of the bell on the bow for 5 seconds","One prolonged blast","The horn every 2 min","Three short signals"],"hint":"With the bell, every one minute.","ref":"p. 40 — anchored vessel in fog"},"zvu14":{"q":"How does the signal of a GROUNDED vessel differ from that of an anchored one?","choices":["Before and after the rapid bell ringing it gives three separate strokes on the bell","It does not differ","It uses the horn","It gives five short"],"hint":"Same as anchored + three strokes before and after.","ref":"p. 40 — grounded vessel"},"zvu15":{"q":"Which vessel sounds FOUR short blasts in fog?","choices":["A pilot vessel on duty","A fishing boat","A tug","An anchored vessel"],"hint":"A specific signal only for that service.","ref":"p. 40 — pilot vessel"},"zvu16":{"q":"From what vessel length is a gong (in addition to the bell) mandatory for fog signals?","choices":["Longer than 100 metres","Longer than 50 metres","Longer than 20 metres","Every vessel"],"hint":"The gong is sounded aft, immediately after the bell forward.","ref":"p. 40 — gong over 100 m"},"sud1":{"q":"As a rule, who has right of way — a large or a small vessel?","choices":["The large vessel","The small vessel","Always the one on the right","Nobody"],"hint":"Smaller vessels must keep clear of larger ones.","ref":"p. 38 — collision avoidance"},"sud2":{"q":"When two boats approach each other HEAD-ON (on the same line), how do they act?","choices":["Each decisively alters course to starboard by about ten degrees","Each turns to port","They stop","The first continues, the second turns"],"hint":"The manoeuvre must be decisive and made in good time.","ref":"p. 38 — position (meeting)"},"sud3":{"q":"When the courses of two boats CROSS, which has right of way?","choices":["The one approaching from the STARBOARD side","The one approaching from the port side","The faster boat","The larger boat"],"hint":"The starboard-side rule.","ref":"p. 38 — crossing courses"},"sud4":{"q":"How does a boat that does NOT have right of way act when crossing?","choices":["Passes astern of the other boat","Passes ahead of its bow","Stops on the spot","Turns to port in front of it"],"hint":"You pass behind, not in front.","ref":"p. 38 — crossing courses"},"sud5":{"q":"What must a boat that HAS right of way do when crossing?","choices":["Maintain the same course and speed","Speed up","Turn to starboard","Stop"],"hint":"So that the other can predict it and pass clear.","ref":"p. 38 — stand-on vessel"},"sud6":{"q":"Who has right of way — a motor boat or a sailing boat under sail?","choices":["The sailing boat","The motor boat","Whoever is faster","Always the motor boat"],"hint":"A sailing boat has less manoeuvrability.","ref":"p. 38 — sailing boat has right of way"},"sud7":{"q":"Who has right of way — a sailing boat or a fishing vessel while fishing?","choices":["The fishing vessel","The sailing boat","The one on the right","Depends on the wind"],"hint":"A vessel engaged in fishing is restricted in manoeuvrability.","ref":"p. 38 — fishing vessel ahead of sailing boat"},"sud8":{"q":"Which vessels have right of way OVER sailing boats and other 'free' vessels?","choices":["Fishing vessels, vessels not under command, tugs, vessels restricted in manoeuvrability or by draught","Only large passenger ships","Only faster vessels","Nobody in particular"],"hint":"All vessels with a limiting manoeuvring problem.","ref":"p. 38 — vessels with right of way"},"sud9":{"q":"Two sailing boats have the wind on the same (port) side. Which has right of way?","choices":["The one to leeward","The one to windward","The one on the starboard side","The larger sailing boat"],"hint":"Leeward = the side sheltered from the wind.","ref":"p. 38 — sailing boats, same tack"},"sud10":{"q":"When three boats of equal status meet and their courses intersect, which rule applies?","choices":["The starboard-side rule","The higher-speed rule","Priority to the largest","Priority to the first to arrive"],"hint":"A passes astern of B, B passes astern of C.","ref":"p. 38 — three boats"},"sud11":{"q":"Who has right of way at a harbour entrance/exit?","choices":["The one LEAVING the harbour","The one entering","The smaller boat","The sailing boat"],"hint":"Once it leaves, space is freed up.","ref":"p. 46 — order in harbours"},"sud12":{"q":"Which vessel enters a harbour first — the larger or the smaller?","choices":["The larger vessel enters first, the small one waits","The smaller always first","The one on the right","There is no rule"],"hint":"The smaller is more agile and needs less space.","ref":"p. 46 — order in harbours"},"sud13":{"q":"May one insist on one's right of way at all costs?","choices":["No — sometimes a compromise solution is necessary","Yes, always","Yes, if you are larger","Only at night"],"hint":"The goal is to avoid a collision, not to 'win'.","ref":"p. 38 — compromise"},"svl1":{"q":"What colour is the sidelight on the STARBOARD side of a vessel?","choices":["Green","Red","White","Yellow"],"hint":"Starboard = green.","ref":"p. 53 — sidelights"},"svl2":{"q":"What colour is the sidelight on the PORT side of a vessel?","choices":["Red","Green","White","Blue"],"hint":"Port = red.","ref":"p. 53 — sidelights"},"svl3":{"q":"What colour is the sternlight?","choices":["White","Red","Green","Yellow"],"hint":"On the stern side, white.","ref":"p. 53 — sternlight"},"svl4":{"q":"Which light does an ANCHORED vessel show?","choices":["A white all-round light (visible from all sides)","A red all-round light","A green all-round light","Two red"],"hint":"Visible from bow, both sides and stern — white.","ref":"p. 53–54 — anchored vessel"},"svl5":{"q":"When must vessel lights be shown?","choices":["From sunset to sunrise (and by day in restricted visibility)","Only in fog","Only in harbour","All day"],"hint":"Night + reduced visibility.","ref":"p. 53 — when to show lights"},"svl6":{"q":"What lights does a TRAWLER (koča) fishing vessel show?","choices":["Green over white","Red over white","White over red","Two red"],"hint":"Green is on top.","ref":"p. 53 — Trawler (Koča)"},"svl7":{"q":"What lights does a PURSE SEINER (plivarica) fishing vessel show?","choices":["Red over white","Green over white","White over red","Flashing yellow"],"hint":"Red is on top (the reverse of the trawler).","ref":"p. 53 — Purse seiner (Plivarica)"},"svl8":{"q":"What lights does a PILOT vessel show?","choices":["White over red","Red over white","Green over white","Two white"],"hint":"White on top, red below.","ref":"p. 53 — Pilot"},"svl9":{"q":"What light does a vessel on an AIR CUSHION show?","choices":["Yellow flashing light","Purple","Two green","Red all-round"],"hint":"In addition to the usual sidelights and masthead light.","ref":"p. 54 — air-cushion vessel"},"svl10":{"q":"What lights does a vessel RESTRICTED in her ability to manoeuvre show?","choices":["Red-white-red (vertical)","Three red lights vertically","Two red lights vertically","Green-white-green"],"hint":"The middle one is white.","ref":"p. 54 — vessel restricted in ability to manoeuvre"},"svl11":{"q":"What lights does a vessel CONSTRAINED BY HER DRAUGHT show?","choices":["Three red lights vertically","Red-white-red","Two red lights vertically","Three green"],"hint":"All three are the same colour — red.","ref":"p. 54 — vessel constrained by her draught"},"svl12":{"q":"What lights does a vessel NOT UNDER COMMAND (broken down, unable to manoeuvre) show?","choices":["Two red lights vertically","Three red lights vertically","Red-white-red","Two green"],"hint":"Two red lights one above the other.","ref":"p. 54 — vessel not under command"},"svl13":{"q":"What light does a boat up to 7 m (not planing) show?","choices":["White all-round light","Red and green","Three white","Flashing yellow"],"hint":"The simplest case — a single white light.","ref":"p. 53 — boat up to 7 m"},"svl14":{"q":"What lights does a planing boat up to 7 m show?","choices":["Sidelights: green (starboard) and red (port)","White only","Three red","Flashing yellow"],"hint":"Unlike an ordinary boat up to 7 m, it has sidelights.","ref":"p. 53 — planing boat up to 7 m"},"svl15":{"q":"How do the lights of a sailing boat (under sail) differ from those of a motor boat?","choices":["No masthead (white) light — only sidelights and sternlight","It has an additional yellow light","It has three white lights","It shows no lights at all"],"hint":"Red/green sidelights + white sternlight, without the white masthead light.","ref":"p. 53 — sailing boat under sail"},"rad1":{"q":"What does the abbreviation VHF stand for?","choices":["Very High Frequency","Vessel Handling Frequency","Variable Hz Filter","Volt-Hertz-Frequency"],"hint":"It operates in the two-metre radio wave band.","ref":"p. 42 — VHF"},"rad2":{"q":"What is the CALLING channel on VHF?","choices":["Channel 16","Channel 70","Channel 6","Channel 88"],"hint":"It is switched on automatically when the set is turned on.","ref":"p. 41 — calling channel 16"},"rad3":{"q":"What is the frequency of channel 16?","choices":["156.8 MHz","2182 kHz","500 kHz","121.5 MHz"],"hint":"Within the VHF band of 156–163 MHz.","ref":"p. 41 — frequency of channel 16"},"rad4":{"q":"What is channel 16 used for?","choices":["Calling, establishing contact and urgent announcements","Only for boat-to-boat conversation","Listening to music","Weather forecasts"],"hint":"It is used briefly, then you switch to another working channel.","ref":"p. 41 — purpose of channel 16"},"rad5":{"q":"Which channels are intended for boat-to-boat conversation?","choices":["70 to 75","1 to 5","16 to 20","28 to 60"],"hint":"After contact is established on 16, you switch to these.","ref":"p. 41 — boat-to-boat channels"},"rad6":{"q":"Which channel is switched on automatically when we turn on the ship's radio station (BRP)?","choices":["Channel 16","Channel 70","Channel 6","Channel 1"],"hint":"Always the calling channel.","ref":"p. 42 — automatic switch-on of channel 16"},"rad7":{"q":"What does the word 'prijam' (over) at the end of a sentence mean?","choices":["Now it is the other party's turn to speak","End of communication","Everything understood","Repeat the message"],"hint":"With simplex communication you cannot listen and talk at the same time.","ref":"p. 42 — 'prijam'/'over'"},"rad8":{"q":"What does 'gotovo' (out) mean at the end of a communication?","choices":["End of communication","Repeat","Everything understood","Wait"],"hint":"Right at the very end, with a farewell.","ref":"p. 42 — end of communication"},"rad9":{"q":"What does the international word 'rođer' (roger) mean?","choices":["I have understood everything","End of communication","It is your turn","I am calling for help"],"hint":"Confirmation that the message was understood.","ref":"p. 44 — 'rođer' (roger)"},"rad10":{"q":"What is the SQL (squelch) knob on a radio set for?","choices":["Removes atmospheric interference/noise from the speaker","Increases the volume","Changes channels","Switches the set on"],"hint":"You set it until the noise stops; a real voice breaks through it.","ref":"p. 43 — squelch"},"rad11":{"q":"What certificate does a qualified boat operator hold?","choices":["Restricted — in the Croatian language, in coastal waters","General — for all seas and oceans","Authorisation for satellite communication","None"],"hint":"The General certificate is taken in English, in a separate exam.","ref":"p. 41 — operator's certificate"},"rad12":{"q":"What is the call sign of the coast radio station SPLIT RADIO?","choices":["9AS","9AR","9AD","9AZ"],"hint":"Rijeka = 9AR, Split = 9A?, Dubrovnik = 9AD.","ref":"p. 43 — coast station call signs"},"rad13":{"q":"What does the number 9 at the beginning of our boat's call sign indicate?","choices":["That the boat sails under the Croatian flag","The channel number","The year of registration","The power of the station"],"hint":"It is followed by a letter and a four-digit number.","ref":"p. 43 — boat call sign"},"rad14":{"q":"How many digits does an MMSI number consist of?","choices":["Nine","Seven","Five","Twelve"],"hint":"The first three indicate the flag state.","ref":"p. 45 — MMSI"},"rad15":{"q":"What do the first three digits of an MMSI number indicate?","choices":["The flag state of the boat (238 = Croatia)","The channel number","The year","The type of vessel"],"hint":"The remaining digits identify the ship station itself.","ref":"p. 45 — MMSI, country"},"rad16":{"q":"What is channel 70 used for?","choices":["Digital Selective Calling (DSC)","Boat-to-boat conversation","Weather forecasts","Pilot service"],"hint":"DSC = Digital Selective Calling.","ref":"p. 45 — DSC, channel 70"},"rad17":{"q":"After which disaster was the international maritime radio service (SOLAS) organised?","choices":["After the sinking of the Titanic","After the Second World War","After a tanker accident","After a fire in a port"],"hint":"Purpose: protection and rescue of human lives at sea.","ref":"p. 41 — SOLAS / Titanic"},"rad18":{"q":"What is a communication called in which you cannot listen and talk at the same time?","choices":["Simplex","Duplex","Analogue","Scanning"],"hint":"That is why we say 'over' at the end.","ref":"p. 42 — simplex"},"rad19":{"q":"What range does a transmitter with an output power of 25 W have?","choices":["About 20 NM","About 5 NM","About 50 NM","About 100 NM"],"hint":"Lower power (1 W) is used for shorter ranges and to save the battery.","ref":"p. 42 — transmitter range"},"rad20":{"q":"What is the call for grave and imminent danger (distress)?","choices":["MAYDAY","PAN PAN","SÉCURITÉ","ROĐER"],"hint":"Highest priority.","ref":"p. 44 — distress call"},"rad21":{"q":"How is 'Mayday' pronounced?","choices":["Mejdej","Madej","Majdaj","Mejdaj"],"hint":"From French 'm'aidez' (help me).","ref":"p. 44 — pronunciation of Mayday"},"rad22":{"q":"What is the URGENCY call (something important, but no direct danger to life)?","choices":["PAN PAN","MAYDAY","SÉCURITÉ","SOS"],"hint":"E.g. injury/illness or running out of fuel.","ref":"p. 45 — urgency call"},"rad23":{"q":"What is the SAFETY call (navigational or meteorological warnings)?","choices":["SÉCURITÉ (sekurite)","MAYDAY","PAN PAN","SEELONCE"],"hint":"It concerns everyone sailing in that area.","ref":"pp. 45–46 — safety call"},"rad24":{"q":"How many times is the name of a priority call (e.g. Mayday) repeated?","choices":["Three times","Once","Twice","Five times"],"hint":"Like the call signs in the call.","ref":"p. 44 — repeated 3 times"},"rad25":{"q":"What is the correct order of call priorities?","choices":["1. Mayday, 2. Pan Pan, 3. Sécurité","1. Sécurité, 2. Pan Pan, 3. Mayday","1. Pan Pan, 2. Mayday, 3. Sécurité","They are all equal"],"hint":"From greatest danger to warning.","ref":"pp. 44–46 — call priority"},"rad26":{"q":"What does the signal SEELONCE MAYDAY (silence mayday) mean?","choices":["Silence on the channel — for rescue traffic only","End of rescue","Repeat the call","Weather warning"],"hint":"All other conversations are stopped.","ref":"p. 45 — SEELONCE MAYDAY"},"rad27":{"q":"What does SEELONCE FEENEE (silence fini) mean?","choices":["End of rescue — the frequencies are free again","Start of rescue","Call for help","Silence due to urgency"],"hint":"Everything returns to normal operation.","ref":"p. 45 — SEELONCE FEENEE"},"rad28":{"q":"What does 'mejdej rilej' (Mayday relay) mean?","choices":["An intermediary passes on someone else's distress call","Repeating your own call","End of communication","Station test"],"hint":"When those who can help do not hear the vessel in distress.","ref":"p. 45 — Mayday relay"},"spl1":{"q":"Which word stands for the letter A (ITU alphabet)?","choices":["ALFA","ANA","AMERIKA","ADAM"],"hint":"The first letter of the Greek alphabet.","ref":"p. 45 — spelling alphabet"},"spl2":{"q":"Which word stands for the letter C?","choices":["CARLI","CEZAR","CENTAR","CITY"],"hint":"English 'Charlie'.","ref":"p. 45 — spelling alphabet"},"spl3":{"q":"Which word stands for the letter J?","choices":["ĐULIJET","JADRAN","JOSIP","JAGUAR"],"hint":"From the English 'Juliet'.","ref":"p. 45 — spelling alphabet"},"spl4":{"q":"Which word stands for the letter K?","choices":["KILO","KARLO","KAPETAN","KOLO"],"hint":"The same as the unit prefix for a thousand.","ref":"p. 45 — spelling alphabet"},"spl5":{"q":"Which word stands for the letter Q?","choices":["KVIBEK","KVEBEK","KVANTUM","KILO"],"hint":"From 'Quebec'.","ref":"p. 45 — spelling alphabet"},"spl6":{"q":"Which word stands for the letter R?","choices":["ROMEO","RADAR","RIJEKA","ROBERT"],"hint":"A famous Shakespeare character.","ref":"p. 45 — spelling alphabet"},"spl7":{"q":"Which word stands for the letter S?","choices":["SIERA","SPLIT","SIGMA","SUNCE"],"hint":"Like the mountain range (Sierra).","ref":"p. 45 — spelling alphabet"},"spl8":{"q":"Which word stands for the letter U?","choices":["JUNIFORM","UNION","UMAG","UNIVERSAL"],"hint":"From 'Uniform'.","ref":"p. 45 — spelling alphabet"},"spl9":{"q":"Which word stands for the letter W?","choices":["VISKI","VILJEM","VAŠINGTON","VAL"],"hint":"From 'Whiskey'.","ref":"p. 45 — spelling alphabet"},"spl10":{"q":"Which word stands for the letter Y?","choices":["JENKI","JELENA","JORK","JAMAHA"],"hint":"From 'Yankee'.","ref":"p. 45 — spelling alphabet"},"spl11":{"q":"Which word stands for the letter Z?","choices":["ZULU","ZAGREB","ZEBRA","ZORO"],"hint":"The same as the time zone 'Z'.","ref":"p. 45 — spelling alphabet"},"spl12":{"q":"Which word stands for the letter G?","choices":["GOLF","GORAN","GRAD","GAMA"],"hint":"A sport with a club and a ball.","ref":"p. 45 — spelling alphabet"},"spl13":{"q":"Which word stands for the letter N?","choices":["NOVEMBER","NIKOLA","NORD","NAUTIKA"],"hint":"The eleventh month.","ref":"p. 45 — spelling alphabet"},"spl14":{"q":"How is the number 0 (zero) pronounced in the table?","choices":["ZIRO","NULA","ZERO","OSKAR"],"hint":"From the English 'zero'.","ref":"p. 45 — numbers"},"spl15":{"q":"How is the number 4 pronounced in the table?","choices":["FOR","FAJF","FOKS","FIR"],"hint":"From the English 'four'.","ref":"p. 45 — numbers"},"spl16":{"q":"How is the number 9 pronounced in the table?","choices":["NAJN","NINE","NOVEMBER","NULA"],"hint":"From the English 'nine'.","ref":"p. 45 — numbers"},"spl17":{"q":"Which word stands for the letter D?","choices":["DELTA","DAVID","DUBROVNIK","DIANA"],"hint":"A Greek letter / a river mouth.","ref":"p. 45 — spelling alphabet"},"spl18":{"q":"Which word stands for the letter M?","choices":["MAJK","MARKO","MIKE","MILAN"],"hint":"From the English name 'Mike'.","ref":"p. 45 — spelling alphabet"},"kart-n1":{"q":"Why is distance on a chart measured on the SIDE edges (latitude) and not on the top/bottom edge?","choices":["Because minutes of latitude correspond to miles, while minutes of longitude are graphically different (parallels have different diameters)","Because the chart is narrower at the top","Because there is no scale at the top","Because there is only land at the top"],"hint":"Parallels become narrower towards the poles.","ref":"p. 32 — measuring distance"},"kart-n2":{"q":"A chart is more than 10 years old. What should you do with it?","choices":["The data is no longer reliable — it must be updated (harbour master's office, Lučka kapetanija, free of charge)","Throw it away","It is still completely accurate","It is valid only at night"],"hint":"Variation changes over the years.","ref":"p. 32 — age of the chart"},"kart-n3":{"q":"What value does one cable correspond to?","choices":["One tenth of a nautical mile (0.1 NM)","One mile","One degree","One second"],"hint":"A minute (= 1 NM) is divided into 10 cables.","ref":"p. 32 — cable"},"kart-n4":{"q":"What does a COURSE chart (scale ~1:300,000) cover?","choices":["About half of the Adriatic — for planning longer passages","Only one port","The whole world","One island"],"hint":"You plan a longer trip on it.","ref":"p. 32 — course chart"},"kart-n5":{"q":"What is mathematically achieved with the Mercator projection?","choices":["Distances and compass angles on the chart correspond to those in reality","That the chart is round","That there is no distortion at the poles","That everything is at a scale of 1:1"],"hint":"That is why we can plot courses and measure distances accurately.","ref":"p. 31 — Mercator"},"kart-t1":{"q":"You measure distance and take the minutes from the TOP edge of the chart. Is that correct?","choices":["No — the top/bottom shows minutes of longitude, which do not correspond to miles; use the side (left/right) edge","Yes, it makes no difference which edge","Yes, the top edge is the most accurate","Only if the chart is new"],"hint":"Miles are read on the latitude scale (side).","ref":"p. 32 — measuring distance"},"kart-t2":{"q":"Which is MORE PRECISE: a 1:80,000 chart or a 1:5,000 plan?","choices":["The 1:5,000 plan (smaller ratio number = more detail)","The 1:80,000 chart","They are equal","It depends on the area"],"hint":"The smaller number in the ratio = more precise.","ref":"p. 32 — chart scales"},"kart-t3":{"q":"A colleague claims: 'The prime meridian passes through the Adriatic.' Is he right?","choices":["No — the prime meridian is near London (Greenwich); the Adriatic is at EAST longitude","Yes","The prime meridian is the Equator","Yes, through Split"],"hint":"The Equator is the zero parallel, not a meridian.","ref":"p. 32 — prime meridian"},"kart-t4":{"q":"Does blue on a chart mean deep, safe water?","choices":["No — blue means shallows (under 10 m), be careful because of your draught","Yes, blue is the deepest","Blue is land","Blue is anchorages"],"hint":"Land is yellow, shallows are blue.","ref":"p. 35 — colours on the chart"},"kurs-n1":{"q":"What is the formula for the compass course (Kk) from the true course (Kp)?","choices":["Kk = Kp − (±var) − (±dev)","Kk = Kp + var + dev","Kk = Kp × dev","Kk = var − dev"],"hint":"The reverse of the formula for Kp — you subtract.","ref":"pp. 33 and 49 — formulas"},"kurs-n2":{"q":"What is the total correction (uk)?","choices":["The sum of deviation and variation; uk = Kp − Kk","Variation only","Deviation only","The speed of the ship"],"hint":"It combines both 'lies' of the compass.","ref":"p. 49 — total correction"},"kurs-n3":{"q":"How is the true bearing calculated from the RIGHT relative bearing / bow angle (Ld)?","choices":["ωp = Kp + Ld","ωp = Kp − Ld","ωp = Ld − Kp","ωp = Kp × Ld"],"hint":"For the left angle (Ll) you subtract.","ref":"p. 49 — ωp = Kp + Ld"},"kurs-n4":{"q":"What is 'subočica' (abeam)?","choices":["When an object is at an angle of 90° to the course (abeam)","When the object is dead ahead","When the object is astern","An angle of 45°"],"hint":"Passing a cape or lighthouse 'abeam'.","ref":"p. 50 — abeam"},"kurs-n5":{"q":"Why is a compass with a rose of at least 20 cm diameter more reliable?","choices":["For more accurate reading (small compasses have a 5° division)","Because it is heavier","Because it turns more slowly","Because it needs no fluid"],"hint":"On a small rose you cannot read half a degree.","ref":"p. 34 — rose size"},"kurs-t1":{"q":"Does the compass always show true geographic north?","choices":["No — it 'lies' because of variation (magnetic pole) and deviation (iron/EM fields)","Yes, always","It lies only at night","It lies only in the south"],"hint":"That is why there are three kinds of course.","ref":"pp. 14 and 32 — variation/deviation"},"kurs-t2":{"q":"You took bearings of three objects and got a small triangle, not a point. Why?","choices":["Because you did not take the bearings simultaneously — the boat moved between bearings","The compass is broken","The chart is old","Three objects always give a triangle of error"],"hint":"Smaller triangle = greater accuracy.","ref":"p. 34 — position triangle"},"kurs-t3":{"q":"You are sailing downstream with the current and waves, and the rudder barely 'responds'. Why?","choices":["You must be faster than the current/waves so that water flows over the rudder blade","The rudder is too small","The engine is always too weak","The compass interferes"],"hint":"The rudder works on the water flowing around the blade.","ref":"p. 8 and 47 — steering"},"svj-n1":{"q":"How many flashes in a group does the EAST cardinal mark show (according to the IALA annex)?","choices":["3 flashes","6 flashes","9 flashes","Continuous"],"hint":"East — the clock shows 3.","ref":"p. 55 — IALA lights"},"svj-n2":{"q":"How is the SOUTH cardinal mark characterised?","choices":["6 flashes + one long flash","3 flashes","9 flashes","Continuous white"],"hint":"6 + long.","ref":"p. 55 — IALA lights"},"svj-n3":{"q":"How many flashes does the WEST cardinal mark show?","choices":["9 flashes","3 flashes","6 flashes","1 flash"],"hint":"West — the most, 9.","ref":"p. 55 — IALA lights"},"svj-t1":{"q":"'Bl 3' and 'Bl 9' (Croatian chart abbreviation; international: Fl(3), Fl(9)) are the same — just flashing?","choices":["No — 3 flashes = east, 9 flashes = west; the number indicates the side","Yes, the number does not matter","Only the colour matters","Both mean north"],"hint":"Number of flashes = which cardinal side.","ref":"p. 55 — IALA lights"},"svj-t2":{"q":"A buoy without a light means nothing and can be ignored?","choices":["No — it is painted in a colour or has a day mark that carries meaning","Yes, without a light it is unimportant","It only means an anchorage","It means the end of the fairway"],"hint":"Watch the colour and shape.","ref":"p. 37 — marks without lights"},"sid-n1":{"q":"The anchor is stuck under a rock and will not come up. Procedure?","choices":["Motor in the direction opposite to the one used when anchoring; if that fails, send a metal ring ('kolač') down the anchor line","Cut the line immediately","Pull vertically upwards","Leave it"],"hint":"First reverse the direction of pull.","ref":"p. 10 — freeing a stuck anchor"},"sid-n2":{"q":"Mooring alongside with a strong wind blowing off the quay. How do you secure the boat?","choices":["With four lines (springs): from the bow one line forward and one aft, from the stern one forward and one aft","With a single line from the bow","With the anchor only","Without lines"],"hint":"Four lines — if one parts, three remain.","ref":"p. 11 — spring/four-line mooring"},"sid-n3":{"q":"What is the mass of the MAIN anchor for a boat of 10 m length (table)?","choices":["13 kg","9 kg","27 kg","5 kg"],"hint":"7 m → 9 kg; 10 m → …","ref":"p. 29 — Table 4.1.1-1"},"sid-n4":{"q":"Why do we attach a short chain (3–4 m of chain) to the anchor?","choices":["The line does not chafe on sharp rock, and its weight pulls the boat away from the shore","To make it lighter","To make it light up","To make it shorter"],"hint":"When a wave moves the boat, it must first lift the chain from the bottom.","ref":"p. 10 — short chain"},"sid-t1":{"q":"You hold the anchor right below the boat so that it 'holds better'. Correct?","choices":["No — the scope (anchor line) must be at least 4× the depth; if too short, the anchor is pulled up vertically and does not dig in","Yes, that is how it holds best","Yes, if the water is shallow","It makes no difference"],"hint":"The farther out it is laid, the better it digs in.","ref":"p. 10 — 4× rule"},"sid-t2":{"q":"For a 15 m boat a 13 kg main anchor is sufficient?","choices":["No — for 15 m it is 27 kg; 13 kg is for 10 m","Yes","9 kg is enough","Mass does not matter"],"hint":"Check the table; it increases with length.","ref":"p. 29 — Table 4.1.1-1"},"sid-t3":{"q":"A floating (buoyant) line can also be used as an anchor line?","choices":["No — a floating line can be picked up by the propeller and wrapped around the shaft","Yes, it is even better","Yes, if it is thin","Only not at night"],"hint":"Danger for the propeller/shaft.","ref":"p. 12 — ropes"},"ozn-n1":{"q":"What does a SAFE WATER mark look like?","choices":["Red-and-white vertical stripes (a sphere as topmark)","Yellow with a cross","Black with a red band","Entirely green"],"hint":"Red-white = middle of a safe channel.","ref":"p. 55 — safe water"},"ozn-n2":{"q":"What does an ISOLATED DANGER mark look like?","choices":["Black with a red band (two black spheres as topmark)","Yellow","Red-and-white","Only green"],"hint":"It is placed ON or right above the danger itself.","ref":"p. 55 — isolated danger"},"ozn-t1":{"q":"You see a yellow buoy with an 'X' cross. It marks a danger?","choices":["No — it is a SPECIAL mark (e.g. cables, zones, military exercises)","Yes, a dangerous rock","Yes, an isolated danger","North cardinal"],"hint":"Yellow + X = special area.","ref":"p. 55 — special marks"},"ozn-t2":{"q":"In region A the port-side mark is green?","choices":["No — port is RED, starboard is green","Yes","Both are yellow","Port is black"],"hint":"The Adriatic is region A.","ref":"p. 55 — lateral marks"},"opr-n1":{"q":"What does navigation area II cover?","choices":["International navigation in the Adriatic Sea","All seas of the world","Only ports and rivers","Up to 1 NM from the coast"],"hint":"Between I (all seas) and III (territorial).","ref":"p. 3 — navigation areas"},"opr-n2":{"q":"Why must fibreglass boats carry a radar reflector?","choices":["Because they reflect (absorb) radar echoes poorly, so others can hardly see them","Because of lightning","For better GPS","Because of the compass"],"hint":"The reflector is made of aluminium and amplifies the echo.","ref":"p. 51 — radar reflector"},"opr-n3":{"q":"How long does the training for category C last?","choices":["25 + 6 school hours, over a period of 4 days","One day","One year","Only the exam"],"hint":"Health requirements are also needed.","ref":"p. 2 — category C"},"opr-n4":{"q":"How many subjects does the exam programme for category B consist of?","choices":["Five subjects","Three subjects","Ten subjects","One subject"],"hint":"Navigation, engines, seamanship/regulations/meteorology, manoeuvring/safety/first aid, radiotelephony.","ref":"p. 2 — exam programme"},"opr-t1":{"q":"Category A is sufficient for a boat with 20 kW power?","choices":["No — power above 15 kW requires age 18 and category B","Yes","Yes, with age 16","No certificate is needed at all"],"hint":"Category A covers up to 15 kW and 7 m.","ref":"p. 2–3 — authorisations"},"opr-t2":{"q":"Area IIIb extends up to 6 NM from the coast?","choices":["No — IIIb is up to 3 NM (IIIa is 6, IIIc is 1)","Yes","IIIb is up to 12 NM","IIIb is up to 1 NM"],"hint":"a=6, b=3, c=1.","ref":"p. 3 — navigation areas"},"opr-t3":{"q":"Only the boat operator needs a lifejacket?","choices":["No — for ALL persons on board (adults and children)","Yes, only the operator","Only for children","Not mandatory"],"hint":"While under way, for everyone.","ref":"p. 27 — lifesaving equipment"},"vje-n1":{"q":"When is the Bora usually strongest during the day?","choices":["Around 10 h and between 18 and 22 h","At noon","At dawn","Constantly around midnight"],"hint":"It weakens around noon and midnight (a chance to escape).","ref":"p. 16 — Bora"},"vje-n2":{"q":"How many days can the Bora last in winter?","choices":["3 to 7 days","At most 1 day","2 weeks","Never more than 6 hours"],"hint":"In summer sometimes only ~2 days.","ref":"p. 16 — Bora"},"vje-n3":{"q":"What are the signs of an approaching Jugo (Sirocco, SE wind)?","choices":["Hazy/foggy horizon, strong halos, higher tides, pressure below 1000 hPa","Clear sky and high pressure","Bora from the mountain tops","Sudden drop in temperature"],"hint":"The Jugo pushes the sea northwards (higher tides).","ref":"p. 17 — Jugo, warning signs"},"vje-n4":{"q":"What is the warning sign of the Lebić (Garbin, SW wind)?","choices":["Extremely high tide, a low band of fog in the SW and a sudden pressure drop","Clear skies and the Maestral","Cloud caps over Velebit","Calm morning"],"hint":"We are entering the area of squalls and storms.","ref":"p. 17 — Lebić"},"vje-n5":{"q":"What is the stronger first Maestral after bad weather called?","choices":["Maeštralun (especially in the Hvar Channel)","Burin","Levant","Neverin"],"hint":"It appears when it has room to build up.","ref":"p. 18 — Maestral"},"vje-n6":{"q":"What is an ANTICYCLONIC (clear) Bora like?","choices":["Dry, with pronounced gusts; it 'blows' spray dust off the water","Warm and humid, with rain","Without gusts, steady","Always at night"],"hint":"As opposed to the cyclonic ('rotten') Bora.","ref":"p. 16 — types of Bora"},"vje-n7":{"q":"Who publishes the marine weather forecast for boaters?","choices":["Maritime Meteorological Centre Split (Pomorski meteorološki centar Split)","Harbour Master's Office Pula (Lučka kapetanija Pula)","HAK (Croatian Auto Club)","Plovput (Croatian aids-to-navigation authority)"],"hint":"A report for mariners.","ref":"p. 18 — forecasts"},"vje-t1":{"q":"The Jugo, like the Bora, arrives suddenly at full strength?","choices":["No — the Jugo develops GRADUALLY (strengthens over days); the Bora arrives suddenly","Yes, both suddenly","The Jugo is always weak","The Jugo blows only at night"],"hint":"Weak on the first day, 'rolling' on the third.","ref":"p. 16–17 — Jugo vs Bora"},"vje-t2":{"q":"The Maestral is a dangerous storm wind to beware of?","choices":["No — the Maestral is a FAIR-WEATHER wind; storm winds are the Lebić, Pulenat and squalls (Nevera)","Yes, it is hurricane-force","Yes, it brings the Bora","Yes, it raises waves up to 5 m"],"hint":"Boaters' favourite wind.","ref":"p. 18 — Maestral"},"vje-t3":{"q":"A waterspout is heading straight at you and you cannot escape. Best move?","choices":["Enter its centre at the highest possible speed — there it is completely calm","Stop and wait","Drop the anchor","Sail slowly at right angles to it"],"hint":"The centre of the vortex is calm.","ref":"p. 18 — waterspout"},"vje-t4":{"q":"A Cb (cumulonimbus) in the shape of an anvil announces fair weather?","choices":["No — it brings a heavy downpour, thunderstorm, squall/Nevera","Yes, it is a sign of clear weather","It means the Maestral","It means the end of the rain"],"hint":"Cu (cotton-like) is fair weather, Cb is not.","ref":"p. 16 — clouds"},"zvu-n1":{"q":"A power-driven vessel UNDERWAY makes 1 long blast. And a vessel that is underway but NOT making way through the water?","choices":["Two long blasts","One long blast","Three short","Four short"],"hint":"One long blast more.","ref":"p. 40 — fog"},"zvu-n2":{"q":"Is overtaking generally permitted in narrow channels and straits?","choices":["No — permission is requested with the prescribed signals","Yes, always","Only at night","Only for sailing boats"],"hint":"You ask with the signals 2 long + short.","ref":"p. 40 — overtaking"},"zvu-n3":{"q":"What is recommended in addition to sound signals when overtaking?","choices":["VHF channel 16 and a light","Fog horn","Rockets","Bell"],"hint":"Additional communication for safety.","ref":"p. 40 — overtaking"},"zvu-t1":{"q":"In fog you hear 1 long + 2 short — do you think it is a pilot vessel?","choices":["No — a pilot vessel is 4 short; 1 long + 2 short is a sailing vessel/fishing vessel/tug/vessel restricted in her ability to manoeuvre","Yes, that is a pilot vessel","That is an anchored vessel","That is a change of course"],"hint":"Pilot = four short.","ref":"p. 40 — fog"},"zvu-t2":{"q":"An anchored vessel and a vessel aground give exactly the same signal in fog?","choices":["No — a vessel aground ADDITIONALLY gives three separate strokes on the bell before and after the rapid ringing","Yes, they are the same","The vessel aground uses the horn","The vessel aground stays silent"],"hint":"Aground = anchored + 3 strokes.","ref":"p. 40 — vessel aground"},"zvu-t3":{"q":"Five short blasts means 'I am turning to port five times'?","choices":["No — it is a warning/doubt signal (the intentions of the other vessel are not understood)","Yes","It means going astern","It means anchoring"],"hint":"Doubt, not a manoeuvre.","ref":"p. 39 — sound signals"},"sud-n1":{"q":"Sailing boat A is overtaking sailing boat B, wind from astern, and A's sails are on her PORT side. On which side is she overtaking?","choices":["On the STARBOARD side","On the port side","Straight across the stern","She must not overtake"],"hint":"Sails on port → overtakes to starboard (and vice versa).","ref":"p. 38 — overtaking by sailing boats"},"sud-n2":{"q":"Two sailing boats both have the wind on the PORT side. Who has right of way?","choices":["The one to leeward (the other is to windward)","The one to windward","The larger sailing boat","The faster sailing boat"],"hint":"Leeward = the sheltered side.","ref":"p. 38 — sailing boats"},"sud-n3":{"q":"How do you enter a harbour past the breakwater?","choices":["In a wide arc, at a suitable distance, so that you can see the exit and avoid the one leaving","As close to the edge of the breakwater as possible","At full speed","Always first, without looking"],"hint":"The one leaving has priority.","ref":"p. 46 — order in harbours"},"sud-t1":{"q":"A motorboat has right of way over a sailing boat because it is faster and more manoeuvrable?","choices":["No — the sailing boat (under sail) has right of way because of its reduced manoeuvrability","Yes, the engine is stronger","Yes, if it is larger","It depends on speed"],"hint":"Power gives way to sail.","ref":"p. 38 — right of way of sailing boats"},"sud-t2":{"q":"When courses cross, the boat approaching from the PORT side has right of way?","choices":["No — the one on the STARBOARD side has right of way","Yes, the one on the left has right of way","The faster one has right of way","There is no rule"],"hint":"The starboard-side rule.","ref":"p. 38 — crossing"},"sud-t3":{"q":"You have right of way, but the other does not give way. Do you insist on your right to the end?","choices":["No — the goal is to avoid collision; a compromise solution if necessary","Yes, right of way is right of way","Yes, speed up and pass","Yes, and signal angrily"],"hint":"Safety before 'rights'.","ref":"p. 38 — compromise"},"svl-n1":{"q":"How many white masthead lights does a vessel longer than 50 m carry?","choices":["Two","One","Three","None"],"hint":"Longer vessel = two white lights in a line.","ref":"p. 53 — vessel longer than 50 m"},"svl-n2":{"q":"What DAY SHAPE does an anchored vessel display?","choices":["One black ball (in the bow)","Three black balls","A black cylinder","Two cones"],"hint":"By day a ball, at night a white all-round light.","ref":"p. 41 — day shapes"},"svl-n3":{"q":"Which DAY SHAPE does a vessel aground (longer than 50 m) display?","choices":["Three black balls (vertically)","One ball","A black diamond","A black cylinder"],"hint":"Three balls = aground.","ref":"p. 41 — day shapes"},"svl-n4":{"q":"Which DAY SHAPE does a vessel not under command / broken down display?","choices":["Two black balls","One ball","Three balls","A black cylinder"],"hint":"Two balls = not under command.","ref":"p. 41 — day shapes"},"svl-t1":{"q":"Three red lights in a vertical line = vessel not under command?","choices":["No — three red lights mean 'constrained by her draught'; a vessel not under command shows TWO red lights","Yes, that is a breakdown","That is a trawler","That is a pilot vessel"],"hint":"Draught = 3 red, breakdown = 2 red.","ref":"p. 54 — vessel lights"},"svl-t2":{"q":"Red over white = a trawler?","choices":["No — red over white is a FISHING VESSEL with other gear (not trawling); a trawler shows GREEN over white","Yes, that is a trawler","That is a pilot vessel","That is a sailing vessel"],"hint":"Trawler = green on top.","ref":"p. 53 — lights"},"svl-t3":{"q":"A pilot vessel shows red over white?","choices":["No — a pilot vessel shows WHITE over red","Yes","A pilot vessel shows 3 red","A pilot vessel shows a flashing yellow"],"hint":"White on top, red below.","ref":"p. 53 — pilot vessel"},"rad-n1":{"q":"How many working VHF channels are there in total, and which ones?","choices":["56 channels: 1–28 and 60–88","100 channels","Only 16","10 channels"],"hint":"Those between 28 and 60 are reserved (weather).","ref":"p. 41 — VHF channels"},"rad-n2":{"q":"Why is lower power (1 W) often used for ship-to-ship communication?","choices":["It saves the battery, disturbs others less and the voice is less distorted","Because higher power is forbidden","Because higher power is quieter","There is no reason"],"hint":"25 W is for longer ranges (~20 NM).","ref":"p. 42 — transmitter power"},"rad-n3":{"q":"What is used to check whether the antenna is matched to the radio?","choices":["An SWR meter","A voltmeter","A compass","GPS"],"hint":"A mismatched antenna reflects energy back and heats the transmitter.","ref":"p. 42 — antenna"},"rad-n4":{"q":"What does Dual Watch (DW) mean?","choices":["Listening to two channels at the same time, always including 16.","Double power","Two microphones","Two antennas"],"hint":"Always together with channel 16.","ref":"p. 42–43 — DW"},"rad-n5":{"q":"What types of calls exist in DSC?","choices":["Distress, Urgency, Safety, Routine, Ship's business","Only Mayday","Only urgent and ordinary","Distress and end"],"hint":"From distress to ship's business.","ref":"p. 45 — DSC calls"},"rad-n6":{"q":"What is the signal for the end of a rescue operation and what does it mean?","choices":["SEELONCE FEENEE (silence fini) — rescue finished, frequencies free","SEELONCE MAYDAY — end","PRU-DONCE — end","MAYDAY RELAY — end"],"hint":"'Fini' = finished.","ref":"p. 45 — SEELONCE FEENEE"},"rad-n7":{"q":"When is the 'silence period' in radiotelephony (on professional frequencies)?","choices":["2×3 minutes every hour: on the full hour and at the 30th minute (does not apply to VHF)","The whole hour","Never","Only at night"],"hint":"On VHF (our area) there is no such obligation.","ref":"p. 42 — silence period"},"rad-t1":{"q":"You have run out of fuel, but your life is not in danger. Do you call MAYDAY?","choices":["No — that is PAN PAN (urgency); Mayday is only for danger to life","Yes, always Mayday","You call Sécurité","You do not call anyone"],"hint":"Mayday = distress (lives in danger).","ref":"p. 44–45 — priority calls"},"rad-t2":{"q":"SEELONCE MAYDAY means that the rescue is FINISHED?","choices":["No — it means SILENCE on the channel (only for the rescue); the end is SEELONCE FEENEE","Yes, it means the end","It means the start of a conversation","It means a change of channel"],"hint":"'Feenee/fini' = end.","ref":"p. 45 — SEELONCE"},"rad-t3":{"q":"A boat operator may use the radio in English, on all seas and oceans?","choices":["No — he has a LIMITED authorisation: Croatian language, in coastal waters","Yes, on all seas","Yes, but only at night","Yes, with an additional fee"],"hint":"The general authorisation (English, all seas) is a separate exam.","ref":"p. 41 — authorisation"},"rad-t4":{"q":"You use a Sécurité call when someone on your boat is injured?","choices":["No — for injury/urgency it is PAN PAN; Sécurité is for navigational/weather warnings to everyone","Yes, Sécurité","Yes, it is the same as Mayday","Yes, always Sécurité"],"hint":"Sécurité concerns ALL who sail in that area.","ref":"p. 45–46 — Sécurité"},"spel-n1":{"q":"Which LETTER does the word TANGO represent?","choices":["T","D","P","G"],"hint":"Read the table in reverse.","ref":"p. 45 — table"},"spel-n2":{"q":"Which letter does the word JUNIFORM represent?","choices":["U","J","Y","I"],"hint":"From 'Uniform'.","ref":"p. 45 — table"},"spel-n3":{"q":"Which letter does the word KVIBEK represent?","choices":["Q","K","W","C"],"hint":"From 'Quebec'.","ref":"p. 45 — table"},"spel-n4":{"q":"How is the number 7 pronounced in the table?","choices":["SEVN","SEDAM","SEVEN","SIKS"],"hint":"From the English 'seven'.","ref":"p. 45 — numbers"},"spel-n5":{"q":"How is the number 3 pronounced in the spelling table?","choices":["TRI","TREE","TU","TRIJE"],"hint":"From 'three', but it is written TRI.","ref":"p. 45 — numbers"},"spel-n6":{"q":"What is the word for the letter O?","choices":["OSKAR","OTON","OMEGA","OKO"],"hint":"From 'Oscar'.","ref":"p. 45 — table"},"spel-t1":{"q":"The letter Q is pronounced 'KVEBEK' in this table?","choices":["No — the table says 'KVIBEK'","Yes, KVEBEK","Yes, KVEBIK","KJUBEK"],"hint":"Watch the spelling in the course manual.","ref":"p. 45 — table"},"spel-t2":{"q":"The letter J is pronounced 'JULIJET'?","choices":["No — the table says 'ĐULIJET'","Yes, JULIJET","Yes, JULIET","JOTA"],"hint":"It starts with Đ.","ref":"p. 45 — table"},"spel-t3":{"q":"The letter W is pronounced 'VILJEM'?","choices":["No — 'VISKI'","Yes, VILJEM","Yes, VAŠINGTON","VELIKO V"],"hint":"From 'Whiskey'.","ref":"p. 45 — table"},"uzl1":{"q":"Which knot is put on a quay bollard for mooring?","choices":["Pašnjak (mooring hitch)","Figure-eight knot (Osmica)","Reef knot (Muški)","Anchor bend (Sidreni)"],"hint":"It allows several boats to be tied to the same bollard.","ref":"p. 13 — knots"},"uzl2":{"q":"Which knot is used to join two ropes of the SAME thickness?","choices":["Reef knot (Muški)","Sheet bend (Zastavni)","Figure-eight knot (Osmica)","Clove hitch (Vrtni)"],"hint":"For equal thicknesses.","ref":"p. 13 — knots"},"uzl3":{"q":"Which knot is used to join two ropes of DIFFERENT thickness?","choices":["Sheet bend (Zastavni)","Reef knot (Muški)","Pašnjak (mooring hitch)","Buoy hitch (Plutačni)"],"hint":"For unequal thicknesses.","ref":"p. 13 — knots"},"uzl4":{"q":"What is the figure-eight knot (OSMICA) used for?","choices":["It is tied at the end of a rope so that it does not unravel or run through a block","For joining two ropes","For mooring to a bollard","For the anchor"],"hint":"A stopper knot at the end.","ref":"p. 13 — knots"},"uzl5":{"q":"Which knot is tied to the anchor ring or the shackle of the anchor chain?","choices":["Anchor bend (Sidreni)","Pašnjak (mooring hitch)","Reef knot (Muški)","Figure-eight knot (Osmica)"],"hint":"The name says it all.","ref":"p. 13 — knots"},"uzl6":{"q":"Which knot goes on the ring of a mooring buoy?","choices":["Buoy hitch (Plutačni)","Anchor bend (Sidreni)","Sheet bend (Zastavni)","Clove hitch (Vrtni)"],"hint":"Named after the buoy.","ref":"p. 13 — knots"},"uzl7":{"q":"Which knot is tied to a rail (fender on a railing) or slipped over a bollard?","choices":["Clove hitch (Vrtni)","Pašnjak (mooring hitch)","Figure-eight knot (Osmica)","Anchor bend (Sidreni)"],"hint":"For fenders on the railing.","ref":"p. 13 — knots"},"uzl8":{"q":"Why is the pašnjak mandatory when mooring to a quay bollard?","choices":["It allows several boats to be tied to the same bollard without untying other people's lines","Because it is the strongest","Because it lights up","Because it is the easiest"],"hint":"You do not have to touch other people's lines.","ref":"p. 13 and 46 — pašnjak"},"uzl9":{"q":"What are ropes made of today and what is their advantage?","choices":["Synthetic — they do not absorb water and have a higher breaking strength (with UV protection)","Natural fibres","Metal","Rubber"],"hint":"They used to be manila, sisal, coir.","ref":"p. 12–13 — ropes"},"uzl10":{"q":"Why must the anchor rope not be a floating rope?","choices":["Because the propeller can pick it up and wind it around the shaft","Because it sinks too slowly","Because it is too expensive","Because it cannot be seen"],"hint":"Danger for the propeller.","ref":"p. 12 — ropes"},"uzl11":{"q":"You join two ropes of DIFFERENT thickness with a reef knot?","choices":["No — for different thicknesses the SHEET BEND is used; the reef knot is for equal thicknesses","Yes","Yes, if they are close in size","It does not matter which knot"],"hint":"Reef knot = equal, sheet bend = different.","ref":"p. 13 — knots"},"uzl12":{"q":"For mooring to a quay bollard it is enough to just wrap the rope around it without a knot?","choices":["No — the pašnjak is mandatory","Yes","Yes, if the weather is fine","A figure-eight knot is sufficient"],"hint":"The pašnjak is the prescribed method.","ref":"p. 13 and 46 — mooring"},"mot1":{"q":"What are the two basic groups of internal combustion engines?","choices":["Diesel and petrol (Otto)","Electric and diesel","Two-stroke and water-driven","Steam and petrol"],"hint":"By fuel/ignition type.","ref":"p. 19 — engines"},"mot2":{"q":"What are the strokes of a 4-stroke engine, in order?","choices":["Intake, compression, expansion (power), exhaust","Ignition, cooling, expansion, stop","Intake, exhaust, compression, power","Compression, intake, exhaust, power"],"hint":"1 intake, 2 compression, 3 power, 4 exhaust.","ref":"p. 19–20 — 4-stroke"},"mot3":{"q":"How is the fuel ignited in a DIESEL engine?","choices":["By self-ignition — due to air heated strongly by compression (~750 °C)","By a spark plug spark","By an open flame","By a permanently running heater"],"hint":"There is no spark plug.","ref":"p. 20 — diesel"},"mot4":{"q":"How is the mixture ignited in a PETROL engine?","choices":["By a spark from the spark plug","By self-ignition","By pressure","By a heater"],"hint":"That is why a source of electric current is needed.","ref":"p. 20 — petrol engine"},"mot5":{"q":"What does a diesel draw in during the 1st stroke, and what does a petrol engine draw in?","choices":["Diesel draws in pure air; petrol engine a mixture of air and fuel","Both pure air","Both a mixture","Diesel a mixture, petrol engine air"],"hint":"In a diesel the fuel comes later (injection).","ref":"p. 20 — intake"},"mot6":{"q":"Which stroke is the 'power' stroke (produces power)?","choices":["Third — expansion","First — intake","Second — compression","Fourth — exhaust"],"hint":"Combustion pushes the piston down.","ref":"p. 20 — power stroke"},"mot7":{"q":"What is prescribed 50 m before the fuel dock?","choices":["Switch off the engine and approach without engine power","Speed up","Switch on the blower","Drop the anchor"],"hint":"The first fire-prevention measure.","ref":"p. 23 — refuelling"},"mot8":{"q":"How is lubrication of a 2-stroke petrol engine solved?","choices":["Lubricating oil is added to the fuel (mixture)","By an oil pump from the crankcase","Manually before every trip","No lubrication is needed"],"hint":"E.g. 2% oil in petrol.","ref":"p. 21 — lubrication"},"mot9":{"q":"Where is the oil in a 4-stroke engine and what drives it?","choices":["In the housing (crankcase); it is driven by a gear oil pump","In the fuel","In the radiator","In the exhaust"],"hint":"The bottom of the crankcase is V-shaped.","ref":"p. 21 — lubrication"},"mot10":{"q":"What two types of engine cooling exist?","choices":["Water (sea water) and air","Oil and water","Air and gas","Sea water only"],"hint":"Water: open and closed system.","ref":"p. 22 — cooling"},"mot11":{"q":"What is a kingston (sea cock)?","choices":["A grating/opening for sea water intake under the hull (open cooling system)","A type of spark plug","A fuel filter","An engine brand"],"hint":"It can be clogged by a bag or a shell.","ref":"p. 22 — cooling"},"mot12":{"q":"What voltage does one cell of a lead-acid battery give and how many cells for 12 V?","choices":["2 V per cell; 6 cells = 12 V","1.5 V; 8 cells","6 V; 2 cells","12 V per cell"],"hint":"Cells connected in series.","ref":"p. 22–23 — battery"},"mot13":{"q":"With what current do we charge a battery?","choices":["About 10% of the nominal capacity (55 Ah → ~5.5 A)","100% of the capacity","Always 20 A","The stronger the better"],"hint":"Slower and longer is better.","ref":"p. 23 — charging"},"mot14":{"q":"Below what voltage do the lead plates of a battery start to deform?","choices":["Below 10.5 V","Below 12 V","Below 6 V","Below 2 V"],"hint":"A short circuit follows and the battery is finished.","ref":"p. 23 — battery"},"mot15":{"q":"Why are protectors (zinc and lead anodes) fitted on the shaft/hull?","choices":["Because of galvanic currents — so that the anode is consumed instead of the propeller/shaft","For better speed","For grounding the radio","For ballast"],"hint":"Otherwise the propeller becomes thinner and pitted.","ref":"p. 25 — galvanic currents"},"mot16":{"q":"What do we switch on before starting an inboard petrol engine after refuelling?","choices":["The blower to extract petrol vapours from the engine compartment","The radio","The anchor windlass","The heater"],"hint":"If there is no blower — at least open the engine hatch.","ref":"p. 23 — after refuelling"},"mot17":{"q":"The diesel stopped because air entered the fuel supply. How do we fix it?","choices":["Bleed it — push the air out from the Bosch pump until diesel flows without bubbles, then tighten the connections","Add oil","Change the spark plug","Charge the battery"],"hint":"Air gets in where a seal gives way.","ref":"p. 25 — diesel, air in fuel"},"mot18":{"q":"A petrol outboard will not start. What is the order of checks?","choices":["Spark, spark plug, fuel","Fuel, oil, water","Battery, then anchor","Antenna, radio, compass"],"hint":"First check whether there is a spark.","ref":"p. 24–25 — faults"},"mot19":{"q":"The engine is 'flooded' (too much fuel). A colleague keeps cranking immediately. Is that correct?","choices":["No — wait for the excess to evaporate, or remove and dry/pump out the spark plug (with electronic ignition, ground the cable)","Yes, just keep cranking","Add more fuel","Pour water on it"],"hint":"Otherwise the engine 'chokes'.","ref":"p. 24 — flooded engine"},"mot20":{"q":"An outboard engine with a separate tank will not start — and you did not open the air vent on the tank. Why does it not run?","choices":["Without the vent open, fuel does not reach the carburettor","It has nothing to do with it","Because of the compass","Because of the antenna"],"hint":"Air must enter the tank.","ref":"p. 24 — outboard engine"},"sig1":{"q":"A person has fallen into the sea from the STARBOARD side. How do you turn the rudder?","choices":["Quickly to starboard — the stern swings to port so the propeller does not injure the person","To port","Straight ahead","Switch off the engine and do not touch the rudder"],"hint":"The stern (and propeller) moves away from the person.","ref":"p. 8 and 26 — man overboard"},"sig2":{"q":"From which side do you approach a person in the water?","choices":["From the leeward side — so that wind and current carry them to the boat","From the windward side","Straight at them at full speed","From the stern"],"hint":"So the wind does not push you onto them.","ref":"p. 26 — rescue"},"sig3":{"q":"At what angle do you sail into the waves?","choices":["Obliquely, 30°–60°","Perpendicular, 90°","Parallel, 0°","It makes no difference"],"hint":"Never perpendicular, so the bow does not pound.","ref":"p. 8 — sailing into waves"},"sig4":{"q":"How is a fire extinguished (basic principle)?","choices":["By cutting off the oxygen supply (foam, powder, CO2, wet blanket)","Add air","Pour petrol on it","Let it burn out"],"hint":"Burning is combining with oxygen.","ref":"p. 23 — fire"},"sig5":{"q":"Who is responsible for the load distribution and the number of persons on the boat?","choices":["The skipper — may take on board only as many as the Navigation Permit allows","Each passenger for themselves","The marina","The Harbour Master's Office (Lučka kapetanija)"],"hint":"He makes sure the boat does not list to one side.","ref":"p. 23 — stability"},"sig6":{"q":"Why do fuel tanks have baffles with small openings?","choices":["So that, when suddenly heeling, the fuel does not shift all at once to one side and endanger stability","To hold more fuel","For cooling","For filtering"],"hint":"Prevents sudden sloshing.","ref":"p. 23 — stability"},"sig7":{"q":"You have run aground with the bow. What are the first steps?","choices":["Move crew/cargo to the stern (lighten the bow) and reverse at full power","Jump into the sea","Accelerate forward","Call for help immediately without checking"],"hint":"First check for cracks in the hull.","ref":"p. 26 — grounding"},"sig8":{"q":"Sea water is entering through a crack in the hull. What is the improvised procedure?","choices":["Pull a piece of canvas/tablecloth with ropes from the outside over the damage — water pressure presses it against the hull","Close all windows","Speed up so the water flows out","Drop the anchor"],"hint":"Two people pull the canvas along the sides.","ref":"p. 26 — water ingress"},"sig9":{"q":"If the boat is unavoidably sinking, where is it better to sink?","choices":["In shallow water over a flat sandy bottom, in a sheltered bay","At the greatest depth","On a rocky bottom with strong currents","It makes no difference"],"hint":"Easier rescue and raising.","ref":"p. 26 — sinking"},"sig10":{"q":"Who may be on board during refuelling?","choices":["Only the skipper; the others go ashore","All passengers","Nobody","Only children"],"hint":"So that nobody lights a cigarette.","ref":"p. 23 — refuelling"},"sig11":{"q":"What is a boat hook (čaklja, 'mezomariner')?","choices":["A hook on a pole for pulling in/fishing things out of the sea and helping to get off a grounding","A type of anchor","A type of knot","A part of the engine"],"hint":"Always keep it at hand.","ref":"p. 26–27 — boat hook"},"sig12":{"q":"A man fell from the STARBOARD side; a colleague quickly turns the rudder to PORT. Correct?","choices":["No — turn to STARBOARD, so that the stern (and propeller) goes to port, away from the person","Yes, port is correct","It makes no difference","Go straight ahead"],"hint":"The propeller must move away from the person.","ref":"p. 8 and 26 — man overboard"},"sig13":{"q":"The bow keeps digging in and pounding on the waves because you sail perpendicular (90°). Is that safe, especially for a planing boat?","choices":["No — it is dangerous; a wave and a gust of wind can flip a lighter planing boat over backwards; sail obliquely at 30°–60°","Yes, perpendicular is the safest","It is safe only for planing boats","There is no difference"],"hint":"Obliquely to the waves, not perpendicular.","ref":"p. 8 — waves and planing boats"},"viz-wind-0":{"q":"The blue arrow shows where the wind comes FROM (blowing towards the boat). Which Adriatic wind is it?","choices":["Tramontana (N)","Bora (Bura, NE)","Levant (E)","Jugo (Scirocco, SE)"],"hint":"Look at which compass direction the arrow starts from.","ref":"p. 13 — Tramontana (N)"},"viz-wind-45":{"q":"The blue arrow shows where the wind comes FROM (blowing towards the boat). Which Adriatic wind is it?","choices":["Bora (Bura, NE)","Levant (E)","Jugo (Scirocco, SE)","Lebić (Garbin, SW)"],"hint":"Look at which compass direction the arrow starts from.","ref":"p. 16 — Bora (NE)"},"viz-wind-90":{"q":"The blue arrow shows where the wind comes FROM (blowing towards the boat). Which Adriatic wind is it?","choices":["Levant (E)","Jugo (Scirocco, SE)","Lebić (Garbin, SW)","Pulenat (W)"],"hint":"Look at which compass direction the arrow starts from.","ref":"p. 17 — Levant (E)"},"viz-wind-135":{"q":"The blue arrow shows where the wind comes FROM (blowing towards the boat). Which Adriatic wind is
