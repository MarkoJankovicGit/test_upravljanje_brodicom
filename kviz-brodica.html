<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boat Training Rovinj — Kviz za voditelja brodice A/B</title>
<meta name="theme-color" content="#0f1419">
<meta name="description" content="Interaktivna priprema za ispit za voditelja brodice kategorija A i B — Boat Training Rovinj.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* ===== Design tokeni (ui-ux-pro-max: Minimalism & Swiss; brend Boat Training Rovinj: crno + azur) ===== */
  :root{
    --brand:#159bd7; --brand-soft:#e8f4fb;
    --ink:#0f1419; --ink-2:#2b3640; --muted:#5b6670; --line:#e4e8eb; --line-2:#cfd6dc;
    --bg:#f5f7f8; --surface:#ffffff; --surface-2:#f0f3f5;
    --primary:#0b78b3; --primary-hover:#09689b; --on-primary:#ffffff;
    --ok:#13853f; --ok-bg:#e8f5ec; --bad:#c62828; --bad-bg:#fdecec; --warn:#7a5200; --warn-bg:#fff4dc;
    --radius:16px; --radius-sm:10px;
    --shadow:0 1px 2px rgba(15,20,25,.06),0 2px 8px rgba(15,20,25,.04);
    --shadow-lg:0 16px 40px rgba(15,20,25,.16);
    --font:'Plus Jakarta Sans',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --ease:cubic-bezier(.2,.7,.2,1); --t-fast:140ms; --t:220ms;
    --nav-h:64px;
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --brand:#3aaee6; --brand-soft:#11293a;
      --ink:#e6edf3; --ink-2:#c9d3dc; --muted:#9aa5af; --line:#262e36; --line-2:#3a444e;
      --bg:#0d1117; --surface:#151b22; --surface-2:#1c242d;
      --primary:#3aaee6; --primary-hover:#5cbdec; --on-primary:#04121b;
      --ok:#4cc77b; --ok-bg:#10281a; --bad:#ff7070; --bad-bg:#2c1515; --warn:#f0c060; --warn-bg:#2a2210;
      --shadow:0 1px 2px rgba(0,0,0,.4); --shadow-lg:0 16px 40px rgba(0,0,0,.55);
      color-scheme:dark;
    }
  }
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important}
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
  button,input,select{font:inherit;color:inherit}
  a{color:var(--primary)}
  .hidden{display:none !important}
  .muted{color:var(--muted)}
  .small{font-size:.875rem}
  .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  .skip{position:absolute;left:12px;top:-60px;z-index:100;background:var(--surface);padding:10px 14px;border-radius:10px;box-shadow:var(--shadow-lg)}
  .skip:focus{top:12px}
  :focus-visible{outline:3px solid var(--brand);outline-offset:2px}
  .ic{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .ic.sm{width:18px;height:18px}

  h1,h2,h3{margin:0;line-height:1.25;letter-spacing:-.01em}
  .h-xl{font-size:1.6rem;font-weight:800}
  .h-l{font-size:1.3rem;font-weight:800}
  .h-m{font-size:1.05rem;font-weight:700}
  .eyebrow{font-size:.8rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:0 0 4px}
  .sec{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:28px 2px 12px}
  .sec h3{font-size:1rem;font-weight:700}

  /* ===== Shell ===== */
  #app{min-height:100dvh}
  .sidebar{display:none}
  .topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:8px;min-height:56px;padding:8px 12px;
    background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .topbar h1{font-size:1.05rem;font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .topbar .logo-sm{width:32px;height:32px;border-radius:8px;margin-left:4px}
  .icon-btn{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:12px;border:none;background:transparent;cursor:pointer;color:var(--ink)}
  .icon-btn:hover{background:var(--surface-2)}
  .demo-badge{display:inline-flex;align-items:center;font-size:.7rem;font-weight:800;letter-spacing:.08em;padding:3px 8px;border-radius:999px;background:var(--warn-bg);color:var(--warn)}
  main#view{max-width:720px;margin:0 auto;padding:16px 16px calc(var(--nav-h) + 40px + env(safe-area-inset-bottom));outline:none}
  main#view.wide{max-width:1120px}
  main#view.bare{padding-bottom:40px}
  .bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;height:calc(var(--nav-h) + env(safe-area-inset-bottom));
    padding-bottom:env(safe-area-inset-bottom);background:var(--surface);border-top:1px solid var(--line)}
  .bottomnav a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-decoration:none;color:var(--muted);font-size:.75rem;font-weight:600;position:relative}
  .bottomnav a[aria-current=page]{color:var(--primary)}
  .bottomnav a[aria-current=page]::before{content:"";position:absolute;top:0;width:32px;height:3px;border-radius:0 0 3px 3px;background:var(--primary)}
  @media(min-width:1024px){
    #app.has-nav{display:grid;grid-template-columns:256px minmax(0,1fr)}
    #app.has-nav .sidebar{display:flex}
    #app.has-nav .bottomnav{display:none}
    #app.has-nav .topbar .logo-sm{display:none}
    main#view{padding:28px 32px 56px}
  }
  .sidebar{position:sticky;top:0;height:100dvh;flex-direction:column;gap:6px;padding:20px 14px;background:var(--surface);border-right:1px solid var(--line)}
  .side-brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}
  .side-brand img{width:40px;height:40px;border-radius:10px}
  .side-brand b{display:block;font-size:.95rem;line-height:1.2}
  .side-brand small{color:var(--muted);font-size:.78rem}
  .sidebar nav{display:flex;flex-direction:column;gap:2px}
  .sidebar nav a{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:10px;text-decoration:none;color:var(--ink-2);font-weight:600}
  .sidebar nav a:hover{background:var(--surface-2)}
  .sidebar nav a[aria-current=page]{background:var(--brand-soft);color:var(--primary)}
  .side-foot{margin-top:auto;border-top:1px solid var(--line);padding:14px 8px 0;font-size:.85rem}
  .side-foot .who{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* ===== Gumbi ===== */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:12px 18px;border-radius:12px;
    border:1px solid transparent;font-weight:700;font-size:1rem;cursor:pointer;text-decoration:none;
    transition:background var(--t-fast),border-color var(--t-fast),transform var(--t-fast)}
  .btn:active{transform:scale(.98)}
  .btn.primary{background:var(--primary);color:var(--on-primary)}
  .btn.primary:hover{background:var(--primary-hover)}
  .btn.secondary{background:var(--surface);border-color:var(--line-2);color:var(--ink)}
  .btn.secondary:hover{border-color:var(--ink-2)}
  .btn.ghost{background:transparent;color:var(--primary);padding-left:10px;padding-right:10px}
  .btn.ghost:hover{background:var(--brand-soft)}
  .btn.danger{background:var(--bad);color:#fff}
  .btn.danger-ghost{background:transparent;color:var(--bad)}
  .btn.danger-ghost:hover{background:var(--bad-bg)}
  .btn.block{width:100%}
  .btn.sm{min-height:36px;padding:7px 12px;font-size:.875rem;border-radius:9px}
  .btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
  .link{background:none;border:none;padding:8px 0;color:var(--primary);font-weight:700;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
  .link:hover{text-decoration:underline}

  /* ===== Kartice i liste ===== */
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
  .card + .card{margin-top:12px}
  .stack{display:flex;flex-direction:column;gap:12px}
  .row{display:flex;align-items:center;gap:12px}
  .between{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .list{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
  .list > li + li{border-top:1px solid var(--line)}
  .item{display:flex;align-items:center;gap:14px;width:100%;min-height:64px;padding:14px 16px;text-align:left;background:none;border:none;text-decoration:none;color:inherit;cursor:pointer}
  a.item:hover,button.item:hover{background:var(--surface-2)}
  .item .i-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
  .item .i-title{font-weight:700}
  .item .i-sub{font-size:.875rem;color:var(--muted)}
  .item .chev{color:var(--muted)}
  .i-ic{flex:none;width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:var(--brand-soft);color:var(--primary)}
  .i-ic.dark{background:var(--ink);color:var(--surface)}
  .pct{font-weight:800;font-variant-numeric:tabular-nums;color:var(--ink-2);font-size:.95rem}
  .bar{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden}
  .bar > i{display:block;height:100%;border-radius:99px;background:var(--brand);transition:width .5s var(--ease)}

  /* ===== Početna ===== */
  .hero-card{background:var(--ink);color:#fff;border-radius:20px;padding:22px 20px;position:relative;overflow:hidden}
  @media (prefers-color-scheme: dark){ .hero-card{background:#1b2a36} }
  .hero-card .eyebrow{color:#b9c6d0}
  .hero-card p{color:#c9d4dc;margin:8px 0 18px}
  .hero-card .btn.primary{background:var(--brand);color:#04121b}
  .hero-card .btn.primary:hover{background:#3aaee6}
  .hero-card .link{color:#9fd7f2}
  .hero-card .wave{position:absolute;right:-30px;bottom:-30px;width:180px;opacity:.12;pointer-events:none}
  .kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
  .kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 12px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
  .kpi b{font-size:1.35rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
  .kpi span{font-size:.78rem;color:var(--muted);font-weight:600}
  .kpi .ic{color:var(--brand)}
  .ring .ring-bg{stroke:var(--surface-2)} .ring .ring-fg{stroke:var(--brand);transition:stroke-dashoffset .8s var(--ease)}
  .ring text{fill:var(--ink);font-weight:800;font-family:var(--font)}
  .steps{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:14px}
  .steps li{display:flex;gap:12px}
  .steps .n{flex:none;width:28px;height:28px;border-radius:50%;background:var(--brand-soft);color:var(--primary);font-weight:800;display:flex;align-items:center;justify-content:center;font-size:.85rem}
  .steps b{display:block} .steps p{margin:2px 0 0;font-size:.9rem;color:var(--muted)}

  /* ===== Vježba ===== */
  .boxes{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:16px 0 8px}
  .box{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 2px;border-radius:12px;background:var(--surface-2)}
  .box b{font-size:1.15rem;font-weight:800;font-variant-numeric:tabular-nums}
  .box span{font-size:.7rem;color:var(--muted);font-weight:600}
  .box.b1{background:var(--bad-bg)} .box.b1 b{color:var(--bad)}
  .box.b5{background:var(--ok-bg)} .box.b5 b{color:var(--ok)}
  .tiles{display:grid;gap:10px}
  @media(min-width:640px){.tiles{grid-template-columns:repeat(3,1fr)}}
  .tile{display:flex;align-items:center;gap:14px;text-align:left;padding:16px;border-radius:var(--radius);background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);cursor:pointer;color:inherit}
  .tile:hover{border-color:var(--brand)}
  @media(min-width:640px){.tile{flex-direction:column;align-items:flex-start}}
  .tile .t-txt{display:flex;flex-direction:column;gap:3px;min-width:0}
  .tile b{font-size:1rem}
  .tile small{color:var(--muted);font-size:.85rem;line-height:1.4}
  .tile .t-meta{font-size:.78rem;font-weight:700;color:var(--primary);margin-top:2px}

  /* ===== Složi vježbu ===== */
  .setting{display:flex;align-items:center;gap:14px;min-height:72px;padding:14px 16px;text-decoration:none;color:inherit}
  a.setting:hover{background:var(--surface-2)}
  .setting .s-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
  .s-label{font-size:.8rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
  .s-val{font-weight:700;font-size:1rem}
  .s-val.warn{color:var(--bad)}
  .setting.col{flex-direction:column;align-items:stretch;gap:10px}
  .seg{display:flex;gap:4px;padding:4px;border-radius:12px;background:var(--surface-2)}
  .seg button{flex:1;min-height:44px;border:none;background:transparent;border-radius:9px;font-weight:700;cursor:pointer;color:var(--ink-2)}
  .seg button[aria-pressed=true]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
  .sticky-cta{position:sticky;bottom:calc(var(--nav-h) + 12px + env(safe-area-inset-bottom));z-index:20;margin-top:16px;display:flex;align-items:center;gap:14px;
    padding:12px 12px 12px 16px;border-radius:16px;background:var(--surface);border:1px solid var(--line-2);box-shadow:var(--shadow-lg)}
  @media(min-width:1024px){.sticky-cta{bottom:16px}}
  .sticky-cta .sum{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.35}
  .sticky-cta .sum b{font-size:1rem}
  .sticky-cta .sum span{font-size:.85rem;color:var(--muted)}
  .sticky-cta .sum span.warn{color:var(--bad);font-weight:600}
  .check-row{display:flex;align-items:center;gap:14px;min-height:60px;padding:12px 16px;cursor:pointer}
  .check-row:hover{background:var(--surface-2)}
  .check-row input{width:22px;height:22px;accent-color:var(--primary);flex:none;cursor:pointer}
  .check-row .c-txt{flex:1;min-width:0;display:flex;flex-direction:column}
  .check-row .c-title{font-weight:600}
  .check-row .c-sub{font-size:.85rem;color:var(--muted)}
  .check-row .c-cnt{font-size:.85rem;color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums}
  .grp-head{background:var(--surface-2)}
  .grp-head .c-title{font-weight:800}
  .toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 2px 12px}

  /* ===== Lekcija ===== */
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip-btn{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:8px 14px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);font-weight:600;cursor:pointer;font-size:.9rem}
  .chip-btn[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
  .chip-btn em{font-style:normal;opacity:.7;font-size:.8rem}

  /* ===== Kviz ===== */
  .quiz-top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;padding:8px 4px;background:var(--bg)}
  .quiz-top .bar{flex:1;height:8px}
  .qt-count{font-size:.875rem;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums;min-width:48px;text-align:right}
  .q-meta{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
  .tag{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--brand-soft);color:var(--primary);font-size:.8rem;font-weight:700}
  .score{font-size:.85rem;font-weight:700;color:var(--muted)}
  .qtext{font-size:1.2rem;font-weight:700;line-height:1.4;margin:14px 0 16px}
  .qvisual{display:flex;justify-content:center;margin:0 0 18px}
  .qvisual:empty{display:none}
  .qvisual svg{max-width:100%;height:auto;background:#f6fafc;border:1px solid var(--line);border-radius:14px;padding:8px}
  #qInput input{width:100%;min-height:52px;padding:12px 14px;font-weight:600;border:1.5px solid var(--line-2);border-radius:12px;background:var(--surface)}
  #qInput input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--brand-soft)}
  .choices{display:flex;flex-direction:column;gap:10px}
  .choice{display:flex;align-items:flex-start;gap:12px;width:100%;min-height:56px;padding:14px;text-align:left;border-radius:12px;border:1.5px solid var(--line-2);background:var(--surface);font-weight:600;line-height:1.4;cursor:pointer;transition:border-color var(--t-fast),background var(--t-fast)}
  .choice:hover:not([disabled]){border-color:var(--primary);background:var(--brand-soft)}
  .choice .mk{flex:none;display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:8px;background:var(--surface-2);font-weight:800;font-size:.85rem}
  .choice.correct{border-color:var(--ok);background:var(--ok-bg)}
  .choice.correct .mk{background:var(--ok);color:#fff}
  .choice.wrong{border-color:var(--bad);background:var(--bad-bg)}
  .choice.wrong .mk{background:var(--bad);color:#fff}
  .choice[disabled]{cursor:default}
  .choice[disabled]:not(.correct):not(.wrong){opacity:.55}
  .feedback{margin-top:14px;padding:14px;border-radius:12px;border-left:4px solid var(--line-2);background:var(--surface-2);animation:fadeUp var(--t) var(--ease)}
  .feedback.ok{border-color:var(--ok);background:var(--ok-bg)}
  .feedback.bad{border-color:var(--bad);background:var(--bad-bg)}
  .feedback .ans{margin-top:6px}
  .feedback .ref{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:.85rem;color:var(--muted);font-weight:600}
  .notebox,.hintbox{margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--warn-bg);color:var(--warn);font-weight:600;font-size:.95rem;animation:fadeUp var(--t) var(--ease)}
  .selfrow{display:flex;gap:10px;margin-top:12px}
  .selfrow .btn{flex:1}
  .actionbar{position:sticky;bottom:0;z-index:20;display:flex;gap:10px;margin:16px -16px 0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid var(--line)}
  .actionbar .btn{flex:1}
  @media(min-width:720px){.actionbar{margin:16px 0 0;border:none;padding:12px 0}}

  /* ===== Rezultat / statistika ===== */
  .result-head{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:12px 0 4px}
  .stat-row{display:flex;flex-direction:column;gap:8px;padding:14px 16px}
  .stat-row .between b{font-weight:700}

  /* ===== Prijava ===== */
  .login{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
  .login-card{width:100%;max-width:420px}
  .login-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin:0 0 20px}
  .login-logo{display:block;width:72px;height:72px;border-radius:16px;box-shadow:var(--shadow)}
  .lang-seg{width:auto}
  .lang-seg button{min-height:40px;min-width:48px;padding:0 10px;font-size:.85rem}
  .login h1{font-size:1.6rem;font-weight:800}
  .login .lead{color:var(--muted);margin:6px 0 24px}
  .field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
  .field label,.field .lbl{font-weight:700;font-size:.9rem}
  .field small{color:var(--muted);font-size:.82rem}
  .input{width:100%;min-height:48px;padding:11px 14px;border:1.5px solid var(--line-2);border-radius:12px;background:var(--surface);font-size:1rem}
  .input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--brand-soft)}
  select.input{cursor:pointer}
  .pw{position:relative}
  .pw .input{padding-right:52px}
  .pw .icon-btn{position:absolute;right:2px;top:2px}
  .alert{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:var(--bad-bg);color:var(--bad);font-weight:600;font-size:.92rem;margin-bottom:16px}
  .alert.ok{background:var(--ok-bg);color:var(--ok)}
  .demo{margin-top:24px;padding-top:16px;border-top:1px dashed var(--line-2)}
  .demo summary{cursor:pointer;font-weight:700;font-size:.9rem;display:flex;align-items:center;gap:8px;list-style:none}
  .demo summary::-webkit-details-marker{display:none}
  .demo .row{margin-top:12px}

  /* ===== Admin ===== */
  .page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:16px}
  .filters{display:grid;gap:10px;grid-template-columns:1fr;margin-bottom:12px}
  @media(min-width:720px){.filters{grid-template-columns:2fr 1fr 1fr}}
  .filters .input{min-height:44px}
  .search{position:relative}
  .search .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
  .search .input{padding-left:42px}
  .bulkbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;margin-bottom:12px;border-radius:12px;background:var(--brand-soft);font-weight:700}
  .bulkbar .spacer{flex:1}
  .table-wrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
  .tbl{width:100%;border-collapse:collapse;font-size:.92rem}
  .tbl th{text-align:left;font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;padding:12px 14px;background:var(--surface-2);border-bottom:1px solid var(--line)}
  .tbl td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
  .tbl tr:last-child td{border-bottom:none}
  .tbl tr.is-off td{background:color-mix(in srgb,var(--bad-bg) 55%,transparent)}
  .tbl tr.is-sel td{background:var(--brand-soft)}
  .tbl .cb{width:44px}
  .tbl input[type=checkbox]{width:20px;height:20px;accent-color:var(--primary);cursor:pointer}
  .tbl .num{font-variant-numeric:tabular-nums;white-space:nowrap}
  .u-name{font-weight:700}
  .u-mail{color:var(--muted);font-size:.85rem;overflow-wrap:anywhere}
  .acts{display:flex;gap:4px;justify-content:flex-end;flex-wrap:wrap}
  .badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:.78rem;font-weight:700;white-space:nowrap;background:var(--surface-2);color:var(--ink-2)}
  .badge.ok{background:var(--ok-bg);color:var(--ok)} .badge.bad{background:var(--bad-bg);color:var(--bad)} .badge.brand{background:var(--brand-soft);color:var(--primary)}
  .badge .ic{width:14px;height:14px}
  .empty{padding:36px 16px;text-align:center;color:var(--muted)}
  .empty .ic{width:36px;height:36px;margin-bottom:8px;color:var(--line-2)}
  @media(max-width:760px){
    .tbl thead{display:none}
    .tbl,.tbl tbody,.tbl tr,.tbl td{display:block;width:100%}
    .tbl tr{position:relative;padding:12px 14px 12px 52px;border-bottom:1px solid var(--line)}
    .tbl tr:last-child{border-bottom:none}
    .tbl td{border:none;padding:3px 0}
    .tbl td[data-label]::before{content:attr(data-label) ": ";color:var(--muted);font-size:.82rem}
    .tbl td.cb{position:absolute;left:14px;top:14px;width:auto;padding:0}
    .tbl td.main::before{content:none}
    .acts{justify-content:flex-start;margin-top:8px}
    .tbl.no-cb tr{padding-left:14px}
  }

  /* ===== Dijalog i toast ===== */
  dialog{width:min(480px,calc(100% - 32px));border:none;border-radius:20px;padding:0;background:var(--surface);color:var(--ink);box-shadow:var(--shadow-lg)}
  dialog::backdrop{background:rgba(15,20,25,.45);backdrop-filter:blur(2px)}
  dialog[open]{animation:pop var(--t) var(--ease)}
  .dlg-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 20px 0}
  .dlg-head h2{font-size:1.15rem;font-weight:800}
  .dlg-body{padding:16px 20px}
  .dlg-foot{display:flex;gap:10px;justify-content:flex-end;padding:0 20px 20px;flex-wrap:wrap}
  .creds{background:var(--surface-2);border-radius:12px;padding:14px;font-size:.95rem;line-height:1.8;overflow-wrap:anywhere}
  .creds code{font-family:ui-monospace,Consolas,monospace;font-weight:700}
  #toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 20px + env(safe-area-inset-bottom));z-index:60;display:flex;flex-direction:column;gap:8px;width:min(420px,calc(100% - 32px))}
  @media(min-width:1024px){#toasts{bottom:24px}}
  .toast{display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:12px;background:var(--ink);color:var(--surface);font-weight:600;box-shadow:var(--shadow-lg);animation:fadeUp var(--t) var(--ease)}

  @keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  @keyframes pop{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
  .view-enter{animation:fadeUp var(--t) var(--ease)}
</style>

function t(key,params){
  let v=I18N_UI[L()][key]; if(v==null) v=I18N_UI.hr[key]; if(v==null) return key;
  if(Array.isArray(v)) v=v[0];
  if(params) v=v.replace(/\{(\w+)\}/g,(m,k)=>params[k]!=null?params[k]:m);
  return v;
}
function tp(key,n){
  let v=I18N_UI[L()][key]; if(v==null) v=I18N_UI.hr[key]; if(!Array.isArray(v)) return String(v||key);
  const lg=L(), a=n%10, b=n%100;
  const i=lg==='hr'?(a===1&&b!==11?0:(a>=2&&a<=4&&(b<12||b>14))?1:2):(n===1?0:1);
  return v[Math.min(i,v.length-1)];
}
function setLang(lg){ try{ localStorage.setItem('btr_lang',lg); }catch(e){} location.reload(); }

{id:"kurs-n2",topic:"kurs",level:"napr",q:"Što je ukupna korektura (uk)?",choices:["Zbroj devijacije i varijacije; uk = Kp − Kk","Samo varijacija","Samo devijacija","Brzina broda"],hint:"Objedinjuje obje 'laži' kompasa.",ref:"str. 49 — ukupna korektura"},
{id:"kurs-n3",topic:"kurs",level:"napr",q:"Kako se računa azimut pravi iz DESNOG pramčanog kuta (Ld)?",choices:["ωp = Kp + Ld","ωp = Kp − Ld","ωp = Ld − Kp","ωp = Kp × Ld"],hint:"Za lijevi kut (Ll) se oduzima.",ref:"str. 49 — ωp = Kp + Ld"},
{id:"kurs-n4",topic:"kurs",level:"napr",q:"Što je subočica?",choices:["Kad je objekt pod kutom 90° u odnosu na kurs (bokom uz)","Kad je objekt na pramcu","Kad je objekt na krmi","Kut od 45°"],hint:"Prolazak 'bokom uz' rt ili svjetionik.",ref:"str. 50 — subočica"},
{id:"kurs-n5",topic:"kurs",level:"napr",q:"Zašto je pouzdaniji kompas s ružom promjera najmanje 20 cm?",choices:["Radi točnijeg očitavanja (mali kompasi imaju podjelu od 5°)","Jer je teži","Jer se sporije okreće","Jer ne treba tekućinu"],hint:"Na maloj ruži ne pročitaš pola stupnja.",ref:"str. 34 — veličina ruže"},
/* ---- KURS: triki ---- */
{id:"kurs-t1",topic:"kurs",level:"trik",q:"Kompas uvijek pokazuje točan geografski sjever?",choices:["Ne — 'laže' zbog varijacije (magnetski pol) i devijacije (željezo/EM polja)","Da, uvijek","Samo noću laže","Laže samo na jugu"],hint:"Zato postoje tri vrste kursa.",ref:"str. 14 i 32 — varijacija/devijacija"},
{id:"kurs-t2",topic:"kurs",level:"trik",q:"Smjerao si tri objekta i dobio mali trokut, ne točku. Zašto?",choices:["Jer nisi smjerao istovremeno — brodica se kretala između smjeranja","Kompas je pokvaren","Karta je stara","Tri objekta uvijek daju trokut greške"],hint:"Manji trokut = veća točnost.",ref:"str. 34 — trokut pozicije"},
{id:"kurs-t3",topic:"kurs",level:"trik",q:"Ploviš niz struju i valove, a kormilo slabo 'sluša'. Zašto?",choices:["Moraš biti brži od struje/valova da voda djeluje na list kormila","Kormilo je premalo","Motor je preslab uvijek","Kompas smeta"],hint:"Kormilo radi na strujanje vode oko lista.",ref:"str. 8 i 47 — kormilarenje"},
/* ---- SVJETIONICI: napredna/triki (ritam svjetla) ---- */
{id:"svj-n1",topic:"svjet",level:"napr",q:"Koliko bljeskova u grupi ima ISTOČNA kardinalna oznaka (prema IALA prilogu)?",choices:["3 bljeska","6 bljeskova","9 bljeskova","Neprekidno"],hint:"Istok — sat pokazuje 3.",ref:"str. 55 — IALA svjetla"},
{id:"svj-n2",topic:"svjet",level:"napr",q:"Kako se očituje JUŽNA kardinalna oznaka?",choices:["6 bljeskova + jedan dugi bljesak","3 bljeska","9 bljeskova","Neprekidno bijelo"],hint:"6 + dugi.",ref:"str. 55 — IALA svjetla"},
{id:"svj-n3",topic:"svjet",level:"napr",q:"Koliko bljeskova ima ZAPADNA kardinalna oznaka?",choices:["9 bljeskova","3 bljeska","6 bljeskova","1 bljesak"],hint:"Zapad — najviše, 9.",ref:"str. 55 — IALA svjetla"},
{id:"svj-t1",topic:"svjet",level:"trik",q:"'Bl 3' i 'Bl 9' su svejedno — samo bljeskanje?",choices:["Ne — 3 bljeska = istok, 9 bljeskova = zapad; broj nosi značenje strane","Da, broj nije bitan","Bitna je samo boja","Oba znače sjever"],hint:"Broj bljeskova = koja kardinalna strana.",ref:"str. 55 — IALA svjetla"},
{id:"svj-t2",topic:"svjet",level:"trik",q:"Plutača bez svjetla ne znači ništa i može se zanemariti?",choices:["Ne — obojana je bojom ili ima dnevni znak koji nosi značenje","Da, bez svjetla je nevažna","Znači samo sidrište","Znači kraj plovnog puta"],hint:"Pazi na boju i oblik.",ref:"str. 37 — oznake bez svjetla"},
/* ---- SIDRENJE: napredna ---- */
{id:"sid-n1",topic:"sidro",level:"napr",q:"Sidro je zapelo pod stijenu i ne izlazi. Postupak?",choices:["Zavoziti u suprotnom smjeru od sidrenja; ako ne ide, spustiti metalni obruč 'kolač' niz sidrenjak","Presjeći konop odmah","Povlačiti okomito prema gore","Ostaviti ga"],hint:"Prvo obrni smjer vuče.",ref:"str. 10 — vađenje zapelog sidra"},
{id:"sid-n2",topic:"sidro",level:"napr",q:"Bočni privez uz jak vjetar koji puše od pristana. Kako vežeš?",choices:["Četverovezom (springom): iz pramca cima naprijed i nazad, iz krme naprijed i nazad","Jednim konopom s pramca","Samo sidrom","Bez konopa"],hint:"Četiri konopa — ako jedan pukne, ostaju tri.",ref:"str. 11 — spring/četverovez"},
{id:"sid-n3",topic:"sidro",level:"napr",q:"Kolika je masa GLAVNOG sidra za brodicu duljine 10 m (tablica)?",choices:["13 kg","9 kg","27 kg","5 kg"],hint:"7 m → 9 kg; 10 m → …",ref:"str. 29 — Tablica 4.1.1-1"},
{id:"sid-n4",topic:"sidro",level:"napr",q:"Zašto do sidra stavljamo predlanac (3–4 m lanca)?",choices:["Ne proglodava se na oštroj stijeni i svojom težinom povlači brodicu od obale","Da je lakše","Da svijetli","Da bude kraće"],hint:"Kad val nosi brodicu, prvo mora podići lanac s dna.",ref:"str. 10 — predlanac"},
/* ---- SIDRENJE: triki ---- */
{id:"sid-t1",topic:"sidro",level:"trik",q:"Držiš sidro odmah ispod brodice da 'bolje drži'. Ispravno?",choices:["Ne — sidrenjak mora biti bar 4× dubine; preblizu se sidro izdiže okomito i ne ukopava","Da, tako drži najbolje","Da, ako je plitko","Svejedno je"],hint:"Što dalje potopljeno — bolje se ukopava.",ref:"str. 10 — pravilo 4×"},
{id:"sid-t2",topic:"sidro",level:"trik",q:"Za brodicu od 15 m dovoljno je glavno sidro od 13 kg?",choices:["Ne — za 15 m je 27 kg; 13 kg je za 10 m","Da","Dovoljno je 9 kg","Masa nije bitna"],hint:"Provjeri tablicu, raste s duljinom.",ref:"str. 29 — Tablica 4.1.1-1"},
{id:"sid-t3",topic:"sidro",level:"trik",q:"Kao sidrenjak može poslužiti i plivajući (plutajući) konop?",choices:["Ne — plivajući konop može pokupiti brodski vijak i namotati na osovinu","Da, čak je bolji","Da, ako je tanak","Samo noću ne"],hint:"Opasnost za vijak/osovinu.",ref:"str. 12 — konopi"},
/* ---- KARDINALNE/LATERALNE: napredna/triki (bez slike) ---- */
{id:"ozn-n1",topic:"oznake",level:"napr",q:"Kako izgleda oznaka SIGURNIH voda?",choices:["Crveno-bijele okomite pruge (kugla kao vrhovni znak)","Žuta s križem","Crna s crvenim pojasom","Potpuno zelena"],hint:"Crveno-bijelo = sredina sigurnog kanala.",ref:"str. 55 — sigurne vode"},
{id:"ozn-n2",topic:"oznake",level:"napr",q:"Kako izgleda oznaka USAMLJENE opasnosti?",choices:["Crna s crvenim pojasom (dvije crne kugle kao vrhovni znak)","Žuta","Crveno-bijela","Samo zelena"],hint:"Postavlja se IZNAD same opasnosti.",ref:"str. 55 — usamljena opasnost"},
{id:"ozn-t1",topic:"oznake",level:"trik",q:"Vidiš žutu plutaču s križem 'X'. To je opasnost?",choices:["Ne — to je POSEBNA oznaka (npr. kabeli, zone, vojne vježbe)","Da, opasna hrid","Da, usamljena opasnost","Sjeverna kardinalna"],hint:"Žuto + X = posebno područje.",ref:"str. 55 — posebne oznake"},
{id:"ozn-t2",topic:"oznake",level:"trik",q:"U zoni A oznaka lijeve strane je zelena?",choices:["Ne — lijeva je CRVENA, desna je zelena","Da","Obje su žute","Lijeva je crna"],hint:"Jadran je zona A.",ref:"str. 55 — lateralne oznake"},
/* ---- OPREMA/DOKUMENTACIJA: napredna ---- */
{id:"opr-n1",topic:"oprema",level:"napr",q:"Što obuhvaća područje plovidbe II?",choices:["Međunarodnu plovidbu Jadranskim morem","Sva mora svijeta","Samo luke i rijeke","Do 1 NM od obale"],hint:"Između I (sva mora) i III (teritorijalno).",ref:"str. 3 — područja plovidbe"},
{id:"opr-n2",topic:"oprema",level:"napr",q:"Zašto brodice od stakloplastike moraju nositi radar-reflektor?",choices:["Jer slabo reflektiraju (upijaju) radarsku jeku pa ih drugi teško vide","Zbog groma","Za bolji GPS","Zbog kompasa"],hint:"Reflektor je od aluminija, pojačava jeku.",ref:"str. 51 — radar-reflektor"},
{id:"opr-n3",topic:"oprema",level:"napr",q:"Koliko traje izobrazba za kategoriju C?",choices:["25 + 6 školskih sati, u trajanju od 4 dana","Jedan dan","Godinu dana","Samo ispit"],hint:"Traži i zdravstvene uvjete.",ref:"str. 2 — kategorija C"},
{id:"opr-n4",topic:"oprema",level:"napr",q:"Od koliko se predmeta sastoji program ispita za kategoriju B?",choices:["Pet predmeta","Tri predmeta","Deset predmeta","Jedan predmet"],hint:"Navigacija, motoristika, pomorstvo/propisi/meteo, manevriranje/sigurnost/prva pomoć, radiotelefonija.",ref:"str. 2 — program ispita"},
/* ---- OPREMA/DOKUMENTACIJA: triki ---- */
{id:"opr-t1",topic:"oprema",level:"trik",q:"Za brodicu snage 20 kW dovoljna je kategorija A?",choices:["Ne — snaga veća od 15 kW traži 18 godina i kategoriju B","Da","Da, uz 16 godina","Dovoljna je i bez uvjerenja"],hint:"Kat. A ide do 15 kW i 7 m.",ref:"str. 2–3 — ovlasti"},
{id:"opr-t2",topic:"oprema",level:"trik",q:"Područje IIIb seže do 6 NM od obale?",choices:["Ne — IIIb je do 3 NM (IIIa je 6, IIIc je 1)","Da","IIIb je do 12 NM","IIIb je do 1 NM"],hint:"a=6, b=3, c=1.",ref:"str. 3 — područja plovidbe"},
{id:"opr-t3",topic:"oprema",level:"trik",q:"Prsluk za spašavanje treba samo voditelj brodice?",choices:["Ne — za SVE osobe na brodici (odrasle i djecu)","Da, samo voditelj","Samo za djecu","Nije obvezan"],hint:"Za vrijeme plovidbe, svima.",ref:"str. 27 — sredstva za spašavanje"},
/* ---- VJETROVI: napredna ---- */
{id:"vje-n1",topic:"vjetar",level:"napr",q:"Kada je bura obično najjača tijekom dana?",choices:["Oko 10 h te između 18 i 22 h","U podne","U zoru","Oko ponoći stalno"],hint:"Oslabi oko podneva i ponoći (prilika za bijeg).",ref:"str. 16 — Bura"},
{id:"vje-n2",topic:"vjetar",level:"napr",q:"Koliko dana zna trajati bura zimi?",choices:["3 do 7 dana","Najviše 1 dan","2 tjedna","Nikad više od 6 sati"],hint:"Ljeti katkad samo ~2 dana.",ref:"str. 16 — Bura"},
{id:"vje-n3",topic:"vjetar",level:"napr",q:"Koji su predznaci nadolaska juga?",choices:["Mutan/maglovit obzor, jake rose, veće plime, tlak ispod 1000 hPa","Vedro nebo i visok tlak","Bura s vrhova planina","Nagli pad temperature"],hint:"Jugo natiskuje more prema sjeveru (veće plime).",ref:"str. 17 — Jugo, predznaci"},
{id:"vje-n4",topic:"vjetar",level:"napr",q:"Koji je predznak lebića (garbina)?",choices:["Ekstremno visoka plima, niska pruga magle na JZ i nagli pad tlaka","Vedrina i maestral","Kape oblaka nad Velebitom","Jutarnja bonaca"],hint:"Ulazimo u područje nevera i oluja.",ref:"str. 17 — Lebić"},
{id:"vje-n5",topic:"vjetar",level:"napr",q:"Kako se zove jači prvi maestral nakon lošeg vremena?",choices:["Maeštralun (osobito u Hvarskom kanalu)","Burin","Levant","Neverin"],hint:"Pojavi se kad ima prostora da se razmaše.",ref:"str. 18 — Maestral"},
{id:"vje-n6",topic:"vjetar",level:"napr",q:"Kakva je ANTICIKLONALNA (vedra) bura?",choices:["Suha, s izrazitim udarima; 'praši' vodenu prašinu","Topla i vlažna, s kišom","Bez udara, ujednačena","Uvijek noćna"],hint:"Za razliku od ciklonalne (trule) bure.",ref:"str. 16 — tipovi bure"},
{id:"vje-n7",topic:"vjetar",level:"napr",q:"Tko objavljuje pomorsku vremensku prognozu za nautičare?",choices:["Pomorski meteorološki centar Split","Lučka kapetanija Pula","HAK","Plovput"],hint:"Izvješće za pomorce.",ref:"str. 18 — prognoze"},
/* ---- VJETROVI: triki ---- */
{id:"vje-t1",topic:"vjetar",level:"trik",q:"Jugo, kao i bura, dolazi iznenada punom snagom?",choices:["Ne — jugo se razvija POSTEPENO (jača kroz dane); bura dolazi naglo","Da, oba naglo","Jugo je uvijek slabo","Jugo puše samo noću"],hint:"Prvi dan slabo, treći 'valja'.",ref:"str. 16–17 — Jugo vs Bura"},
{id:"vje-t2",topic:"vjetar",level:"trik",q:"Maestral je opasan olujni vjetar kojeg se treba čuvati?",choices:["Ne — maestral je vjetar LIJEPOG vremena; olujni su lebić, pulenat i nevera","Da, orkanski je","Da, donosi buru","Da, diže valove do 5 m"],hint:"Najdraži vjetar nautičarima.",ref:"str. 18 — Maestral"},
{id:"vje-t3",topic:"vjetar",level:"trik",q:"Pijavica ide ravno na tebe i ne možeš pobjeći. Najbolji potez?",choices:["Ući što bržom brzinom u njeno središte — tamo je potpuna bonaca","Stati i čekati","Baciti sidro","Ploviti okomito na nju sporo"],hint:"Središte vrtloga je mirno.",ref:"str. 18 — Pijavica"},
{id:"vje-t4",topic:"vjetar",level:"trik",q:"Cb (kumulonimbus) u obliku nakovnja najavljuje lijepo vrijeme?",choices:["Ne — donosi jak pljusak, grmljavinu, oluju/neveru","Da, znak je vedrine","Znači maestral","Znači kraj kiše"],hint:"Cu (pamučasti) je lijepo vrijeme, Cb nije.",ref:"str. 16 — oblaci"},
/* ---- ZVUČNI SIGNALI: napredna ---- */
{id:"zvu-n1",topic:"zvuk",level:"napr",q:"Brod na mehanički pogon PLOVI daje 1 dugi. A brod koji plovi ali se NE kreće kroz vodu?",choices:["Dva duga zvuka","Jedan dugi","Tri kratka","Četiri kratka"],hint:"Jedan dugi više.",ref:"str. 40 — magla"},
{id:"zvu-n2",topic:"zvuk",level:"napr",q:"Je li u uskim kanalima i tjesnacima u pravilu dopušteno preticanje?",choices:["Nije — traži se dopuštenje propisanim signalima","Da, uvijek","Samo noću","Samo jedrilicama"],hint:"Pitaš signalima 2 duga + kratki.",ref:"str. 40 — preticanje"},
{id:"zvu-n3",topic:"zvuk",level:"napr",q:"Što se preporuča uz zvučne signale kod preticanja?",choices:["VHF kanal 16 i svjetlo","Sirena za maglu","Rakete","Zvono"],hint:"Dodatna komunikacija radi sigurnosti.",ref:"str. 40 — preticanje"},
/* ---- ZVUČNI SIGNALI: triki ---- */
{id:"zvu-t1",topic:"zvuk",level:"trik",q:"U magli čuješ 1 dugi + 2 kratka — misliš da je peljar?",choices:["Ne — peljar je 4 kratka; 1 dugi + 2 kratka je jedrilica/ribar/tegljač/ograničeni brod","Da, to je peljar","To je usidreni brod","To je promjena kursa"],hint:"Peljar = četiri kratka.",ref:"str. 40 — magla"},
{id:"zvu-t2",topic:"zvuk",level:"trik",q:"Usidreni i nasukani brod daju potpuno isti signal u magli?",choices:["Ne — nasukani DODATNO daje tri odvojena udarca zvonom prije i poslije brze zvonjave","Da, isti su","Nasukani koristi sirenu","Nasukani šuti"],hint:"Nasukani = usidreni + 3 udarca.",ref:"str. 40 — nasukani brod"},
{id:"zvu-t3",topic:"zvuk",level:"trik",q:"Pet kratkih signala znači 'skrećem lijevo pet puta'?",choices:["Ne — to je signal upozorenja/sumnje (ne razumiju se namjere drugog broda)","Da","Znači vožnju krmom","Znači sidrenje"],hint:"Sumnja, ne manevar.",ref:"str. 39 — zvučni signali"},
/* ---- IZBJEGAVANJE SUDARA: napredna ---- */
{id:"sud-n1",topic:"sudar",level:"napr",q:"Jedrilica A pretiče jedrilicu B, vjetar po krmi, jedra su joj po LIJEVOM boku. S koje strane pretiče?",choices:["Po DESNOM boku","Po lijevom boku","Ravno preko krme","Ne smije pretjecati"],hint:"Jedra lijevo → pretiče desno (i obrnuto).",ref:"str. 38 — preticanje jedrilica"},
{id:"sud-n2",topic:"sudar",level:"napr",q:"Dvije jedrilice imaju vjetar po LIJEVOM boku. Tko ima prednost?",choices:["Ona u zavjetrini (druga je u privjetrini)","Ona u privjetrini","Veća jedrilica","Brža jedrilica"],hint:"Zavjetrina = zaklonjena strana.",ref:"str. 38 — jedrilice"},
{id:"sud-n3",topic:"sudar",level:"napr",q:"Kako ulaziš u luku pored lukobrana?",choices:["U širem luku, primjereno udaljeno, da vidiš izlaz i izbjegneš onoga tko izlazi","Što bliže rubu lukobrana","Punom brzinom","Uvijek prvi, bez gledanja"],hint:"Prednost ima onaj tko izlazi.",ref:"str. 46 — red u lukama"},
/* ---- IZBJEGAVANJE SUDARA: triki ---- */
{id:"sud-t1",topic:"sudar",level:"trik",q:"Motorna brodica ima prednost pred jedrilicom jer je brža i okretnija?",choices:["Ne — jedrilica (na jedra) ima prednost zbog manje manevarske sposobnosti","Da, motor je jači","Da, ako je veća","Ovisi o brzini"],hint:"Motor ustupa jedrima.",ref:"str. 38 — prednost jedrilice"},
{id:"sud-t2",topic:"sudar",level:"trik",q:"Pri ukrštanju kurseva prednost ima brodica koja dolazi s LIJEVE strane?",choices:["Ne — prednost ima ona s DESNE strane","Da, lijeva ima prednost","Prednost ima brža","Nema pravila"],hint:"Pravilo desne strane.",ref:"str. 38 — ukrštanje"},
{id:"sud-t3",topic:"sudar",level:"trik",q:"Imaš prednost, ali drugi ti ne ustupa. Forsiraš svoje pravo do kraja?",choices:["Ne — cilj je izbjeći sudar; po potrebi kompromisno rješenje","Da, prednost je prednost","Da, ubrzaj i prođi","Da, i signaliziraj bijesno"],hint:"Sigurnost prije 'prava'.",ref:"str. 38 — kompromis"},
/* ---- SVJETLA BRODA: napredna ---- */
{id:"svl-n1",topic:"svjetla",level:"napr",q:"Koliko bijelih jarbolnih svjetala nosi brod dulji od 50 m?",choices:["Dva","Jedno","Tri","Nijedno"],hint:"Duži brod = dva bijela u nizu.",ref:"str. 53 — brod dulji od 50 m"},
{id:"svl-n2",topic:"svjetla",level:"napr",q:"Kakav DNEVNI znak ističe usidreni brod?",choices:["Crnu kuglu (na pramcu)","Tri crne kugle","Crni valjak","Dva stošca"],hint:"Danju kugla, noću bijelo kružno svjetlo.",ref:"str. 41 — dnevni znakovi"},
{id:"svl-n3",topic:"svjetla",level:"napr",q:"Koji DNEVNI znak nosi nasukani brod (dulji od 50 m)?",choices:["Tri crne kugle (okomito)","Jednu kuglu","Crni romb","Crni valjak"],hint:"Tri kugle = nasukan.",ref:"str. 41 — dnevni znakovi"},
{id:"svl-n4",topic:"svjetla",level:"napr",q:"Koji DNEVNI znak nosi brod nesposoban za manevar / u kvaru?",choices:["Dvije crne kugle","Jednu kuglu","Tri kugle","Crni valjak"],hint:"Dvije kugle = u kvaru.",ref:"str. 41 — dnevni znakovi"},
/* ---- SVJETLA BRODA: triki ---- */
{id:"svl-t1",topic:"svjetla",level:"trik",q:"Tri crvena svjetla okomito = brod u kvaru?",choices:["Ne — tri crvena su 'ograničen svojim gazom'; brod u kvaru su DVA crvena","Da, to je kvar","To je koča","To je peljar"],hint:"Gaz = 3 crvena, kvar = 2 crvena.",ref:"str. 54 — svjetla broda"},
{id:"svl-t2",topic:"svjetla",level:"trik",q:"Crveno svjetlo nad bijelim = ribarica koča?",choices:["Ne — crveno/bijelo je PLIVARICA; koča je ZELENO nad bijelim","Da, to je koča","To je peljar","To je jedrilica"],hint:"Koča = zeleno gore.",ref:"str. 53 — svjetla"},
{id:"svl-t3",topic:"svjetla",level:"trik",q:"Peljarski brod nosi crveno nad bijelim?",choices:["Ne — peljar je BIJELO nad crvenim","Da","Peljar je 3 crvena","Peljar je žuto trepćuće"],hint:"Bijelo gore, crveno dolje.",ref:"str. 53 — peljar"},
/* ---- RADIOFONIJA: napredna ---- */
{id:"rad-n1",topic:"radio",level:"napr",q:"Koliko ukupno radnih VHF kanala postoji i koji su?",choices:["56 kanala: 1–28 i 60–88","100 kanala","Samo 16","10 kanala"],hint:"Između 28 i 60 su rezervirani (meteo).",ref:"str. 41 — VHF kanali"},

/* ============================================================

function svgWrap(inner,w,h){return `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" style="max-width:100%;height:auto" xmlns="http://www.w3.org/2000/svg">${inner}</svg>`;}

/* ---- zajednička SVG paleta ---- */
const SV={sea:"#cfe8f3",seaLt:"#eaf7fc",navy:"#0b2740",steel:"#6f93a6",grid:"#9fc4d8",
  sand:"#ecdcae",sandSt:"#c9a24b",red:"#e23b4e",green:"#1f9d57",yellow:"#f2c200",
  sky:"#0e7fa6",cyan:"#17b6cf",lime:"#c9e637",hull:"#0d2944"};

function windRose(bearing){
  const cx=150,cy=150,R=112;
  const dx=d=>Math.sin(d*Math.PI/180), dy=d=>-Math.cos(d*Math.PI/180);
  const pts=[["N",0],["NE",45],["E",90],["SE",135],["S",180],["SW",225],["W",270],["NW",315]];
  let g=`<defs>
    <radialGradient id="wr-sea" cx="50%" cy="42%" r="66%"><stop offset="0" stop-color="${SV.seaLt}"/><stop offset="1" stop-color="${SV.sea}"/></radialGradient>
    <marker id="wr-ah" markerWidth="12" markerHeight="12" refX="7" refY="4" orient="auto"><path d="M0 0 L9 4 L0 8 Z" fill="${SV.sky}"/></marker></defs>`;
  g+=`<circle cx="${cx}" cy="${cy}" r="${R+8}" fill="url(#wr-sea)" stroke="${SV.navy}" stroke-width="1.5"/>`;
  g+=`<circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="${SV.grid}"/>`;
  for(let d=0;d<360;d+=15){const lg=d%45===0;const r1=lg?R-12:R-6;
    g+=`<line x1="${cx+r1*dx(d)}" y1="${cy+r1*dy(d)}" x2="${cx+R*dx(d)}" y2="${cy+R*dy(d)}" stroke="${SV.steel}" stroke-width="${lg?1.6:.8}"/>`;}

function cardinalMark(type){

function flashAnim(n){
  if(!n) return `<animate attributeName="opacity" values="0;1;0;1;0" keyTimes="0;.2;.4;.6;1" dur="1.1s" repeatCount="indefinite"/>`;
  const on=.28,gap=.3,ecl=1.9; let t=0,times=[],vals=[];
  const push=(tt,v)=>{times.push(tt);vals.push(v);};
  for(let i=0;i<n;i++){push(t,0);push(t+.02,1);push(t+on,1);push(t+on+.02,0);t+=on+gap;}
  const cyc=t+ecl; push(cyc,0);

}

function norm(s){
  let x=(s||'').toString().toLowerCase().replace(/đ/g,'dj').replace(/ß/g,'ss').normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  if(LANG==='de') x=x.replace(/ae/g,'a').replace(/oe/g,'o').replace(/ue/g,'u'); // ä/ö/ü ili ae/oe/ue
  return x.replace(/[^a-z0-9 ]+/g,' ').replace(/\s+/g,' ').trim();
}
function firstNum(s){const m=(s||'').toString().replace(',','.').match(/-?\d+(?:\.\d+)?/);return m?parseFloat(m[0]):NaN;}
function isCorrect(raw,q){
  if(q.num){const v=firstNum(raw); if(!isNaN(v)&&Math.abs(v-q.num.value)<=q.num.tol) return true;}
  const u=norm(raw); if(!u) return false;
  const uTok=u.split(' ').filter(Boolean);
  // duljina zajedničkog početka (korijena) dviju riječi
  const cpl=(a,b)=>{let i=0,m=Math.min(a.length,b.length);while(i<m&&a[i]===b[i])i++;return i;};
  // token se poklapa: identičan, ILI dijele korijen (≥3 slova) a razlikuju se samo u nastavku (do 2 slova sa svake strane).
  // Time 'desnu'≈'desno', 'jugozapada'≈'jugozapad' prolaze, a 'sjeveroistok'≠'sjever' se odbija.
  const tokMatch=(ut,at)=>{
    if(ut===at) return true;
    if(at.length<3) return false;
    const cp=cpl(ut,at);
    return cp>=3 && (ut.length-cp)<=2 && (at.length-cp)<=2;
  };
  // tražena fraza (niz tokena) mora se pojaviti kao uzastopni niz u korisnikovom odgovoru
  const seqMatch=(aTok)=>{
    for(let i=0;i+aTok.length<=uTok.length;i++){
      let ok=true;
      for(let j=0;j<aTok.length;j++){ if(!tokMatch(uTok[i+j],aTok[j])){ok=false;break;} }
      if(ok) return true;
    }
    return false;
  };
  return (q.accept||[]).some(a=>{
    const an=norm(a); if(!an) return false;
    if(an.length<=2) return u===an;               // kratke šifre (ne, se, sw, n, w…) = potpuno poklapanje
    const aTok=an.split(' ').filter(Boolean);
    return aTok.length>0 && seqMatch(aTok);
  });
}

}
function twoIslands(nm){
  const perNm=42,x0=70,y=82,ax=x0,bx=x0+nm*perNm,W=bx+86;

  g+=`<rect x="12" y="18" width="${W-24}" height="118" rx="6" fill="url(#ti-sea)" stroke="${SV.navy}" stroke-width="1.5"/>`;
  g+=island(ax,y,27,19,t('vis.islandA'))+island(bx,y,27,19,t('vis.islandB'));

  g+=`<line x1="${ax+27}" y1="${y}" x2="${bx-27}" y2="${y}" stroke="${SV.red}" stroke-width="2" stroke-dasharray="6 4"/>`;
  g+=`<line x1="${ax+27}" y1="${y-7}" x2="${ax+27}" y2="${y+7}" stroke="${SV.red}" stroke-width="2"/><line x1="${bx-27}" y1="${y-7}" x2="${bx-27}" y2="${y+7}" stroke="${SV.red}" stroke-width="2"/>`;
  g+=`<text x="${(ax+bx)/2}" y="${y-12}" font-size="11" font-weight="800" fill="${SV.red}" text-anchor="middle" font-family="Manrope,sans-serif">? NM</text>`;
  g+=northStar(W-26,40);

  g+=`<text x="${sx}" y="${sy-10}" font-size="9.5" fill="#5d6f7b" font-family="Manrope,sans-serif">${t('vis.scale')}</text>`;
  for(let k=0;k<5;k++){g+=`<rect x="${sx+k*perNm}" y="${sy}" width="${perNm}" height="8" fill="${k%2?'#fff':SV.navy}" stroke="${SV.navy}" stroke-width="1"/>`;}

  return svgWrap(g,W,186);
}
function chartDepth(circled, others){
  const x0=42,y0=30,w=250,h=184;

  g+=`<rect x="${x0}" y="${y0}" width="${w}" height="${h}" fill="url(#cd-sea)" stroke="${SV.navy}" stroke-width="1.5"/>`;
  g+=`<path d="M${x0+10} ${y0+h-30} Q ${x0+90} ${y0+h-70} ${x0+w-20} ${y0+h-40}" fill="none" stroke="${SV.sky}" stroke-width="1" stroke-dasharray="3 3" opacity=".6"/>`;

  g+=`<circle cx="${pts[0][0]}" cy="${pts[0][1]-4}" r="13" fill="none" stroke="${SV.red}" stroke-width="2"><animate attributeName="r" values="13;18;13" dur="1.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;.3;1" dur="1.8s" repeatCount="indefinite"/></circle>`;
  g+=northStar(x0+18,y0+18);
  return svgWrap(g,x0+w+20,y0+h+20);
}
